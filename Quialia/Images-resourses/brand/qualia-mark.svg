<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Qualia mark, redrawn as vectors after tracing the raster lockup in this
       folder on a 38x19 sample grid and normalising the result.

       Two strokes, not a filled triangle: the charcoal is only the TOP edge and
       the LEFT leg of a downward chevron. The right leg is missing on purpose —
       the green V stands in for it. Getting that wrong (drawing a closed
       triangle with a check inside) is the usual way this mark is mis-copied.

       The green tip clears the charcoal bar, up and to the right of where the
       bar stops. Colours sampled from the lockup: #3D3F41, #6CC273. -->
  <path d="M12 14H78M12 14L52 88" stroke="#3D3F41" stroke-width="17" fill="none"/>
  <path d="M45 35L68 76L92 14" stroke="#6CC273" stroke-width="15" fill="none"/>
</svg>
