<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Drive: Qualia · SkillCloud Academy</title>
  <link rel="stylesheet" href="../assets/css/topbar.css">
<link rel="stylesheet" href="../assets/css/styles.css">
  <!-- Chrome owned by the shared lesson engine (walkthrough overlay, toasts, doc modal).
       Loaded before qualia.css so the module can override its --sim-* tokens. -->
  <link rel="stylesheet" href="../assets/css/sim-engine.css">
  <link rel="stylesheet" href="qualia.css">
  <!-- Core facade sections (Contacts, Calendar, Accounting, Reports, Compliance, Admin).
       After qualia.css so it can build on the same --qz-* tokens. -->
  <link rel="stylesheet" href="qualia-shell.css">
  <style>
    html, body { height: 100%; }
    body.td-fullscreen { display: flex; flex-direction: column; height: 100vh; overflow: hidden; margin: 0; }

    .td-strip { flex: none; background: var(--v-navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 22px; height: 36px; font-size: 12.5px; }
    .td-strip-back { color: #d3e2f0; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 5px; flex: none; }
    .td-strip-back:hover { color: #fff; text-decoration: none; }
    .td-strip-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .35); flex: none; }
    .td-strip-app { font-weight: 800; flex: none; }
    .td-strip-app b { color: var(--v-cyan); }
    .td-strip-msg { color: #9fb4c9; margin-left: auto; font-size: 12px; }
    @media (max-width: 640px) { .td-strip-msg { display: none; } }
  </style>
</head>

<body class="h-body td-fullscreen">
  <header class="scbar">
  <a class="scbar-back" href="../index.html#test-drive-open"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg><span>Test Drive</span></a>
  <span class="scbar-id"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg><span class="scbar-name">SkillCloud</span></span>
  <span class="scbar-sep">/</span>
  <span class="scbar-ctx">Qualia<em>Test drive</em></span>
  <div class="scbar-right">
    <span class="scbar-safe"><i></i>Practice sandbox<span>&middot; nothing is saved</span></span>
  </div>
</header>

  <div class="qz-app" id="qzApp">
    <!-- Qualia Core chrome (dark topbar + section nav), not Connect. A VA of a title/escrow
         team works in Core; the previous shell reproduced the Connect buyer/agent portal,
         which is a different product with a different layout. -->
    <div class="qz-topbar" id="qzTopbar" style="display:none">
      <!-- The logo is a button in the real product: it opens the Home landing with its
           Orders / Order Queue / Action Queue / Tasks / Notifications strip. -->
      <button type="button" class="qz-brand" id="qzBrand" onclick="qzGotoHome()" title="Home">
        <span class="mark"><img src="Images-resourses/brand/qualia-mark-light.svg" alt=""></span><span class="wordmark">Qualia</span>
      </button>
      <div class="qz-tabs" id="qzCoreSections"></div>
      <div class="qz-search"><input type="text" id="qzTopSearchInput" placeholder="Find order&hellip;" oninput="qzTopSearch(this.value)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>

      <!-- The course lives outside Qualia, so its entry point is styled to look like it:
           an academy-coloured pill, deliberately unlike the product's own topbar icons.
           It used to be an eighth section tab next to Admin, which read as part of the
           product and is why trainees found lesson material inside an order. -->
      <button type="button" class="qz-lessons-btn" id="qzLessonsBtn" onclick="qzGotoLessons()" title="Training Course &amp; Lessons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></svg>
        <span class="lbl">Training</span>
      </button>

      <div class="qz-top-icons">
        <button type="button" class="qz-top-ic" id="qzDocBtn" title="Document Center" onclick="qzToggleDocDropdown(event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></button>
        <div class="qz-topbar-dropdown qz-doc-dropdown" id="qzDocDropdown" onclick="event.stopPropagation()"></div>

        <button type="button" class="qz-top-ic" id="qzMailBtn" title="Connect Messages" onclick="qzToggleMessagesDropdown(event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="dot-badge" id="qzMailBadge">3</span></button>
        <div class="qz-topbar-dropdown qz-messages-dropdown" id="qzMessagesDropdown" onclick="event.stopPropagation()"></div>

        <div class="qz-bell" id="qzBell" onclick="qzToggleBellDropdown(event)" title="Notifications & Activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="n" id="qzBellBadge">14</span>
          <div class="qz-bell-dropdown" id="qzBellDropdown" onclick="event.stopPropagation()"></div>
        </div>

        <div class="qz-user" id="qzUserBtn" onclick="qzToggleUserDropdown(event)" title="User Profile & Settings"><span class="av" id="qzUserAvatar">A</span><span id="qzUserLabel">Alex</span><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          <div class="qz-topbar-dropdown qz-user-dropdown" id="qzUserDropdown" onclick="event.stopPropagation()"></div>
        </div>
      </div>
    </div>

    <!-- Multi-order tab strip: Core keeps several files open at once, and Lesson 13 is
         built entirely on that mechanic. -->
    <div class="qz-topstrip" id="qzTopStrip" style="display:none">
      <div class="qz-ordertabs" id="qzOrderTabs"></div>
      <!-- Lesson breadcrumb rides along the right edge of this strip rather than sitting in
           .qz-body: that container is display:flex in Core, so a banner child there became a
           full-height column beside the app and wasted ~305px of width. Here it costs no
           vertical space at all, since the strip already exists and its right half was empty. -->
      <div id="qzLessonBanner"></div>
    </div>

    <div class="qz-body">
      <div id="qzLoginWrap"></div>
      <div id="qzRoot" style="display:none"></div>
    </div>
  </div>

  <!-- The toast host, document modal and walkthrough overlay are injected by
       SimEngine.init() (see assets/js/sim-engine.js → simMarkupHTML), so the two
       simulator shells cannot drift apart from the engine that drives them. -->

  <div class="qz-tour" id="qzTour">
    <div class="qz-tour-highlight" id="qzTourHighlight"></div>
    <div class="qz-tour-tip" id="qzTourTip" role="dialog" aria-modal="true" aria-label="Guided tour">
      <!-- aria-live because focus stays on Next between steps: without it a screen reader
           announces the button again and never the step that just changed underneath it. -->
      <div class="qz-tour-tip-body" id="qzTourTipBody" aria-live="polite"></div>
      <div class="qz-tour-tip-foot">
        <span id="qzTourProgress"></span>
        <div class="qz-tour-tip-btns">
          <button type="button" onclick="qzTourSkip()">Skip</button>
          <button type="button" id="qzTourBackBtn" onclick="qzTourBack()">Back</button>
          <button type="button" id="qzTourNextBtn" class="primary" onclick="qzTourNext()">Next</button>
        </div>
      </div>
      <!-- Distinct from Skip on purpose. Skip means "not now" and the tour returns on the
           next launch; this means "never again" and is the only control that says so. -->
      <label class="qz-tour-optout">
        <input type="checkbox" id="qzTourOptOut" onchange="qzTourSetOptOut(this.checked)">
        Don't show this tour when I launch Qualia
      </label>
    </div>
  </div>

  <script src="../assets/js/app-core.js?v=20260902"></script>
  <script src="../assets/js/site.js?v=20260902"></script>
  <script src="../assets/js/sim-engine.js?v=20260902"></script>
  <script src="qualia-data.js?v=20260902"></script>
  <script src="qualia-catalog-data.js?v=20260902"></script>
  <!-- Facade data before qualia-app.js, renderers after it: qualia-shell.js reads helpers
       (esc, fmtDate, qzGetOrder, simToast) that qualia-app.js defines. -->
  <script src="qualia-shell-data.js?v=20260902"></script>
  <script src="qualia-app.js?v=20260902"></script>
  <script src="qualia-shell.js?v=20260902"></script>
  <script src="qualia-tour.js?v=20260902"></script>
  <!-- Inert unless ?selftest=1 is in the URL. Measures that the clock shift reached the data,
       the course prose and the documents — see the header of the file. -->
  <script src="qualia-selftest.js?v=20260902"></script>
  <script>
    const tdMe = SCApp.requireAuth();
  </script>
</body>

</html>
