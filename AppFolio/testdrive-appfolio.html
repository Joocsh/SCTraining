<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppFolio Test Drive — SkillCloud Academy</title>

  <link rel="stylesheet" href="../assets/css/styles.css">
  <!-- sim-engine.css first, so appfolio.css can override its --sim-* tokens.
       The walkthrough overlay, toasts and document modal are injected by
       SimEngine.init(); none of that markup is written by hand here. -->
  <link rel="stylesheet" href="../assets/css/sim-engine.css">
  <link rel="stylesheet" href="appfolio.css">
  <link rel="stylesheet" href="appfolio-shell.css">
</head>
<body class="h-body af-fullscreen">

  <!-- Shared Test Drive strip.
       Deliberately WITHOUT an onclick that resets progress. The other two
       modules call their reset here, which means leaving a test drive silently
       erases the visitor's course record. That is a bug this module does not
       inherit: walking out of a demo must never cost anyone their transcript. -->
  <div class="td-strip">
    <a class="td-strip-back" href="../index.html#test-drive-open">&larr; Test Drive</a>
    <span class="td-strip-dot"></span>
    <span class="td-strip-app">AppFolio <b>Test Drive</b></span>
    <span class="td-strip-msg">Practice copy only. Nothing here is saved or connected to a real account.</span>
  </div>

  <div class="af-shell">

    <!-- Top bar. In AppFolio this band carries four things and nothing else:
         the logo, a wide search field, and three menus: Add Functionality,
         Help & Training, and the account. There is no Customer Service entry:
         that was this module inventing one.
         There is no + New button — creation actions live in the right rail,
         contextual to the page, which is where a trainee has to learn to look.

         The one addition is the Sandbox/Lesson switch, which the module's own
         contract (prompt 1, §5) requires to be visible in the top bar. It is
         training chrome rather than product, so it is set apart on the right
         and disappears entirely on a ?demo=1 link. -->
    <header class="af-topbar">
      <button type="button" class="af-hamburger" onclick="afToggleSidebar()" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <a class="af-logo" href="#" onclick="afGoto('dashboard');return false;">
        <div class="af-logo-circle">a</div>
        <span class="af-logo-title">Property Manager</span>
      </a>

      <div class="af-topsearch">
        <svg class="af-search-lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/>
        </svg>
        <label class="af-sr-only" for="afGlobalSearch">Search</label>
        <input type="text" id="afGlobalSearch" placeholder="Search AppFolio" oninput="afDemoAction('Global search')">
        <button type="button" class="af-topsearch-btn" onclick="afDemoAction('Global search')" aria-label="Filter Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
        </button>
      </div>

      <div class="af-topbar-right">
        <button type="button" class="af-topmenu" onclick="afDemoAction('Add Functionality')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Add Functionality
          <span class="af-caret" aria-hidden="true">&#9662;</span>
        </button>

        <button type="button" class="af-topmenu" onclick="afDemoAction('Help &amp; Training')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Help &amp; Training
          <span class="af-caret" aria-hidden="true">&#9662;</span>
        </button>

        <!-- The account menu, named for the management company. -->
        <button type="button" class="af-topmenu" onclick="afDemoAction('Account menu')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          </svg>
          First Choice
          <span class="af-caret" aria-hidden="true">&#9662;</span>
        </button>

        <!-- Repainted by afRenderChrome() rather than written here, because it
             has to vanish on a stakeholder link. -->
        <div id="afModeSwitch"></div>
      </div>
    </header>

    <div class="af-layout">

      <!-- Dark sidebar: the eight AppFolio sections and their children. -->
      <aside class="af-sidebar" id="afSidebar"></aside>

      <div class="af-main">
        <!-- Level-1 and level-2 tab strips, painted by afRenderSubnav(). -->
        <div class="af-subnav" id="afSubnav" hidden></div>

        <!-- The lesson banner is a SIBLING of #afRoot, never a child.
             In the Qualia module a banner nested inside a display:flex container
             turned into a 305px column beside the application. Keeping it out
             here also means it survives a view change without being repainted. -->
        <div id="afLessonBanner" hidden></div>

        <main class="af-body">
          <div id="afRoot"></div>
          <footer class="af-footer">
            <button type="button" onclick="afDemoAction('Privacy policy')">Privacy</button>
            <span aria-hidden="true">|</span>
            <button type="button" onclick="afDemoAction('Help &amp; Training')">Help &amp; Training</button>
            <span aria-hidden="true">|</span>
            <button type="button" onclick="afDemoAction('Make a Suggestion')">Make a Suggestion &raquo;</button>
          </footer>
        </main>
      </div>

      <!-- Contextual right rail, painted by afRenderRail(). -->
      <aside class="af-rail" id="afRail" hidden></aside>

      <!-- Assistant / Tasks / Support. Always visible; this is how the
           Tasks panel is reopened once it has been dismissed. -->
      <nav class="af-railstrip" id="afRailStrip" aria-label="Panels"></nav>

    </div>
  </div>

  <!-- Backdrop for the mobile nav drawer. -->
  <div class="af-nav-backdrop" onclick="afToggleSidebar(false)"></div>

  <!-- Guided tour overlay. Positioned by appfolio-tour.js. -->
  <div class="af-tour" id="afTour" hidden>
    <div class="af-tour-ring" id="afTourRing"></div>
    <div class="af-tour-tip" id="afTourTip" role="dialog" aria-modal="true"></div>
  </div>

  <script src="../assets/js/app-core.js"></script>
  <script src="../assets/js/sim-engine.js"></script>
  <script src="appfolio-data.js"></script>
  <script src="appfolio-catalog-data.js"></script>
  <script src="appfolio-app.js"></script>
  <script src="appfolio-shell.js"></script>
  <script src="appfolio-tour.js"></script>
  <!-- Inert unless ?selftest=1 is in the URL. Runs the module's own assertions
       against the real DOM and reports on screen, which is the only way to check
       the things a Node harness cannot see: console noise, missing form fields,
       horizontal overflow. -->
  <script src="appfolio-selftest.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.SCApp && SCApp.requireAuth) SCApp.requireAuth();
    });
  </script>
</body>
</html>
