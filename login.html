<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Skill Cloud Academy</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.auth-tabs{display:flex;gap:6px;background:#f1f5f9;border-radius:999px;padding:4px;margin:4px 0 18px}
.auth-tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 12px;font:inherit;font-weight:800;font-size:14px;color:#5b6b7e;cursor:pointer}
.auth-tabs button.on{background:#fff;color:#0a2647;box-shadow:0 2px 8px rgba(10,38,71,.08)}
.auth-msg{display:none;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.auth-msg.show{display:block}
.auth-msg.bad{background:#fdf1ee;color:#8f3020}
.auth-msg.good{background:#eefaf3;color:#1c6e41}
.auth-link{display:inline-block;margin-top:12px;padding:0;border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:#0fa6b6;cursor:pointer}
.auth-link:hover{color:#0a2647}
.auth-hint{font-size:12.5px;color:#5b6b7e;margin-top:6px}
.auth-submit[disabled]{opacity:.6;cursor:wait}
[hidden]{display:none!important}
</style>
</head>
<body>
<nav class="nav" id="nav"><div class="nav-inner">
  <a class="brand" href="index.html"><img src="assets/img/skillcloud-navlogo.png" alt="Skill Cloud Staffing"></a>
  <span class="spacer"></span>
</div></nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 id="authTitle">Sign in</h1>
    <p class="sub" id="authSub">Use the account your team gave you. The Academy picks up wherever you left off, on any device.</p>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="on" data-mode="signin" role="tab" aria-selected="true">Sign in</button>
      <button type="button" data-mode="signup" role="tab" aria-selected="false">Create account</button>
    </div>

    <div class="auth-msg" id="authMsg" role="alert"></div>

    <form id="authForm" novalidate>
      <div class="auth-field" id="nameField" hidden>
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" placeholder="Your name and last name">
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@company.com" required>
      </div>
      <div class="auth-field" id="passField">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
        <p class="auth-hint" id="passHint" hidden>At least 6 characters.</p>
      </div>
      <button type="submit" class="btn v-cyan auth-submit" id="authSubmit">Sign in</button>
    </form>
    <button type="button" class="auth-link" id="forgotBtn">Forgot your password?</button>
  </div>
</div>

<script src="assets/js/app-core.js?v=20261021c"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var next = params.get('next');
  var mode = 'signin';
  var $ = function(id){ return document.getElementById(id); };

  function msg(text, kind){ var m = $('authMsg'); m.textContent = text || ''; m.className = 'auth-msg' + (text ? ' show ' + (kind || 'bad') : ''); }
  function setMode(m){
    mode = m;
    document.querySelectorAll('.auth-tabs button').forEach(function(b){ var on = b.dataset.mode === m; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    var up = m === 'signup', reset = m === 'reset', recover = m === 'recover';
    document.querySelector('.auth-tabs').hidden = reset || recover;
    $('nameField').hidden = !up;
    $('email').parentNode.hidden = recover;
    $('passField').hidden = reset;
    $('passHint').hidden = !(up || recover);
    $('forgotBtn').hidden = m !== 'signin';
    $('password').autocomplete = up || recover ? 'new-password' : 'current-password';
    $('authTitle').textContent = up ? 'Create your account' : reset ? 'Reset your password' : recover ? 'Choose a new password' : 'Sign in';
    $('authSub').textContent = up ? 'Use your work email. Your progress will follow you on any device.'
      : reset ? 'We will email you a link to choose a new password.'
      : recover ? 'Type the new password for your account.'
      : 'Use the account your team gave you. The Academy picks up wherever you left off, on any device.';
    $('authSubmit').textContent = up ? 'Create account' : reset ? 'Send the link' : recover ? 'Save the new password' : 'Sign in';
    msg('');
  }
  document.querySelectorAll('.auth-tabs button').forEach(function(b){ b.onclick = function(){ setMode(b.dataset.mode); }; });
  $('forgotBtn').onclick = function(){ setMode('reset'); };

  function home(user){
    if(user && user.role === 'admin') return 'admin.html';
    if(user && user.role === 'coach') return 'coach.html';
    if(next) return next;
    var last = user && SCApp.getLastPage(user.id);
    return last || 'index.html';   /* a first sign in lands on the guided home */
  }
  function busy(on){ $('authSubmit').disabled = on; }
  function readable(e){
    var t = (e && e.message) || 'Something went wrong. Try again.';
    if(/invalid login credentials/i.test(t)) return 'That email or password does not match an account.';
    if(/already registered|already been registered/i.test(t)) return 'That email already has an account. Sign in instead.';
    if(/password should be at least/i.test(t)) return 'Your password needs at least 6 characters.';
    if(/rate limit/i.test(t)) return 'Too many attempts. Wait a minute and try again.';
    return t;
  }

  $('authForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('email').value.trim(), pass = $('password').value, name = $('name').value.trim();
    if(mode !== 'recover' && !email){ msg('Type your email.'); return; }
    if((mode === 'signin' || mode === 'signup' || mode === 'recover') && pass.length < 6){ msg('Your password needs at least 6 characters.'); return; }
    if(mode === 'signup' && !name){ msg('Type your full name.'); return; }
    busy(true); msg('');
    SCDB.ready.then(function(){
      if(mode === 'signin') return SCDB.signIn(email, pass).then(function(u){ location.href = home(u); });
      if(mode === 'signup') return SCDB.signUp(name, email, pass).then(function(u){
        if(u) { location.href = home(u); return; }
        msg('Check your email to confirm your account, then sign in.', 'good'); setMode('signin');
      });
      if(mode === 'reset') return SCDB.resetPassword(email).then(function(r){
        if(r && r.error) throw r.error;
        msg('If that email has an account, a reset link is on its way.', 'good');
      });
      if(mode === 'recover') return SCDB.client.auth.updateUser({ password: pass }).then(function(r){
        if(r.error) throw r.error;
        return SCDB.refreshProfile().then(function(u){ msg('Your password was updated.', 'good'); setTimeout(function(){ location.href = home(u); }, 900); });
      });
    }).catch(function(err){ msg(readable(err)); }).then(function(){ busy(false); });
  });

  /* arriving from the reset email */
  if(params.has('reset')){
    SCDB.client.auth.onAuthStateChange(function(ev){ if(ev === 'PASSWORD_RECOVERY') setMode('recover'); });
    setMode('recover');
    return;
  }
  /* already signed in: go straight where they belong */
  SCDB.ready.then(function(u){ if(u) location.href = home(u); });
})();
</script>
</body>
</html>
