<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In · Skill Cloud Academy</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.auth-fresh{display:block;margin-top:10px;padding:0;border:0;background:none;font:inherit;font-size:13px;font-weight:800;color:var(--v-cyan-d,#0fa6b6);cursor:pointer}
.auth-fresh:hover{color:var(--v-navy,#0a2647)}
</style>
</head>
<body>
<nav class="nav" id="nav"><div class="nav-inner">
  <a class="brand" href="index.html"><img src="assets/img/skillcloud-navlogo.png" alt="Skill Cloud Staffing"></a>
  <span class="spacer"></span>
</div></nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="sub">Use the account your team gave you. The Academy picks up wherever you are.</p>

    <div class="auth-err" id="authErr">That email or password doesn't match an account.</div>

    <form id="loginForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@demo" required>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn v-cyan auth-submit">Log In</button>
    </form>

    <div class="auth-demo">
      <b>Demo accounts</b><br>
      Associate: maria@demo / demo123 (Transaction Coordinator)<br>
      Associate: jose@demo / demo123 (Listing Coordinator)<br>
      Admin: admin@demo / admin123
      <button type="button" class="auth-fresh" id="freshBtn">Try it as a brand new associate &rarr;</button>
    </div>
  </div>
</div>

<script src="assets/js/app-core.js?v=20260917"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var next = params.get('next');

  /* demo: a clean associate with no progress, to see the first visit exactly as a new hire does.
     login.html?new=1 does it in one step. */
  function startFresh(){
    var users = JSON.parse(localStorage.getItem('scc_users') || '[]');
    var n = users.filter(function(u){ return /^new\d+@demo$/.test(u.email); }).length + 1;
    var email = 'new' + n + '@demo';
    users.push({ id: 'new_' + Date.now().toString(36), name: 'Daniela Rojas', email: email, password: 'demo123',
      role: 'user', assignedRole: 'tc', avatar: 'D' });
    localStorage.setItem('scc_users', JSON.stringify(users));
    SCApp.login(email, 'demo123');
    window.location.href = 'index.html';
  }
  document.getElementById('freshBtn').addEventListener('click', startFresh);
  if(params.has('new')){ startFresh(); return; }

  // already logged in? go straight where they belong
  var existing = SCApp.currentUser();
  if(existing){
    redirectFor(existing);
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value;
    var pass = document.getElementById('password').value;
    var user = SCApp.login(email, pass);
    var err = document.getElementById('authErr');
    if(!user){
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    redirectFor(user);
  });

  function redirectFor(user){
    if(user.role === 'admin'){
      window.location.href = 'admin.html';
      return;
    }
    if(next){ window.location.href = next; return; }
    var last = SCApp.getLastPage(user.id);
    window.location.href = last || 'index.html'; /* a first sign in lands on the guided home */
  }
})();
</script>
</body>
</html>
