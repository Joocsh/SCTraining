<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Training · SkillCloud Academy</title>
<meta name="description" content="Interactive marketing training on the Sotheby's International Realty tool ecosystem: brand, campaign playbook, the five platforms, and AI prompting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cormorant is used ONLY to depict the Sotheby's serif inside brand lessons. The UI itself uses the SkillCloud stack. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* SkillCloud tokens — same values as assets/css/styles.css */
  --v-navy:#0a2647; --v-navy2:#0f3460; --v-blue:#1565c0; --v-sky:#5aa9e6;
  --v-cyan:#17c3d4; --v-cyan-d:#0fa6b6; --v-ink:#0c1e33; --v-muted:#5b6b7e;
  --v-bg:#f6f9fc; --v-line:#e3eaf1;
  --body:#33465e; --faint:#8fa1b3; --line-2:#cfdbe6; --soft:#eef3f8;
  --good:#1f9e5a; --bad:#d2452f; --warn:#a86e10; --warn-bg:#fbf1dc;
  /* SIR brand colors, shown as subject matter */
  --sir:#002349; --sir-off:#EDECE6; --sir-gold:#b08d3f;
  --shadow:0 2px 10px rgba(10,38,71,.08); --shadow-m:0 6px 22px rgba(10,38,71,.1); --shadow-l:0 8px 30px rgba(10,38,71,.14);
  --radius:14px; --r-sm:10px;
  --side:288px; --top:58px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--v-bg);color:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--v-cyan-d);text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);color:var(--v-navy);letter-spacing:-.5px;line-height:1.2}
h1{font-size:30px;font-weight:900;letter-spacing:-1px}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:800;color:var(--v-navy2)}
h4{font-size:15px;font-weight:800}
b,strong{color:var(--v-ink);font-weight:700}
:focus-visible{outline:2px solid var(--v-cyan-d);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfdbe6;border-radius:6px;border:3px solid var(--v-bg)}
::-webkit-scrollbar-thumb:hover{background:#b4c4d4}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--v-cyan-d)}

/* ============ TOP BAR ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:#fff;border-bottom:1px solid var(--v-line);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:120}
.tb-back{display:inline-flex;align-items:center;gap:7px;color:var(--v-muted);font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:var(--r-sm)}
.tb-back:hover{background:var(--soft);color:var(--v-navy)}
.tb-brand{font-family:var(--display);font-size:17px;font-weight:900;letter-spacing:-.6px;color:var(--v-navy);white-space:nowrap}
.tb-brand span{color:var(--v-cyan-d)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-count{font-size:12.5px;color:var(--v-muted);font-weight:600;white-space:nowrap}
.tb-count b{color:var(--v-navy)}
.tb-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--v-muted);font-size:15px}
.tb-btn:hover{background:var(--soft);color:var(--v-navy)}
.burger{display:none}
.tb-prog{position:fixed;top:var(--top);left:0;right:0;height:3px;background:var(--v-line);z-index:121}
.tb-prog i{display:block;height:100%;width:0;background:var(--v-cyan);transition:width .4s cubic-bezier(.4,0,.2,1)}
@media(max-width:960px){.burger{display:grid}.tb-brand{font-size:15px}.tb-count{display:none}}

/* ============ SIDEBAR ============ */
.side{position:fixed;top:calc(var(--top) + 3px);left:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--v-line);overflow-y:auto;z-index:110;padding-bottom:24px;transition:transform .25s ease}
.side-hd{padding:18px 20px 16px;border-bottom:1px solid var(--v-line)}
.side-hd .ttl{font-family:var(--display);font-size:16px;font-weight:800;color:var(--v-navy);letter-spacing:-.4px;line-height:1.3}
.side-hd .sub{font-size:12.5px;color:var(--v-muted);margin-top:3px}
.side-hd .bar{height:6px;border-radius:4px;background:var(--v-line);margin-top:13px;overflow:hidden}
.side-hd .bar i{display:block;height:100%;width:0;background:var(--v-cyan);border-radius:4px;transition:width .4s}
.side-hd .pct{display:flex;justify-content:space-between;font-size:11.5px;color:var(--v-muted);margin-top:7px;font-weight:600}

.mod + .mod{border-top:1px solid var(--v-line)}
.mod-h{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left;transition:background .15s}
.mod-h:hover{background:var(--v-bg)}
.mod-n{width:25px;height:25px;border-radius:50%;background:var(--soft);color:var(--v-navy2);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none;transition:.2s}
.mod.fin .mod-n{background:var(--good);color:#fff}
.mod.active .mod-n{background:var(--v-navy);color:#fff}
.mod-t{flex:1;min-width:0}
.mod-t .nm{display:block;font-size:13.5px;font-weight:700;color:var(--v-ink);line-height:1.35}
.mod-t .ct{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.mod-chev{color:var(--faint);font-size:10px;transition:transform .2s;flex:none}
.mod.open .mod-chev{transform:rotate(90deg)}
.mod-b{display:none;padding:2px 8px 10px}
.mod.open .mod-b{display:block}

.les{width:100%;display:flex;align-items:center;gap:11px;min-height:40px;padding:8px 10px 8px 12px;text-align:left;font-size:13px;color:var(--v-muted);line-height:1.4;border-radius:8px;transition:background .13s,color .13s}
.les:hover{background:var(--v-bg);color:var(--v-ink)}
.les.cur{background:var(--soft);color:var(--v-navy);font-weight:700;box-shadow:inset 3px 0 0 var(--v-cyan);padding:8px 10px 8px 12px}
.les-tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:8px;color:transparent;background:#fff;transition:.2s}
.les.seen .les-tick{background:var(--good);border-color:var(--good);color:#fff}
.les.cur:not(.seen) .les-tick{border-color:var(--v-cyan-d)}
.les-x{flex:1;min-width:0}
.les-kind{display:block;font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--v-cyan-d);text-transform:uppercase;margin-top:2px}
.side-veil{display:none;position:fixed;inset:0;background:rgba(10,38,71,.42);z-index:105}
@media(max-width:960px){
  .side{transform:translateX(-100%);box-shadow:var(--shadow-l)}
  .side.open{transform:none}
  .side-veil.on{display:block}
}

/* ============ STAGE + LESSON LAYOUT ============ */
.stage{position:fixed;top:calc(var(--top) + 3px);left:var(--side);right:0;bottom:0;overflow-y:auto}
@media(max-width:960px){.stage{left:0}}
.lesson{max-width:1180px;margin:0 auto;padding:26px 40px 100px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:700px){.lesson{padding:20px 18px 100px}}

.crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--v-muted);margin-bottom:14px;flex-wrap:wrap}
.crumb .pill{background:var(--v-navy);color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:.5px}
.crumb .sep{color:var(--line-2)}
.head{max-width:880px;margin-bottom:22px}
.head h1{margin-bottom:9px}
.head h1 em{font-style:normal;color:var(--v-cyan-d)}
.head .lead{font-size:16.5px;color:var(--body);margin:0}

/* two column: copy left, recreated visual right */
.lay{display:grid;gap:34px;align-items:start}
.lay.split{grid-template-columns:minmax(0,1fr) minmax(0,1.04fr)}
.lay:not(.split){max-width:820px}
.txt,.med{min-width:0}
.txt > :first-child,.med > :first-child{margin-top:0}
.txt > :last-child,.med > :last-child{margin-bottom:0}
@media(max-width:1040px){
  .lay.split{grid-template-columns:1fr;gap:20px}
  .lesson{max-width:840px}
}
.lesson p{margin-bottom:12px}
.lesson ul,.lesson ol{margin:8px 0 14px 20px}
.lesson li{margin-bottom:7px}
.lesson h2{margin:26px 0 10px}
.lesson h3{margin:20px 0 8px}

/* ============ CONTENT BLOCKS ============ */
.card{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin:16px 0}
.card > :first-child{margin-top:0}
.card > :last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;align-items:stretch}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;align-items:stretch}
.grid2 > .card,.grid3 > .card{margin:0}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.navy{background:linear-gradient(160deg,var(--v-navy),var(--v-navy2));border-color:transparent;color:#c7d7e6}
.navy h2,.navy h3,.navy h4{color:#fff}
.navy b,.navy strong{color:#fff}
.note{border-left:4px solid var(--v-cyan);background:#fff;border-radius:0 var(--r-sm) var(--r-sm) 0;padding:13px 17px;margin:16px 0;font-size:14.5px;box-shadow:var(--shadow)}
.note b{color:var(--v-navy)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.note.tip{border-left-color:var(--v-cyan);background:#e9f9fb}
.kv{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--v-line)}
.kv:last-child{border-bottom:none;padding-bottom:0}
.kv:first-child{padding-top:0}
.kv .k{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--v-cyan-d);width:124px;flex:none;padding-top:2px}
@media(max-width:600px){.kv{flex-direction:column;gap:4px}.kv .k{width:auto}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:1px;background:var(--v-line);border:1px solid var(--v-line);border-radius:var(--radius);overflow:hidden;margin:16px 0}
.stats .s{background:#fff;padding:15px 10px;text-align:center}
.stats .s b{display:block;font-family:var(--display);font-size:25px;font-weight:900;color:var(--v-navy);letter-spacing:-1px;line-height:1.1}
.stats .s span{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--v-muted)}

/* timeline */
.tl{position:relative;margin:14px 0;padding-left:24px;border-left:2px solid var(--v-line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-31px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--v-cyan);border:3px solid var(--v-bg)}
.tl-i .yr{font-size:11.5px;font-weight:800;letter-spacing:.8px;color:var(--v-cyan-d)}
.tl-i h4{margin:3px 0 4px}
.tl-i p{font-size:14.5px;margin:0}

/* steps */
.steps{counter-reset:st;display:grid;gap:10px;margin:14px 0}
.step{display:flex;gap:14px;background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);align-items:flex-start;transition:border-color .18s,transform .18s}
.step:hover{border-color:var(--v-cyan);transform:translateX(3px)}
.step::before{counter-increment:st;content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--v-navy);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}
.step h4{margin-bottom:2px}
.step h4 i{font-style:normal;color:var(--v-cyan-d)}
.step p{font-size:13.5px;margin:0}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin:16px 0}
.tool{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;text-align:left;display:flex;flex-direction:column}
.tool:hover{transform:translateY(-3px);box-shadow:var(--shadow-m);border-color:var(--v-cyan)}
.tool .tn{font-family:var(--display);font-size:16px;font-weight:800;color:var(--v-navy);letter-spacing:-.4px}
.tool .tr{font-size:12.5px;color:var(--v-muted);margin-top:4px;flex:1}
.tool .tg{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--v-cyan-d);text-transform:uppercase;margin-top:9px}

/* accordion */
.acc{border:1px solid var(--v-line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:13px 17px;font-size:14.5px;font-weight:700;color:var(--v-navy);text-align:left}
.acc-h:hover{background:var(--v-bg)}
.acc-h .ic{width:23px;height:23px;border-radius:7px;background:var(--soft);color:var(--v-navy2);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.acc-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s;font-size:11px}
.acc.open .chev{transform:rotate(90deg)}
.acc.open .ic{background:var(--v-cyan);color:#03282c}
.acc-b{display:none;padding:0 17px 15px 52px;font-size:14.5px}
.acc.open .acc-b{display:block}
.acc-b p:last-child{margin-bottom:0}

/* table */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--v-line);margin:14px 0}
.tbl th{background:var(--v-navy);color:#fff;font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:10px 13px;text-align:left;font-weight:800}
.tbl td{padding:11px 13px;border-top:1px solid var(--v-line);font-size:14px;vertical-align:top}
.tbl td.k{font-weight:800;color:var(--v-navy);white-space:nowrap}

/* ==================================================================
   RECREATED VISUALS — every slide from the deck rebuilt in HTML/CSS
   ================================================================== */
.fig{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:0 0 14px}
.fig-b{padding:20px}
.fig-b.sir{background:var(--sir-off)}
.fig-b.navy{background:var(--sir);border-color:transparent}
.fig-cap{font-size:11.5px;color:var(--v-muted);padding:9px 14px;border-top:1px solid var(--v-line);background:#fbfcfd}
.fig-cap b{color:var(--v-navy)}

/* Sotheby's wordmark, drawn in type */
.mark{text-align:center;color:var(--sir);line-height:1}
.mark .n{font-family:var(--serif);font-size:clamp(20px,3.4vw,30px);font-weight:600;letter-spacing:-.4px;display:block}
.mark .s{font-family:var(--sans);font-size:clamp(6px,.95vw,8px);letter-spacing:.34em;text-transform:uppercase;font-weight:600;margin-top:5px;display:block}
.mark.light{color:#fff}
.mark.sm .n{font-size:17px}.mark.sm .s{font-size:5.5px}

/* the 1 of 1 lockup */
.one1{font-family:var(--serif);color:var(--sir);text-align:center;line-height:1;font-size:clamp(34px,6vw,58px);font-weight:500}
.one1 i{font-style:italic}
.one1.light{color:#fff}

/* app UI mockup */
.mock{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#fff}
.mock-bar{background:var(--sir);padding:8px 12px;display:flex;align-items:center;gap:7px}
.mock-bar i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);display:block}
.mock-bar span{margin-left:8px;font-family:var(--mono);font-size:10px;color:#8fa9c2}
.mock-body{display:grid;grid-template-columns:74px 1fr;min-height:180px}
.mock-body.full{grid-template-columns:1fr}
.mock-nav{background:#f2f6fa;border-right:1px solid var(--v-line);padding:11px 9px;display:flex;flex-direction:column;gap:7px}
.mock-nav i{display:block;height:6px;border-radius:3px;background:#d8e2ec}
.mock-nav i.on{background:var(--v-cyan)}
.mock-nav i.w70{width:70%}.mock-nav i.w85{width:85%}.mock-nav i.w55{width:55%}
.mock-main{padding:13px}
.mock-hd{height:9px;width:42%;border-radius:4px;background:#c6d4e1;margin-bottom:11px}
.mock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mock-grid.c2{grid-template-columns:repeat(2,1fr)}
.mock-tile{border:1px solid var(--v-line);border-radius:7px;padding:8px;background:#fff}
.mock-tile .ph{height:32px;border-radius:5px;background:linear-gradient(135deg,#d9e5f0,#bed0e0);margin-bottom:6px}
.mock-tile .ph.g{background:linear-gradient(135deg,#d6ebe2,#b6d9c9)}
.mock-tile .l{height:5px;border-radius:3px;background:#dde5ec;margin-bottom:4px}
.mock-tile .l.s{width:58%;background:#e9eff5;margin-bottom:0}
.mock-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--v-line);font-size:11px;color:var(--v-muted)}
.mock-row:last-child{border-bottom:none}
.mock-row .dot{width:7px;height:7px;border-radius:50%;background:var(--v-cyan);flex:none}
.mock-row .grow{flex:1;height:5px;border-radius:3px;background:#dde5ec}

/* bar chart for analytics */
.bars{display:flex;align-items:flex-end;gap:7px;height:96px;padding-top:6px}
.bars i{flex:1;background:linear-gradient(180deg,var(--v-cyan),#0d93a1);border-radius:3px 3px 0 0;display:block}
.bars-x{display:flex;gap:7px;margin-top:6px}
.bars-x span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--faint)}

/* layout principle diagrams */
.ldemo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbox{background:var(--sir-off);border:1px solid var(--line-2);border-radius:8px;padding:12px;aspect-ratio:4/3;display:flex;flex-direction:column}
.lbox.center{align-items:center;justify-content:center;text-align:center;gap:8px}
.lbox .img{background:#c9cec4;border-radius:4px;flex:1;min-height:0}
.lbox .img.half{flex:0 0 52%}
.lbox .img.sm{flex:0 0 24%}
.lbox .ln{height:5px;border-radius:3px;background:var(--sir);opacity:.35}
.lbox .ln.w60{width:60%}.lbox .ln.w40{width:40%}.lbox .ln.w80{width:80%}
.lbox-l{font-size:11px;font-weight:700;color:var(--v-muted);text-align:center;margin-top:7px}

/* logo clear space */
.clear{background:var(--sir-off);border:1px solid var(--line-2);border-radius:8px;padding:26px;position:relative}
.clear .guide{border:1.5px dashed rgba(0,35,73,.3);padding:22px;display:grid;place-items:center}
.clear .sq{position:absolute;width:22px;height:22px;background:rgba(23,195,212,.28);border:1px solid var(--v-cyan-d);display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--sir);font-weight:600}
.clear .sq.tl{top:26px;left:26px}.clear .sq.br{bottom:26px;right:26px}

/* logo on color */
.oncolor{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.oncolor div{border-radius:8px;padding:18px 8px;display:grid;place-items:center;border:1px solid var(--line-2)}
.oncolor .b1{background:var(--sir);border-color:transparent}
.oncolor .b2{background:var(--sir-off)}
.oncolor .b3{background:#fff}

/* swatches */
.sws{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
@media(max-width:700px){.sws{grid-template-columns:1fr}}
.sw{border-radius:var(--radius);overflow:hidden;border:1px solid var(--v-line);box-shadow:var(--shadow);cursor:pointer;background:#fff;transition:.18s;text-align:left;width:100%}
.sw:hover{transform:translateY(-3px);box-shadow:var(--shadow-m)}
.sw .chip{height:74px;position:relative;display:block}
.sw .chip::after{content:'Copy hex';position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:rgba(10,38,71,.42);opacity:0;transition:opacity .18s}
.sw:hover .chip::after{opacity:1}
.sw .info{padding:11px 13px;display:block}
.sw .nm{font-weight:800;color:var(--v-ink);font-size:13.5px;display:block}
.sw .vals{font-family:var(--mono);font-size:11px;color:var(--v-muted);margin-top:4px;line-height:1.7;display:block}

/* type specimen */
.spec .r{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;align-items:baseline;border-bottom:1px solid var(--v-line);padding:13px 0}
.spec .r:first-child{padding-top:0}
.spec .r:last-child{border-bottom:none;padding-bottom:0}
.spec .who{font-family:var(--mono);font-size:10.5px;color:var(--v-muted);text-align:right;line-height:1.7}
@media(max-width:640px){.spec .r{grid-template-columns:1fr}.spec .who{text-align:left}}
.d-h1{font-family:var(--serif);font-size:clamp(24px,3.6vw,34px);color:var(--sir);font-weight:500;line-height:1.15}
.d-h2{font-family:var(--serif);font-size:23px;color:var(--sir);font-weight:600}
.d-sub{font-size:15.5px;font-weight:700;color:var(--v-ink)}
.d-body{font-size:14.5px}

/* shapes */
.shapes{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.shp{background:#c9cec4;width:66px;border:1px solid var(--line-2)}
.s-rect{height:84px}
.s-oval{height:84px;border-radius:50%/44%}
.s-arch{height:84px;border-radius:33px 33px 0 0}
.s-curve{height:84px;border-radius:20px 4px 20px 4px}
.s-step{height:84px;clip-path:polygon(0 12%,12% 12%,12% 0,88% 0,88% 12%,100% 12%,100% 88%,88% 88%,88% 100%,12% 100%,12% 88%,0 88%)}
.shp-l{font-size:11px;font-weight:600;color:var(--v-muted);text-align:center;margin-top:7px}

/* photography grid */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid div{aspect-ratio:4/3;border-radius:6px;display:grid;place-items:end;padding:7px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pg1{background:linear-gradient(150deg,#7d94a8,#4a6478)}
.pg2{background:linear-gradient(150deg,#b8a68c,#8a7657)}
.pg3{background:linear-gradient(150deg,#6f8a7c,#415b4f)}
.pg4{background:linear-gradient(150deg,#a08d94,#6d5b62)}
.pg5{background:linear-gradient(150deg,#8fa3b5,#5b7288)}
.pg6{background:linear-gradient(150deg,#c0b099,#948063)}

/* email + phone mockups */
.mail{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
.mail-hero{background:linear-gradient(150deg,#31465e,#16283d);padding:20px 16px;text-align:center}
.mail-hero .kick{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#8fd9e2;font-weight:700}
.mail-hero .h{font-family:var(--serif);color:#fff;font-size:19px;margin-top:5px;line-height:1.2}
.mail-b{padding:14px 16px}
.mail-b .l{height:5px;border-radius:3px;background:#dde5ec;margin-bottom:6px}
.mail-b .l.s{width:62%}
.mail-cta{background:var(--v-cyan);color:#03282c;border-radius:6px;padding:7px;text-align:center;font-size:10.5px;font-weight:800;margin-top:10px}
.phone{width:132px;margin:0 auto;border:7px solid #1c2a3a;border-radius:18px;overflow:hidden;background:#fff}
.phone .top{height:14px;background:#1c2a3a}

/* prompt library */
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.ptab{border:1.5px solid var(--line-2);border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:700;color:var(--v-muted);background:#fff;transition:.16s}
.ptab:hover{border-color:var(--v-navy);color:var(--v-navy)}
.ptab.on{background:var(--v-navy);border-color:var(--v-navy);color:#fff}
.pc{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.pc-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 17px;text-align:left}
.pc-h:hover{background:var(--v-bg)}
.pc-h .t{font-weight:800;color:var(--v-navy);font-size:14px;display:block}
.pc-h .s{font-size:12.5px;color:var(--v-muted);margin-top:2px;display:block}
.pc-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s;flex:none;font-size:11px}
.pc.open .chev{transform:rotate(90deg)}
.pc-b{display:none;padding:0 17px 15px}
.pc.open .pc-b{display:block}
.ing{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ing span{font-size:10px;font-weight:800;letter-spacing:.5px;border-radius:5px;padding:3px 9px;text-transform:uppercase}
.i-role{background:#e3edf9;color:#1c5290}
.i-ctx{background:#efe9fb;color:#5b3ea8}
.i-task{background:#fbe9e2;color:#a0452c}
.i-fmt{background:#e2f4ea;color:#1f7a4a}
.pre{background:var(--v-navy);color:#d7e5f2;border-radius:var(--r-sm);padding:15px 17px;font-family:var(--mono);font-size:12px;line-height:1.8;white-space:pre-wrap;position:relative;word-break:break-word}
.pre .role{color:#8ec3f0}.pre .ctx{color:#c4b1ef}.pre .task{color:#f0b096}.pre .fmt{color:#93dcb2}
.pcopy{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.14);border-radius:7px;padding:5px 11px;font-size:11px;color:#e0ecf6;font-family:var(--sans);font-weight:700}
.pcopy:hover{background:var(--v-cyan);color:#03282c}
.pwhy{font-size:13.5px;color:var(--v-muted);margin-top:10px;border-left:3px solid var(--v-cyan);padding-left:12px}
.pwhy b{color:var(--v-navy)}

/* before / after prompt comparison */
.ba{display:grid;gap:12px}
.ba-c{border-radius:var(--r-sm);padding:14px 16px;font-size:13.5px;border:1px solid}
.ba-c .tag{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;display:block;margin-bottom:6px}
.ba-bad{background:#fdf1ee;border-color:#f2ccc2}
.ba-bad .tag{color:var(--bad)}
.ba-good{background:#eaf7f0;border-color:#bfe3d0}
.ba-good .tag{color:var(--good)}
.ba-c em{font-style:normal;color:var(--v-ink);font-weight:600}

/* quiz */
.quiz{background:linear-gradient(160deg,var(--v-navy),var(--v-navy2));border-radius:var(--radius);color:#c7d7e6;padding:24px 26px;margin:0;box-shadow:var(--shadow-m)}
.quiz .eyebrow{color:#7ee3ee}
.quiz h2{color:#fff;margin:7px 0 3px}
.quiz .qsub{color:#9fb4c9;font-size:13.5px;margin-bottom:18px}
.qq{margin-bottom:20px}
.qq:last-of-type{margin-bottom:6px}
.qq .qt{font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;display:flex;gap:10px;line-height:1.45}
.qq .qt .n{font-family:var(--mono);font-size:11.5px;color:#7ee3ee;flex:none;padding-top:2px}
.qopt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;color:#e3ecf4;margin-bottom:8px;transition:.15s;line-height:1.45}
.qopt:hover:not(:disabled){border-color:#7ee3ee;background:rgba(255,255,255,.13)}
.qopt:disabled{cursor:default}
.qopt.ok{background:rgba(31,158,90,.32);border-color:#4ad286;color:#fff}
.qopt.no{background:rgba(210,69,47,.3);border-color:#e8907f;color:#fff}
.qfb{font-size:13px;color:#bcd0e2;background:rgba(255,255,255,.07);border-radius:var(--r-sm);padding:10px 14px;margin-top:6px;display:none;border-left:3px solid var(--v-cyan)}
.qfb.show{display:block}
.qscore{display:none;align-items:center;gap:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:15px;margin-top:4px}
.qscore.show{display:flex}
.qscore .num{font-family:var(--display);font-size:25px;font-weight:900;color:#7ee3ee;letter-spacing:-1px}
.qscore .lbl{font-size:13px;color:#9fb4c9}

/* footer nav */
.fnav{position:fixed;bottom:0;left:var(--side);right:0;background:rgba(246,249,252,.97);backdrop-filter:blur(8px);border-top:1px solid var(--v-line);padding:12px 40px;display:flex;align-items:center;gap:14px;z-index:100}
@media(max-width:960px){.fnav{left:0;padding:11px 18px}}
.fbtn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:11px 20px;font-size:13.5px;font-weight:800;transition:.16s;white-space:nowrap}
.fbtn.prev{border:1.5px solid var(--line-2);color:var(--v-muted);background:#fff}
.fbtn.prev:hover:not(:disabled){border-color:var(--v-navy);color:var(--v-navy)}
.fbtn.next{background:var(--v-cyan);color:#03282c;margin-left:auto;box-shadow:0 4px 14px rgba(23,195,212,.3)}
.fbtn.next:hover{background:var(--v-cyan-d);color:#fff}
.fbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.fnav .pos{flex:1;text-align:center;font-size:12.5px;color:var(--v-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnav .pos b{color:var(--v-navy)}
@media(max-width:620px){.fnav .pos{display:none}.fbtn{padding:11px 15px;font-size:13px}}

/* completion */
.finish{background:linear-gradient(160deg,var(--v-navy),var(--v-navy2));border-radius:var(--radius);color:#c7d7e6;padding:40px;text-align:center;box-shadow:var(--shadow-l);max-width:640px;margin:10px auto}
.finish .seal{width:60px;height:60px;border-radius:50%;background:var(--v-cyan);color:#03282c;display:grid;place-items:center;font-size:25px;margin:0 auto 15px}
.finish h2{color:#fff;font-size:26px;margin-bottom:8px}
.finish p{color:#9fb4c9;max-width:440px;margin:0 auto 16px}
.finish .stats{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.18);margin:20px 0}
.finish .stats .s{background:rgba(10,38,71,.55)}
.finish .stats .s b{color:#7ee3ee}
.finish .stats .s span{color:#9fb4c9}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--v-cyan);color:#03282c;border-radius:var(--r-sm);padding:11px 22px;font-size:13.5px;font-weight:800}
.btn:hover{background:var(--v-cyan-d);color:#fff;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.ghost:hover{border-color:#fff;background:rgba(255,255,255,.1)}

/* misc */
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--v-navy);color:#fff;padding:11px 21px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-l);opacity:0;transition:.24s;z-index:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{display:inline-block;font-family:var(--mono);font-size:11px;background:#eef2f6;border:1px solid var(--v-line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--v-muted)}
</style>
</head>
<body>

<script>

/* ============ visual helpers ============ */
const fig=(inner,cap,cls='')=>`<figure class="fig"><div class="fig-b ${cls}">${inner}</div>${cap?`<figcaption class="fig-cap">${cap}</figcaption>`:''}</figure>`;
const MARK=`<span class="mark"><span class="n">Sotheby&rsquo;s</span><span class="s">International Realty</span></span>`;
const MARK_L=`<span class="mark light"><span class="n">Sotheby&rsquo;s</span><span class="s">International Realty</span></span>`;
const MARK_S=`<span class="mark sm"><span class="n">Sotheby&rsquo;s</span><span class="s">International Realty</span></span>`;

/* ============ MODULES ============ */
const MODS=[
 {id:'m1',n:'The brand',d:'Where SIR comes from'},
 {id:'m2',n:'The toolbox',d:'The five platforms'},
 {id:'m3',n:'The 1 of 1 playbook',d:'Brand rules you apply daily'},
 {id:'m4',n:'Propel',d:'Your daily hub'},
 {id:'m5',n:'ActivePipe',d:'Email marketing'},
 {id:'m6',n:'Design Vault',d:'Design studio'},
 {id:'m7',n:'ListTrac',d:'Analytics & reports'},
 {id:'m8',n:'MoxiWorks',d:'CMAs & presentations'},
 {id:'m9',n:'Claude',d:'AI prompting'}
];

const L=[];
/* head = h1 + lead (full width) · txt = left column · med = right column visual */
const add=(m,t,k,head,txt,med)=>L.push({m,t,k,head,txt,med:med||''});

/* ================= M1 ================= */
add('m1','Welcome','Start',
`<h1>Everything the marketing team touches, <em>in one place.</em></h1>
<p class="lead">Nine short modules, one idea per screen. By the end you will know which tool to open for any task, how to keep work on brand, and how to get real leverage out of Claude.</p>`,
`<div class="stats">
  <div class="s"><b>9</b><span>Modules</span></div>
  <div class="s"><b>55</b><span>Lessons</span></div>
  <div class="s"><b>16</b><span>Prompts</span></div>
  <div class="s"><b>~45</b><span>Minutes</span></div>
</div>
<div class="note tip"><b>How to move.</b> Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> or the buttons at the bottom. Every module ends with a short check. Your progress saves automatically, so you can stop and come back.</div>`,
fig(`<div class="one1">1 <i>of</i> 1</div><div style="margin-top:18px">${MARK}</div>`,
   'The campaign standard you will be working inside, recreated here in the same type treatment the brand uses.','sir'));

add('m1','What is Sotheby&rsquo;s International Realty?','Lesson',
`<h1>A premier luxury real estate brokerage.</h1>
<p class="lead">Founded in 1976, operating a global network of more than 1,100 offices across 84 countries.</p>`,
`<div class="stats">
  <div class="s"><b>1976</b><span>Founded</span></div>
  <div class="s"><b>1,100+</b><span>Offices</span></div>
  <div class="s"><b>84</b><span>Countries</span></div>
</div>
<p>Everything else in this training sits on top of that fact. When you place a listing in the SIR system you are not marketing to one city, you are placing it inside a curated global collection that buyers worldwide already trust.</p>`,
fig(`<div style="text-align:center">
  <div class="d-h1" style="margin-bottom:14px">What is Sotheby&rsquo;s<br>International Realty?</div>
  <p style="font-size:13.5px;max-width:300px;margin:0 auto 16px">A premier luxury real estate brokerage that operates a global network of over</p>
  <div style="font-family:var(--serif);color:var(--sir);font-size:34px;line-height:1.1">
    <b style="font-weight:600;color:var(--sir)">1,100</b> <span style="font-size:20px">offices in</span> <b style="font-weight:600;color:var(--sir)">84</b> <span style="font-size:20px">countries.</span>
  </div>
</div>`,'Slide 3 of the deck, rebuilt in HTML.','sir'));

add('m1','Where the brand came from','Lesson',
`<h1>It started at an auction house.</h1>`,
`<div class="tl">
  <div class="tl-i"><div class="yr">MID 1970s</div><h4>A pattern nobody had named</h4><p>The auction house noticed its wealthiest clients were not only buying rare art. They were also buying and selling the estates required to house it.</p></div>
  <div class="tl-i"><div class="yr">1976</div><h4>SIR launches</h4><p>A specialized real estate service for that same clientele, leveraging the trust and prestige of the Sotheby&rsquo;s name to create a seamless pipeline between fine art and luxury property.</p></div>
  <div class="tl-i"><div class="yr">NEXT 30 YEARS</div><h4>A brokerage with a ceiling</h4><p>SIR owned its own offices, so global growth was capped by the capital required to open physical locations.</p></div>
</div>`,
fig(`<div style="text-align:center">
  <div style="font-family:var(--serif);font-style:italic;color:var(--sir-gold);font-size:22px">The Art of Living</div>
  <div style="width:52px;height:1px;background:var(--sir-gold);margin:12px auto"></div>
  <div style="font-family:var(--serif);font-size:44px;color:var(--sir);line-height:1">1976</div>
  <p style="font-size:12.5px;margin:12px auto 0;max-width:280px">Born from the auction house, for clients who collected both art and the homes that held it.</p>
</div>`,'Slide 4, rebuilt.','sir'));

add('m1','The deal that made SIR global','Lesson',
`<h1>2004: from brokerage to franchise.</h1>
<p class="lead">For 30 years SIR owned its own offices, which capped how fast it could grow. The 2004 agreement changed that.</p>`,
`<div class="card">
  <div class="kv"><div class="k">The deal</div><div>Realogy paid <b>$100 million</b> to license the SIR name for <b>50 years</b>, with options to renew.</div></div>
  <div class="kv"><div class="k">The result</div><div>Independent luxury brokerages worldwide could rebrand as SIR: instant prestige of a 280 year old name, still locally owned.</div></div>
  <div class="kv"><div class="k">Early 2026</div><div>Anywhere and Compass merged into <b>Compass International Holdings</b>. SIR keeps its distinct identity as the ultra luxury crown jewel of the portfolio.</div></div>
</div>`,
fig(`<div style="display:grid;gap:9px">
  <div style="border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;background:#fff">
    <div style="font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--v-cyan-d)">2004</div>
    <div style="font-weight:700;color:var(--v-ink);font-size:14px;margin-top:2px">Realogy licenses the name</div>
    <div style="font-size:12.5px;margin-top:3px">$100M &middot; 50 year term &middot; franchise model unlocked</div>
  </div>
  <div style="text-align:center;color:var(--faint);font-size:15px">&#8595;</div>
  <div style="border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;background:#fff">
    <div style="font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--v-cyan-d)">EARLY 2026</div>
    <div style="font-weight:700;color:var(--v-ink);font-size:14px;margin-top:2px">Compass International Holdings</div>
    <div style="font-size:12.5px;margin-top:3px">Anywhere + Compass merge. SIR keeps its own identity.</div>
  </div>
</div>`,'Slide 5, rebuilt as a two step flow.'));

add('m1','The global standard: 1 of 1','Lesson',
`<h1>Not a promotion. <em>A permanent standard.</em></h1>`,
`<p>&ldquo;1 of 1&rdquo; is applied to everything, from local yard signs and social posts to high end print features in <i>The New York Times</i> and <i>Architectural Digest</i>.</p>
<div class="note"><b>What it does.</b> It positions every property, at any price point or location, not as a listing but as a singular, irreplaceable piece within a curated global collection.</div>`,
fig(`<div class="one1 light">1 <i>of</i> 1</div>
<div style="margin-top:20px;display:flex;justify-content:space-between;align-items:flex-end">
  <span style="font-family:var(--serif);font-style:italic;color:#c7d7e6;font-size:15px">Campaign<br>Playbook</span>
  ${MARK_L}
</div>`,'Slide 18 of the deck, rebuilt.','navy'));

add('m1','Your gate: SIR Access','Lesson',
`<h1>One login. Your role defines the toolkit.</h1>
<p class="lead">Accessing the SIR platform is one of the first steps of your day. It is a gated environment where everything you need appears the moment you log in.</p>`,
`<div class="card">
  <ul>
    <li>Secure login with <b>two factor authentication</b>.</li>
    <li>Two main entry points: the <b>SIR platform</b> and <b>Propel</b>.</li>
    <li>Links and resources inside Propel vary by client and account configuration.</li>
  </ul>
</div>
<div class="note warn"><b>Permissions.</b> What your client grants may affect your access. Agree on access levels up front so your workflow never stalls.</div>`,
fig(`<div class="mock">
  <div class="mock-bar"><i></i><i></i><i></i><span>sir access</span></div>
  <div class="mock-body full"><div class="mock-main" style="text-align:center;padding:22px 16px">
    ${MARK_S}
    <div style="margin-top:16px;display:grid;gap:7px;max-width:210px;margin-inline:auto">
      <div style="border:1px solid var(--line-2);border-radius:6px;height:26px;background:#fff"></div>
      <div style="border:1px solid var(--line-2);border-radius:6px;height:26px;background:#fff"></div>
      <div style="background:var(--sir);color:#fff;border-radius:6px;height:26px;display:grid;place-items:center;font-size:10.5px;font-weight:700">Sign in</div>
      <div style="font-size:9.5px;color:var(--faint);margin-top:2px">Two factor verification required</div>
    </div>
  </div></div>
</div>`,'The gated entry point, rebuilt.'));

add('m1','Module 1 check','Quiz','__Q__m1','','');

 {g:'tc',t:'Location specific document checklist · list to close',s:'Master checklist across three phases',

  w:'Specifying the exact city and state unlocks location specific disclosure laws and MLS rules — generic checklists miss these. The three phase structure mirrors the actual transaction lifecycle, so you can use each section as a live tracker and hand it directly to your agent.'},
 {g:'tc',t:'Step by step follow up system · contract to close',s:'Dated action plan with escalations',
  p:[['role','Act as a senior transaction coordinator who manages high volume real estate pipelines and specializes in deadline management and multi party communication.'],

     ['task','Build me a complete step by step follow up action plan from accepted offer through closing day. For each step include: what action needs to happen, who is responsible (TC, listing agent, buyer\'s agent, lender, or escrow), the ideal timeline or deadline, what to do if the other party does not respond within 24 hours, and a ready to send follow up message template I can copy for email or text. Cover every critical milestone: earnest money, inspections, contingency removals, appraisal, loan approval, final walkthrough, and closing day coordination.'],
     ['fmt','Present the plan as a chronological numbered action list grouped by week. Use a consistent format for each step: Action — Responsible party — Deadline — Non-response escalation — Follow-up message template. After the full plan, add a "red flags" section listing 5 warning signs that a transaction is at risk of falling out and what to do immediately if you see them.']],
  w:'Plugging in the real dates means every deadline in the plan is calculated to your actual transaction, not generic "Day 10" advice. The built in follow up message templates mean you never start an email from scratch, and the red flags section gives you an early warning system that most TCs only build after a painful close call.'},
 {g:'tc',t:'Public remarks · MLS listing description',s:'Three strategic versions within the limit',

 {g:'ops',t:'Build a complete SOP · any process',s:'Professional procedure document',

     ['fmt','Format this as a professional document with clear section headings. Use numbered steps for the procedure and tables where relevant (roles, tools). The tone should be direct and instructional — written for someone doing the task for the first time. End with a "common errors" section listing the top 3 mistakes people make when following this process and how to avoid them.']],
  w:'Naming the platform and team structure upfront means the SOP references your actual tools, not generic ones. The "common errors" section at the end is the highest value part — it captures institutional knowledge that normally only lives in a senior employee\'s head, and it is the first thing a new hire will actually read.'},
 {g:'ops',t:'SOP adherence review · audit a submission',s:'Side by side compliance audit with a score',
  p:[['role','Act as a real estate operations compliance reviewer with expertise in auditing agent submissions, transaction files, and internal documents against company SOPs.'],
     ['ctx','I am going to paste in two things: (1) the relevant section of our SOP for [PROCESS NAME — e.g. "new listing intake" / "buyer consultation follow-up" / "offer submission"], and (2) the actual document, completed form, or written record submitted by [AGENT NAME / STAFF MEMBER] for [PROPERTY ADDRESS or CASE REFERENCE]. Our SOP compliance standard requires 100% completion of mandatory fields and steps before a file is considered active. Any deviation must be flagged, logged, and returned for correction within 24 hours.'],
     ['task','Compare the submitted document against the SOP step by step. For every required step or field in the SOP, tell me whether it was completed correctly, completed with errors, or missing entirely. Where something is missing or incorrect, quote the exact SOP requirement it violates and write a brief correction note I can send directly to the agent. Then give me an overall compliance score as a percentage based on steps completed versus total required steps, and a recommendation: approve the file, return for minor corrections, or escalate for review.'],
     ['fmt','Present your findings in three sections: "Passed" (a bulleted list of all compliant items), "Needs correction" (each issue as a numbered item with the SOP clause, what was found, and the correction note), and "Recommendation" (one paragraph with the compliance score and your suggested action). Write the correction notes in a professional but direct tone — they will be copied and sent to the agent as-is.']],
  w:'Pasting both the SOP and the submitted document gives Claude a clear benchmark to audit against — the output is a side by side gap analysis, not a guess. The correction notes written in a ready to send tone save a full round of drafting, and the compliance score gives you a trackable metric across your whole team over time.'},
 {g:'ops',t:'Raw data → executive operations summary',s:'Monthly report leadership actually reads',
  p:[['role','Act as a real estate operations manager preparing a monthly performance report for company leadership.'],
     ['ctx','Below I am pasting our operational data for [MONTH / QUARTER]. This includes: agent activity metrics [PASTE DATA], transaction pipeline summary [PASTE DATA], SOP compliance rates by team [PASTE DATA], and any open escalations or unresolved issues [LIST]. Our leadership team reviews this report every [FREQUENCY] and uses it to make staffing, process, and training decisions. They want facts and recommendations — not filler.'],
     ['task','Analyze this data and produce a complete operations performance report. Cover: a one paragraph executive summary of the period\'s headline results, key metrics broken down by team or department, what improved versus last period and why, what declined and the likely root cause, any process bottlenecks or recurring compliance failures that need to be addressed, a staffing or workload observation if the data supports one, and three specific operational recommendations for the next period with a rationale for each.'],
     ['fmt','Format as a structured report with labeled sections and use plain, direct language — no corporate jargon. Recommendations must be specific and actionable ("implement better follow-up" is not acceptable — "add a mandatory 48-hour follow-up step to the buyer inquiry SOP and track compliance in the CRM" is). End with a one line status indicator: Green (operations running well), Amber (areas of concern), or Red (immediate action required), with a one sentence justification.'],],
  w:'Giving Claude the raw data and asking for root cause analysis — not just a summary — means you get an operations perspective, not a spreadsheet recap. The Green/Amber/Red status line gives leadership an instant read before they open the report, which is how senior decision makers actually consume information.'},
 {g:'ops',t:'Role specific 30 day onboarding roadmap',s:'Week by week plan with daily tasks',
  p:[['role','Act as a real estate operations manager and HR specialist with experience designing structured onboarding programs for brokerage staff.'],
     ['ctx','We have just hired a new [ROLE — e.g. transaction coordinator / listing manager / office administrator / buyer\'s agent]. Their start date is [DATE]. They have [DESCRIBE EXPERIENCE LEVEL — e.g. "3 years in real estate administration but new to our systems" / "no prior real estate experience"]. Our company uses [LIST KEY TOOLS: CRM, transaction platform, communication tools]. The key SOPs they must know within their first 30 days are: [LIST 3–5 PROCESSES]. Their direct manager is [NAME / TITLE] and they will be supported by [BUDDY / MENTOR NAME if applicable].'],
     ['task','Build a complete 30 day onboarding plan for this hire. Organize it by week, with each week having a clear theme and focus area. For each week include: the learning objectives, specific tasks and activities for each day, which SOPs or documents they should read and when, system access and training milestones, check in touchpoints with their manager, and a competency checkpoint at the end of each week with specific criteria for passing. Also include a list of all system access and tool accounts that need to be set up before Day 1, and a welcome message template I can send them the evening before they start.'],
     ['fmt','Present the plan week by week, each in a clearly labeled block. Use a consistent structure: Theme, Objectives, Daily breakdown (Mon–Fri), SOP reading list for that week, End-of-week checkpoint criteria. Keep the daily tasks specific — "review the listing intake SOP and shadow one listing call" not "learn the listing process." End with the Day 1 welcome message template in a separate labeled block, written in a warm and professional tone.'],],
  w:'The daily level specificity is the key difference between a plan someone actually follows and one that sits in a folder. By anchoring each week to a theme and ending with a checkpoint, you build a feedback loop into the onboarding itself — you know whether the hire is on track before the 90 day review, not after. The welcome message template removes a small but real friction point that managers routinely skip.'}
];

/* ============ STATE ============ */
let idx=0, done=[], scores={}, booted=false;
try{
  done=JSON.parse(localStorage.getItem('mt3_done')||'[]');
  scores=JSON.parse(localStorage.getItem('mt3_scores')||'{}');
  idx=+(localStorage.getItem('mt3_idx')||0);
}catch(e){}
if(!(idx>=0&&idx<L.length))idx=0;
const save=()=>{try{
  localStorage.setItem('mt3_done',JSON.stringify(done));
  localStorage.setItem('mt3_scores',JSON.stringify(scores));
  localStorage.setItem('mt3_idx',idx);
}catch(e){}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const modOf=id=>MODS.find(m=>m.id===id);
const modNum=id=>MODS.findIndex(m=>m.id===id)+1;
const lessonsOf=id=>L.map((l,i)=>({...l,i})).filter(l=>l.m===id);
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ============ SIDEBAR ============ */
function renderSide(){
  const cur=L[idx];
  $('#sideNav').innerHTML=MODS.map(mo=>{
    const ls=lessonsOf(mo.id), d=ls.filter(l=>done.includes(l.i)).length;
    const all=d===ls.length, isCur=cur&&cur.m===mo.id;
    return `<section class="mod ${all?'fin':''} ${isCur?'active open':''}">
      <button class="mod-h" onclick="tMod(this)" aria-expanded="${isCur}">
        <span class="mod-n">${all?'&#10003;':modNum(mo.id)}</span>
        <span class="mod-t"><span class="nm">${mo.n}</span><span class="ct">${d}/${ls.length} &middot; ${mo.d}</span></span>
        <span class="mod-chev">&#9656;</span>
      </button>
      <div class="mod-b">${ls.map(l=>`
        <button class="les ${done.includes(l.i)?'seen':''} ${l.i===idx?'cur':''}" onclick="jumpTo(${l.i})">
          <span class="les-tick">&#10003;</span>
          <span class="les-x">${l.t}${l.k==='Quiz'?'<span class="les-kind">Knowledge check</span>':''}</span>
        </button>`).join('')}</div>
    </section>`;
  }).join('');

  const pct=Math.round(done.length/L.length*100);
  $('#tbFill').style.width=pct+'%';
  $('#sideBar').style.width=pct+'%';
  $('#sidePct').textContent=pct+'%';
  $('#sideMeta').textContent=`${done.length} of ${L.length} lessons`;
  $('#tbCount').innerHTML=`<b>${done.length}</b> / ${L.length} lessons`;

  const on=$('.les.cur');
  if(on&&booted){
    const r=on.getBoundingClientRect(), s=$('#side').getBoundingClientRect();
    if(r.top<s.top+70||r.bottom>s.bottom-10)on.scrollIntoView({block:'center'});
  }
}
function tMod(h){const m=h.parentNode;m.classList.toggle('open');h.setAttribute('aria-expanded',m.classList.contains('open'));}
function jumpTo(i){idx=i;render();if(window.innerWidth<=960)closeSide();}
function jump(mid){const i=L.findIndex(l=>l.m===mid);if(i>=0)jumpTo(i);}
function toggleSide(){$('#side').classList.toggle('open');$('#sideVeil').classList.toggle('on');}
function closeSide(){$('#side').classList.remove('open');$('#sideVeil').classList.remove('on');}

/* ============ RENDER ============ */
function render(){
  const l=L[idx], mo=modOf(l.m);
  let body;
  if(l.head.startsWith('__Q__')){
    body=quizHtml(l.head.slice(5));
  }else{
    const split=!!l.med;
    body=`<div class="head">${l.head}</div>
      <div class="lay ${split?'split':''}">
        <div class="txt">${l.txt}</div>
        ${split?`<div class="med">${l.med}</div>`:''}
      </div>`;
  }
  $('#lesson').innerHTML=
    `<div class="crumb"><span class="pill">Module ${modNum(l.m)}</span><span>${mo.n}</span><span class="sep">&rsaquo;</span><span>${l.k}</span></div>${body}`;
  $('#stage').scrollTop=0;

  $('#btnPrev').disabled=idx===0;
  const last=idx===L.length-1, nxt=L[idx+1];
  $('#btnNext').innerHTML=last?'Finish &#10003;':'Next &rarr;';
  $('#posLbl').innerHTML=last?`Last lesson &middot; <b>${l.t}</b>`:`Up next: <b>${nxt.t}</b>`;

  if(l.k!=='Quiz'&&!done.includes(idx))done.push(idx);
  if(l.t==='The prompt library')setTimeout(renderPlib,0);
  renderSide();save();
}
function go(d){
  const l=L[idx];
  if(d>0&&l.k==='Quiz'&&!done.includes(idx)){toast('Answer every question above to continue');return;}
  if(d>0&&idx===L.length-1){showDone();return;}
  idx=Math.max(0,Math.min(L.length-1,idx+d));render();
}

/* ============ QUIZ ============ */
function quizHtml(mid){
  const Q=QUIZ[mid], mo=modOf(mid);
  return `<div class="head"><h1>${mo.n}: <em>knowledge check</em></h1>
  <p class="lead">Answer each question to complete the module. Miss one and the correct answer appears with an explanation, so it still counts as learning.</p></div>
  <div class="lay"><div class="txt"><div class="quiz" data-m="${mid}">
    <span class="eyebrow">Module ${modNum(mid)} &middot; ${Q.q.length} question${Q.q.length>1?'s':''}</span>
    <h2>${Q.t}</h2>
    <p class="qsub">Choose the best answer for each.</p>
    ${Q.q.map((q,qi)=>`<div class="qq" data-q="${qi}">
      <p class="qt"><span class="n">${String(qi+1).padStart(2,'0')}</span><span>${q.q}</span></p>
      ${q.o.map((o,oi)=>`<button class="qopt" onclick="ans(this,${qi},${oi})">${o}</button>`).join('')}
      <div class="qfb"></div>
    </div>`).join('')}
    <div class="qscore" id="qscore"><span class="num" id="qnum"></span><span class="lbl" id="qlbl"></span></div>
  </div></div></div>`;
}
function ans(btn,qi,oi){
  const wrap=btn.closest('.quiz'), mid=wrap.dataset.m, Q=QUIZ[mid], q=Q.q[qi], box=btn.closest('.qq');
  if(box.dataset.done)return;
  box.dataset.done='1';
  box.querySelectorAll('.qopt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok');});
  if(oi!==q.a)btn.classList.add('no');
  const fb=box.querySelector('.qfb');
  fb.innerHTML=(oi===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.e;
  fb.classList.add('show');
  scores[mid]=scores[mid]||{c:0,t:Q.q.length};
  if(oi===q.a)scores[mid].c++;
  if(wrap.querySelectorAll('.qq[data-done]').length===Q.q.length){
    const s=scores[mid];
    $('#qscore').classList.add('show');
    $('#qnum').textContent=s.c+'/'+s.t;
    $('#qlbl').textContent=s.c===s.t?'Perfect. Hit Next to continue.':'Module complete. Review the notes above, then hit Next.';
    if(!done.includes(idx))done.push(idx);
    toast(s.c===s.t?'&#10003; Perfect score':'&#10003; Module complete');
    renderSide();
  }
  save();
}

/* ============ PROMPT LIBRARY ============ */
const KIND={role:'Role',ctx:'Context',task:'Task',fmt:'Format'};
function renderPlib(){
  const el=$('#plib'); if(!el)return;
  el.innerHTML=PROMPTS.map(p=>`<article class="pc" data-g="${p.g}">
    <button class="pc-h" onclick="tCard(this)"><span><span class="t">${p.t}</span><span class="s">${p.s}</span></span><span class="chev">&#9656;</span></button>
    <div class="pc-b">
      <div class="ing">${p.p.map(x=>`<span class="i-${x[0]}">${KIND[x[0]]}</span>`).join('')}</div>
      <div class="pre"><button class="pcopy" onclick="copyPre(this)">Copy</button>${p.p.map(x=>`<span class="${x[0]}">${x[1]}</span>`).join('\n\n')}</div>
      <p class="pwhy"><b>Key move:</b> ${p.w}</p>
    </div></article>`).join('');
}
function pFilter(b){
  $$('.ptab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const g=b.dataset.g;
  $$('.pc').forEach(c=>{c.style.display=(g==='all'||c.dataset.g===g)?'':'none';});
}
function tCard(h){h.parentNode.classList.toggle('open');}
function tAcc(h){h.parentNode.classList.toggle('open');}
function copyPre(btn){
  const c=btn.parentNode.cloneNode(true);c.querySelector('.pcopy').remove();
  navigator.clipboard.writeText(c.innerText.trim()).then(()=>toast('&#10003; Prompt copied'));
}
function copyHex(h){navigator.clipboard.writeText(h).then(()=>toast('&#10003; '+h+' copied'));}

/* ============ COMPLETION ============ */
function showDone(){
  const tot=Object.values(scores).reduce((a,s)=>a+s.t,0), got=Object.values(scores).reduce((a,s)=>a+s.c,0);
  $('#lesson').innerHTML=`<div class="finish">
    <div class="seal">&#10003;</div>
    <span class="eyebrow">Training complete</span>
    <h2>You know the ecosystem.</h2>
    <p>Brand, playbook, the five platforms and the prompt library. You are ready to produce work that passes a brand review the first time.</p>
    <div class="stats">
      <div class="s"><b>${L.length}</b><span>Lessons</span></div>
      <div class="s"><b>${got}/${tot||0}</b><span>Quiz answers</span></div>
      <div class="s"><b>9</b><span>Modules</span></div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="index.html">Back to Home</a>
      <button class="btn ghost" onclick="jumpTo(L.findIndex(l=>l.t==='The prompt library'))">Open the prompt library</button>
    </div>
  </div>`;
  $('#stage').scrollTop=0;
}
function resetAll(){
  if(!confirm('Reset your progress and start the training from the beginning?'))return;
  done=[];scores={};idx=0;save();render();toast('Progress reset');
}

/* ============ KEYS + BOOT ============ */
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
});
render();
booted=true;
</script>
</body>
</html>
