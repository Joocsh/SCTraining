<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Training · Sotheby's Ecosystem · SkillCloud Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sir:#002349; --sir-2:#0d3560; --sir-3:#123f6e; --sir-soft:#e8eef5;
  --offwhite:#EDECE6; --paper:#F7F6F2; --card:#FFFFFF;
  --gold:#B99145; --gold-soft:#F0E7D4; --gold-line:#E3D4B0;
  --ink:#12243a; --body:#31465e; --muted:#5f7085; --faint:#93a2b4;
  --line:#e4e2da; --line-2:#d0cec4;
  --good:#1f9e5a; --good-bg:#e4f4ec; --bad:#d2452f; --bad-bg:#fbe8e4; --warn:#a86e10; --warn-bg:#fbf1dc;
  --cyan:#17c3d4; --cyan-d:#0fa6b6;
  --sh:0 1px 3px rgba(0,35,73,.06); --sh-m:0 4px 16px rgba(0,35,73,.09); --sh-l:0 14px 44px rgba(0,35,73,.16);
  --side:294px; --top:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Libre Franklin',Arial,sans-serif;background:var(--paper);color:var(--body);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--cyan-d);text-decoration:none}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;color:var(--sir);font-weight:600}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cdd5de;border-radius:6px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:#adb9c6}

/* ===================== TOP BAR ===================== */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--sir);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:120}
.tb-back{display:flex;align-items:center;gap:8px;color:#c5d6e6;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px}
.tb-back:hover{background:rgba(255,255,255,.1);color:#fff}
.tb-title{font-family:'Cormorant Garamond',serif;color:#fff;font-size:19px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.tb-title b{color:var(--gold-soft);font-weight:600;font-style:italic}
.tb-mid{flex:1;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:11px}
.tb-track{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.tb-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#d8b269);border-radius:3px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.tb-pct{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#a9c0d6;min-width:38px;text-align:right}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#c5d6e6;font-size:16px}
.tb-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.burger{display:none}
@media(max-width:960px){
  .burger{display:grid}
  .tb-mid{max-width:none}
  .tb-title{display:none}
}

/* ===================== SIDEBAR ===================== */
.side{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:110;padding-bottom:26px;transition:transform .28s ease}
.side-hd{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.side-hd .ttl{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--sir);font-weight:600;line-height:1.2}
.side-hd .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.side-hd .bar{height:4px;border-radius:3px;background:var(--sir-soft);margin-top:11px;overflow:hidden}
.side-hd .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;transition:width .45s}

.mod{border-bottom:1px solid var(--line)}
.mod-h{width:100%;display:flex;align-items:center;gap:11px;padding:13px 18px;text-align:left}
.mod-h:hover{background:#faf9f5}
.mod-n{width:25px;height:25px;border-radius:50%;background:var(--sir-soft);color:var(--sir);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;flex:none;transition:.2s}
.mod.done .mod-n{background:var(--good);color:#fff}
.mod.active .mod-n{background:var(--sir);color:#fff}
.mod-t{flex:1;min-width:0}
.mod-t .nm{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
.mod-t .ct{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);margin-top:2px;line-height:1.35}
.mod-chev{color:var(--faint);font-size:11px;transition:transform .2s;flex:none}
.mod.open .mod-chev{transform:rotate(90deg)}
.mod-b{display:none;padding:0 0 8px}
.mod.open .mod-b{display:block}
.les{width:100%;display:flex;align-items:flex-start;gap:10px;padding:8px 18px 8px 25px;text-align:left;font-size:13px;color:var(--muted);line-height:1.4;position:relative}
.les:hover{background:#faf9f5;color:var(--ink)}
.les.on{background:var(--gold-soft);color:var(--sir);font-weight:600}
.les.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.les-tick{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:1px;display:grid;place-items:center;font-size:8.5px;color:transparent;background:#fff;transition:.2s}
.les.done .les-tick{background:var(--good);border-color:var(--good);color:#fff}
.les.on .les-tick{border-color:var(--gold)}
.les.done.on .les-tick{background:var(--good);border-color:var(--good)}
.les-x{flex:1}
.les-kind{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;display:block;margin-top:1px}
.side-veil{display:none;position:fixed;inset:0;background:rgba(10,25,45,.4);z-index:105}
@media(max-width:960px){
  .side{transform:translateX(-100%);box-shadow:var(--sh-l)}
  .side.open{transform:none}
  .side-veil.on{display:block}
}

/* ===================== STAGE ===================== */
.stage{position:fixed;top:var(--top);left:var(--side);right:0;bottom:0;overflow-y:auto;scroll-behavior:smooth}
@media(max-width:960px){.stage{left:0}}
.lesson{max-width:900px;margin:0 auto;padding:38px 40px 130px;animation:fadeUp .38s cubic-bezier(.2,.8,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:700px){.lesson{padding:26px 20px 130px}}
.crumb{display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.crumb .pill{background:var(--sir);color:#fff;border-radius:20px;padding:3px 11px;letter-spacing:.1em}
.crumb .sep{color:var(--line-2)}
.lesson h1{font-size:clamp(28px,4vw,40px);line-height:1.12;font-weight:600;margin-bottom:10px}
.lesson h1 em{font-style:italic;color:var(--gold)}
.lead{font-size:17px;color:var(--body);max-width:730px;margin-bottom:24px}
.lesson h2{font-size:25px;margin:32px 0 10px}
.lesson h3{font-size:19px;margin:24px 0 8px}
.lesson p{margin-bottom:12px}
.lesson ul,.lesson ol{margin:8px 0 14px 22px}
.lesson li{margin-bottom:7px}
.lesson li b,.lesson p b{color:var(--ink)}

/* slide viewer */
.slide{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh-m);background:var(--offwhite);margin:20px 0 8px;cursor:zoom-in;transition:.22s}
.slide:hover{box-shadow:var(--sh-l);transform:translateY(-2px)}
.slide img{width:100%;display:block}
.slide .zoom{position:absolute;right:12px;bottom:12px;background:rgba(0,35,73,.82);color:#fff;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:center;opacity:0;transition:.2s;backdrop-filter:blur(4px)}
.slide:hover .zoom{opacity:1}
.slide-cap{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:22px;font-style:italic}
.slide-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 8px}
@media(max-width:760px){.slide-row{grid-template-columns:1fr}}
.slide-row .slide{margin:0}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(6,18,32,.94);z-index:400;display:none;align-items:center;justify-content:center;padding:34px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.lb-x{position:absolute;top:20px;right:26px;color:#fff;font-size:26px;opacity:.75}
.lb-x:hover{opacity:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;display:grid;place-items:center;font-size:19px;backdrop-filter:blur(4px)}
.lb-nav:hover{background:rgba(255,255,255,.26)}
.lb-prev{left:22px}.lb-next{right:22px}

/* content blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:22px 26px;box-shadow:var(--sh);margin:18px 0}
.card h3{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.navy{background:linear-gradient(155deg,var(--sir),var(--sir-3));border:none;color:#c9d8e6}
.navy h3,.navy h2{color:#fff}
.navy li b,.navy p b{color:#fff}
.navy .eyebrow{color:#7ED9E6}
.note{border-left:3px solid var(--gold);background:#fff;border-radius:0 11px 11px 0;padding:14px 18px;margin:16px 0;font-size:14.5px;box-shadow:var(--sh)}
.note b{color:var(--sir)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.note.tip{border-left-color:var(--cyan-d);background:#eaf9fb}
.kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);min-width:130px;flex:none;padding-top:3px}
.stat-row{display:flex;gap:30px;flex-wrap:wrap;margin:20px 0}
.stat b{font-family:'Cormorant Garamond',serif;font-size:38px;color:var(--sir);font-weight:600;display:block;line-height:1}
.stat span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* timeline */
.tl{position:relative;margin:20px 0;padding-left:26px;border-left:2px solid var(--gold-line)}
.tl-i{position:relative;padding-bottom:20px}
.tl-i::before{content:'';position:absolute;left:-33px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2.5px solid var(--paper)}
.tl-i .yr{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gold);letter-spacing:.1em}
.tl-i h4{font-size:17px;color:var(--sir);margin:2px 0 4px;font-family:'Cormorant Garamond',serif;font-weight:600}
.tl-i p{font-size:14.5px;margin:0}

/* steps */
.steps{counter-reset:st;display:grid;gap:11px;margin:18px 0}
.step{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;box-shadow:var(--sh);align-items:flex-start;transition:.2s}
.step:hover{border-color:var(--gold-line);transform:translateX(3px)}
.step::before{counter-increment:st;content:counter(st);font-family:'Cormorant Garamond',serif;font-size:31px;color:var(--gold);font-weight:600;line-height:.9;min-width:26px}
.step h4{font-size:16px;color:var(--sir);margin-bottom:3px}
.step h4 i{font-style:italic;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:1.06em}
.step p{font-size:14px;margin:0}

/* tool cards */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin:20px 0}
.tool{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh);cursor:pointer;transition:.2s;text-align:left}
.tool:hover{transform:translateY(-3px);box-shadow:var(--sh-m);border-color:var(--sir)}
.tool .tn{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--sir);font-weight:600;line-height:1.1}
.tool .tr{font-size:12.5px;color:var(--muted);margin-top:5px;min-height:52px}
.tool .tg{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-top:9px;display:block}

/* accordion */
.acc{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--sh);margin-bottom:11px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:15px 20px;font-size:15px;font-weight:600;color:var(--sir);text-align:left}
.acc-h:hover{background:#faf9f5}
.acc-h .ic{width:24px;height:24px;border-radius:6px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:11px;flex:none}
.acc-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.acc.open .chev{transform:rotate(90deg)}
.acc-b{display:none;padding:0 20px 18px 56px;font-size:14.5px}
.acc.open .acc-b{display:block}
.acc-b ul{margin:2px 0 6px 18px}

/* swatches */
.sws{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
@media(max-width:700px){.sws{grid-template-columns:1fr}}
.sw{border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;background:#fff;transition:.2s}
.sw:hover{transform:translateY(-3px);box-shadow:var(--sh-m)}
.sw .chip{height:104px;position:relative}
.sw .chip::after{content:'Click to copy';position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.32);opacity:0;transition:.2s}
.sw:hover .chip::after{opacity:1}
.sw .info{padding:12px 15px}
.sw .nm{font-weight:700;color:var(--ink);font-size:14px}
.sw .vals{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.65}

/* type specimen */
.spec{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:24px 26px;margin:18px 0}
.spec .r{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:baseline;border-bottom:1px dashed var(--line);padding:13px 0}
.spec .r:last-child{border-bottom:none}
.spec .who{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-align:right;line-height:1.75}
.d-h1{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--sir);font-weight:500;line-height:1.1}
.d-h2{font-family:'Cormorant Garamond',serif;font-size:27px;color:var(--sir);font-weight:600}
.d-sub{font-size:16px;font-weight:600;color:var(--ink)}
.d-body{font-size:15px}

/* table */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);margin:16px 0}
.tbl th{background:var(--sir);color:#fff;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:11px 14px;text-align:left;font-weight:600}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
.tbl td.k{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--sir);font-style:italic;white-space:nowrap}

/* shapes */
.shapes{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin:16px 0}
.shp{background:var(--offwhite);width:82px;border:1px solid var(--line)}
.s-rect{height:104px}
.s-oval{height:104px;border-radius:50%/44%}
.s-arch{height:104px;border-radius:42px 42px 0 0}
.s-curve{height:104px;border-radius:24px 4px 24px 4px}
.s-step{height:104px;clip-path:polygon(0 12%,12% 12%,12% 0,88% 0,88% 12%,100% 12%,100% 88%,88% 88%,88% 100%,12% 100%,12% 88%,0 88%)}
.shp-l{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

/* prompt library */
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.ptab{border:1.5px solid var(--line-2);border-radius:20px;padding:8px 17px;font-size:13px;font-weight:600;color:var(--muted);background:#fff;transition:.18s}
.ptab:hover{border-color:var(--sir);color:var(--sir)}
.ptab.on{background:var(--sir);border-color:var(--sir);color:#fff}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.pc-h{width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;text-align:left}
.pc-h:hover{background:#faf9f5}
.pc-h .t{font-weight:700;color:var(--sir);font-size:15px}
.pc-h .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.pc-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s;flex:none}
.pc.open .chev{transform:rotate(90deg)}
.pc-b{display:none;padding:0 20px 18px}
.pc.open .pc-b{display:block}
.ing{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ing span{font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:3px 9px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.i-role{background:#e3edf9;color:#1c5290}
.i-ctx{background:#efe9fb;color:#5b3ea8}
.i-task{background:#fbe9e2;color:#a0452c}
.i-fmt{background:#e2f4ea;color:#1f7a4a}
.i-ex{background:#faf0da;color:#8a6a14}
.pre{background:#0c1f33;color:#d7e5f2;border-radius:11px;padding:17px 19px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.8;white-space:pre-wrap;position:relative}
.pre .role{color:#8ec3f0}.pre .ctx{color:#c4b1ef}.pre .task{color:#f0b096}.pre .fmt{color:#93dcb2}
.pcopy{position:absolute;top:11px;right:11px;background:rgba(255,255,255,.13);border-radius:7px;padding:6px 12px;font-size:11px;color:#cfe2f2;font-family:'Libre Franklin',sans-serif;font-weight:600}
.pcopy:hover{background:rgba(255,255,255,.24)}
.pwhy{font-size:13.5px;color:var(--muted);margin-top:11px;border-left:2px solid var(--gold);padding-left:13px}
.pwhy b{color:var(--sir)}

/* quiz */
.quiz{background:linear-gradient(155deg,var(--sir),var(--sir-3));border-radius:16px;color:#fff;padding:30px 34px;margin:8px 0 20px;box-shadow:var(--sh-m)}
.quiz .eyebrow{color:#7ED9E6}
.quiz h2{color:#fff;font-size:26px;margin:8px 0 6px}
.quiz .qsub{color:#a9c0d6;font-size:14.5px;margin-bottom:20px}
.qq{margin-bottom:24px}
.qq:last-of-type{margin-bottom:8px}
.qq .qt{font-size:16px;font-weight:600;color:#fff;margin-bottom:12px;display:flex;gap:10px}
.qq .qt .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);flex:none;padding-top:3px}
.qopt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:11px;padding:12px 16px;font-size:14.5px;color:#e3ecf4;margin-bottom:9px;transition:.16s}
.qopt:hover:not(:disabled){border-color:#7ED9E6;background:rgba(255,255,255,.12)}
.qopt:disabled{cursor:default}
.qopt.ok{background:rgba(31,158,90,.3);border-color:#4ad286;color:#fff}
.qopt.no{background:rgba(210,69,47,.28);border-color:#e8907f;color:#fff}
.qfb{font-size:13.5px;color:#bcd0e2;background:rgba(255,255,255,.07);border-radius:9px;padding:11px 15px;margin-top:6px;display:none;border-left:2px solid var(--gold)}
.qfb.show{display:block}
.qscore{display:flex;align-items:center;gap:14px;border-top:1px solid rgba(255,255,255,.16);padding-top:18px;margin-top:6px}
.qscore .num{font-family:'Cormorant Garamond',serif;font-size:32px;color:#fff;font-weight:600}
.qscore .lbl{font-size:13.5px;color:#a9c0d6}

/* footer nav */
.fnav{position:fixed;bottom:0;left:var(--side);right:0;background:rgba(247,246,242,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:13px 40px;display:flex;align-items:center;gap:14px;z-index:100}
@media(max-width:960px){.fnav{left:0;padding:12px 20px}}
.fbtn{display:inline-flex;align-items:center;gap:9px;border-radius:11px;padding:11px 22px;font-size:14px;font-weight:700;transition:.18s;white-space:nowrap}
.fbtn.prev{border:1.5px solid var(--line-2);color:var(--muted);background:#fff}
.fbtn.prev:hover{border-color:var(--sir);color:var(--sir)}
.fbtn.next{background:var(--sir);color:#fff;margin-left:auto}
.fbtn.next:hover{background:var(--sir-3)}
.fbtn.next.gold{background:var(--gold);color:#3d2f0f}
.fbtn.next.gold:hover{background:#c9a05a}
.fbtn:disabled{opacity:.35;cursor:not-allowed}
.fnav .pos{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);text-align:center;flex:1}
@media(max-width:600px){.fnav .pos{display:none}.fbtn{padding:11px 16px;font-size:13px}}

/* completion */
.done{max-width:640px;margin:20px auto;background:linear-gradient(160deg,var(--sir),var(--sir-3));border-radius:18px;color:#fff;padding:46px 44px;text-align:center;box-shadow:var(--sh-l);position:relative;overflow:hidden}
.done::after{content:'1 of 1';position:absolute;right:-24px;bottom:-56px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:170px;color:rgba(255,255,255,.05);line-height:1}
.done .in{position:relative;z-index:2}
.done .seal{width:74px;height:74px;border-radius:50%;background:var(--gold);color:var(--sir);display:grid;place-items:center;font-size:32px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(185,145,69,.4)}
.done h2{color:#fff;font-size:32px;margin-bottom:8px}
.done p{color:#b9cbdc;max-width:460px;margin:0 auto 20px}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:12px;overflow:hidden;margin:24px 0}
.done-stats .d{background:rgba(0,20,44,.5);padding:16px 8px}
.done-stats .d b{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-soft);display:block;line-height:1.1}
.done-stats .d span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fb4c9}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--cyan);color:#03282c;border-radius:11px;padding:12px 26px;font-size:14px;font-weight:800}
.btn:hover{background:var(--cyan-d);color:#fff;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.ghost:hover{border-color:#fff;background:rgba(255,255,255,.1)}

/* misc */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sir);color:#fff;padding:12px 22px;border-radius:11px;font-size:13.5px;box-shadow:var(--sh-l);opacity:0;transition:.26s;z-index:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;background:#fff;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:14px}
</style>

<script>
const IMG='assets/img/marketing/';

/* ============ helpers used inside lesson HTML ============ */
const sl=(f,cap)=>`<div class="slide" onclick="openLb('${f}')"><img src="${IMG}${f}" alt="${cap||''}" loading="lazy"><span class="zoom">&#9974; Expand</span></div>`+(cap?`<div class="slide-cap">${cap}</div>`:'');

/* ============ MODULES ============ */
const MODS=[
 {id:'m1',n:'The brand',d:'Where SIR comes from and what it stands for'},
 {id:'m2',n:'The toolbox',d:'The five platforms and how they connect'},
 {id:'m3',n:'The 1 of 1 playbook',d:'Messaging, layout, logo, color, type, shape, photo'},
 {id:'m4',n:'Propel',d:'Your daily hub'},
 {id:'m5',n:'ActivePipe',d:'Email marketing'},
 {id:'m6',n:'Design Vault',d:'Design studio'},
 {id:'m7',n:'ListTrac',d:'Analytics and seller reports'},
 {id:'m8',n:'MoxiWorks',d:'CMAs and presentations'},
 {id:'m9',n:'Claude',d:'AI prompting and the prompt library'}
];

/* ============ LESSONS ============ */
const L=[];
const add=(m,t,k,html)=>L.push({m,t,k,html});

/* ---------- M1 ---------- */
add('m1','Welcome to the ecosystem','Start',`
<h1>You are joining a brand that has been <em>curating the unique</em> since 1976.</h1>
<p class="lead">This training takes you through everything the marketing team touches: the brand story, the five platforms you will work in every day, the campaign rules that keep our work on brand, and how to get real leverage out of Claude.</p>
<div class="stat-row">
  <div class="stat"><b>9</b><span>Modules</span></div>
  <div class="stat"><b>46</b><span>Slides</span></div>
  <div class="stat"><b>16</b><span>Prompt templates</span></div>
  <div class="stat"><b>~45</b><span>Minutes</span></div>
</div>
<div class="grid2">
  <div class="card"><h3>How this works</h3>
    <ul>
      <li>One lesson per screen. Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> or the buttons below to move.</li>
      <li>Every module ends with a short check to lock in what you learned.</li>
      <li>Click any slide to open it full screen.</li>
      <li>Your progress saves automatically in this browser.</li>
    </ul>
  </div>
  <div class="card navy"><span class="eyebrow">What you will be able to do</span>
    <h3>By the end</h3>
    <ul>
      <li>Pick the right platform for any marketing task without asking.</li>
      <li>Produce assets that pass a brand review the first time.</li>
      <li>Write prompts that return usable work, not generic filler.</li>
      <li>Know exactly where to go when something breaks.</li>
    </ul>
  </div>
</div>
<div class="note tip"><b>Tip.</b> If you get interrupted, just close the tab. When you come back, the course reopens exactly where you left off.</div>`);

add('m1','What is Sotheby&rsquo;s International Realty?','Lesson',`
<h1>A premier luxury real estate brokerage.</h1>
<p class="lead">Founded in 1976, SIR operates a global network of more than <b>1,100 offices</b> across <b>84 countries</b>.</p>
${sl('m1-what-is-sir.jpg','Slide 3 of the internal deck')}
<div class="stat-row">
  <div class="stat"><b>1976</b><span>Founded</span></div>
  <div class="stat"><b>1,100+</b><span>Offices</span></div>
  <div class="stat"><b>84</b><span>Countries</span></div>
</div>
<p>Everything else in this training sits on top of that fact. When you place a listing in the SIR system, you are not marketing to one city. You are placing it inside a curated global collection that buyers around the world already trust.</p>`);

add('m1','The Art of Living: how SIR was born','Lesson',`
<h1>From auction house to real estate.</h1>
${sl('m1-art-of-living.jpg','Sir Samuel White Baker, Sotheby&rsquo;s founder')}
<div class="tl">
  <div class="tl-i"><div class="yr">MID 1970s</div><h4>A pattern nobody had named</h4><p>The Sotheby&rsquo;s auction house noticed something recurring: its wealthiest clients were not just buying Rare Dutch Masters or Ming vases. They were often buying and selling the grand estates required to house them.</p></div>
  <div class="tl-i"><div class="yr">1976</div><h4>SIR launches as a subsidiary</h4><p>The original intent was simple: provide a specialized real estate service for the auction house&rsquo;s existing clientele. By leveraging the trust and prestige of the Sotheby&rsquo;s name, they created a seamless pipeline between the world of fine art and luxury property.</p></div>
  <div class="tl-i"><div class="yr">NEXT 30 YEARS</div><h4>A brokerage with a ceiling</h4><p>SIR operated primarily as a brokerage that owned its own offices. The brand&rsquo;s global potential was limited by the capital required to open physical locations everywhere.</p></div>
</div>
<div class="note"><b>Why this matters to you.</b> The brand&rsquo;s origin explains its whole aesthetic. We are not selling square footage, we are curating objects of value, exactly the way an auction house presents a piece.</div>`);

add('m1','The franchise turn and Compass','Lesson',`
<h1>2004: the deal that made SIR global.</h1>
${sl('m1-franchise-compass.jpg','The Realogy alliance and the 2026 Compass merger')}
<div class="card">
  <div class="kv"><div class="k">The deal</div><div>In 2004 Sotheby&rsquo;s entered a long term strategic alliance with Realogy (now Anywhere Real Estate). Realogy paid <b>$100 million</b> for the right to license the Sotheby&rsquo;s International Realty name for <b>50 years</b>, with options to renew.</div></div>
  <div class="kv"><div class="k">The result</div><div>This transformed SIR into a <b>franchise system</b>. Independent luxury brokerages around the world could rebrand as Sotheby&rsquo;s International Realty, instantly gaining the prestige of a 280 year old brand while remaining locally owned.</div></div>
  <div class="kv"><div class="k">Early 2026</div><div>A landmark merger between Anywhere and Compass created <b>Compass International Holdings</b>. Despite the corporate consolidation, SIR maintains its distinct identity and &ldquo;vibe&rdquo;, operating as the ultra luxury crown jewel of the portfolio.</div></div>
</div>`);

add('m1','The current global standard: 1 of 1','Lesson',`
<h1>Not a promotion. <em>A permanent standard.</em></h1>
${sl('m1-global-standard.jpg','The 1 of 1 campaign as global brand identity')}
<p>For several years SIR has used the <b>&ldquo;1 of 1&rdquo;</b> campaign as its global brand identity, integrating the philosophy into every aspect of the business. Rather than a temporary promotion, it serves as a permanent standard for everything: from local yard signs and social media posts to high end print features in <i>The New York Times</i> and <i>Architectural Digest</i>.</p>
<div class="note"><b>The point.</b> This consistent, long term application ensures that every property, regardless of its location, is positioned not just as a listing, but as a singular, irreplaceable masterpiece within a curated global collection.</div>
<h2>Your gate: SIR Access</h2>
<p>Accessing the SIR platform is one of the first steps in our day. It is a gated environment where <b>your role defines your toolkit</b>: whether you are managing listing data, creating high end marketing, or tracking global analytics, everything you need is available the moment you log in.</p>
<ul>
  <li>Secure login requiring <b>two factor authentication</b>.</li>
  <li>Two main ways agents access their tools: the <b>SIR platform</b> and <b>Propel</b>.</li>
  <li>Links and available resources within Propel vary depending on the client and specific account configuration.</li>
</ul>
<div class="note warn"><b>Permissions.</b> The permissions granted by your client may affect your access to these assets. It is recommended to discuss access levels with them to ensure you have what is needed for an efficient workflow.</div>`);

add('m1','Module 1 check','Quiz',`__QUIZ__m1`);

/* ---------- M2 ---------- */
add('m2','The five most utilized assets','Lesson',`
<h1>Five platforms. <em>One workflow.</em></h1>
<p class="lead">These are the key assets the marketing team uses most frequently. Every task in your day maps to one of them.</p>
${sl('m2-most-utilized-assets.jpg','ActivePipe, MoxiWorks, ListTrac, Design Vault and Propel')}
<div class="tools">
  <button class="tool" onclick="jump('m4')"><span class="tn">Propel</span><p class="tr">Daily all in one hub: forums, calendar, resources, quick links.</p><span class="tg">Module 4 &rarr;</span></button>
  <button class="tool" onclick="jump('m5')"><span class="tn">ActivePipe</span><p class="tr">Email marketing and database manager for the after launch phase.</p><span class="tg">Module 5 &rarr;</span></button>
  <button class="tool" onclick="jump('m6')"><span class="tn">Design Vault</span><p class="tr">Brand safe design studio for print and digital marketing.</p><span class="tg">Module 6 &rarr;</span></button>
  <button class="tool" onclick="jump('m7')"><span class="tn">ListTrac</span><p class="tr">Analytics and automated seller reports across syndicated sites.</p><span class="tg">Module 7 &rarr;</span></button>
  <button class="tool" onclick="jump('m8')"><span class="tn">MoxiWorks</span><p class="tr">CMAs and listing presentations built from live MLS data.</p><span class="tg">Module 8 &rarr;</span></button>
</div>`);

add('m2','The admin workflow','Lesson',`
<h1>Five steps, five tools.</h1>
${sl('m2-admin-workflow.jpg','The admin workflow as presented in the deck')}
<div class="steps">
  <div class="step"><div><h4>Listing setup &middot; <i>Dash</i></h4><p>Enter and manage property data, upload media, and ensure listing accuracy for global distribution.</p></div></div>
  <div class="step"><div><h4>Marketing creation &middot; <i>Design Vault &amp; ActivePipe</i></h4><p>Create branded marketing materials and launch email campaigns to promote the property.</p></div></div>
  <div class="step"><div><h4>Agent presentation support &middot; <i>MoxiWorks</i></h4><p>Build CMAs and listing presentations using live market data and comps.</p></div></div>
  <div class="step"><div><h4>Internal communication &middot; <i>Propel</i></h4><p>Centralized hub to access SIR.com resources, collaborate in forums, and share exclusive off market listings.</p></div></div>
  <div class="step"><div><h4>Performance reporting &middot; <i>ListTrac</i></h4><p>Generate seller reports and track listing visibility across global platforms.</p></div></div>
</div>`);

add('m2','Bringing it all together','Lesson',`
<h1>A connected ecosystem, not five separate apps.</h1>
${sl('m2-bringing-together.jpg','SIR operates through a connected ecosystem')}
<p>Sotheby&rsquo;s International Realty operates through a connected ecosystem of tools designed to support every stage of the real estate process.</p>
<p>For admins, <b>understanding how these platforms work together is key</b> to maintaining accuracy, efficiency, and consistency across the business. When used correctly, these tools not only streamline daily operations but also help agents deliver a higher level of service to their clients.</p>
<div class="note tip"><b>Mental model.</b> Data starts in Dash, becomes marketing in Design Vault and ActivePipe, becomes a pitch in MoxiWorks, gets coordinated in Propel, and gets measured in ListTrac. Same listing, five jobs.</div>`);

add('m2','Module 2 check','Quiz',`__QUIZ__m2`);

/* ---------- M3 ---------- */
add('m3','The campaign proposition','Lesson',`
<h1>Curators of <em>the unique.</em></h1>
${sl('m3-curators-unique.jpg','The campaign proposition')}
<p class="lead">Sotheby&rsquo;s International Realty is a curator of the unique, connecting the world&rsquo;s most unique homes with the buyers who appreciate their potential.</p>
<p>An authority for a new era of luxury, defined by our eye for what is special about homes and the unique experiences and lifestyles they open up.</p>
<div class="note"><b>Use this as your filter.</b> Every headline, image and layout decision in this module traces back to one question: does this celebrate what makes this property singular?</div>`);

add('m3','The messaging system','Lesson',`
<h1>One lead headline, four ways to extend it.</h1>
${sl('m3-messaging-system.jpg','Lead campaign headline and alternative headline types')}
<p>The lead campaign headline is always <b>&ldquo;1 of 1&rdquo;</b>. Around it, the system gives you four types of alternative headlines:</p>
<table class="tbl">
  <tr><th style="width:150px">Type</th><th>References</th></tr>
  <tr><td class="k">Universal</td><td>Headlines that work with any property shown.</td></tr>
  <tr><td class="k">Property</td><td>Headlines that reference specific features of the property shown.</td></tr>
  <tr><td class="k">Location</td><td>Headlines that reference the locations shown.</td></tr>
  <tr><td class="k">Lifestyle</td><td>Headlines that reference the lifestyle implied by the property shown.</td></tr>
</table>
<h3>Audience specific headlines</h3>
<div class="grid2">
  <div class="card"><h3 style="font-size:17px">Buyers &amp; Renters</h3><ul><li>Unique access</li><li>Unique leadership</li><li>Call to action</li></ul></div>
  <div class="card"><h3 style="font-size:17px">Sellers</h3><ul><li>Unique appreciation</li><li>Unique leadership</li><li>Call to action</li></ul></div>
</div>
<div class="card"><h3 style="font-size:17px">Agents</h3><ul><li>Unique advantage</li><li>Unique leadership</li><li>Call to action</li></ul></div>`);

add('m3','Headlines for all','Lesson',`
<h1>The copy bank.</h1>
${sl('m3-headlines-for-all.jpg','Universal and property led headline copy')}
<div class="grid2">
  <div class="card"><span class="eyebrow">Universal &middot; works with any property</span>
    <h3>Copy (One)</h3>
    <ul><li>The one for you</li><li>The special one</li><li>The rare one</li><li>The one you want</li><li>One of a kind</li><li>Find your one</li><li>Your one awaits</li></ul>
    <h3>Copy (Uniqueness)</h3>
    <ul><li>Character as unique as yours</li><li>Curators of the unique</li><li>Unique homes, uniquely for you</li><li>Live unique</li><li>A genuine original</li><li>Homes as unique as you</li><li>Discover the unique</li></ul>
  </div>
  <div class="card"><span class="eyebrow">Property led &middot; matches features shown</span>
    <h3>Copy (One)</h3>
    <p style="font-size:14px;color:var(--muted)">The [style of home] one, e.g.</p>
    <ul><li>The midcentury one</li><li>The contemporary one</li><li>The townhouse one</li><li>The decadent one</li></ul>
    <h3>Copy (Uniqueness)</h3>
    <ul><li>Exquisite detail</li><li>Uncommon beauty</li><li>True original</li><li>Living masterpiece</li></ul>
  </div>
</div>`);

add('m3','Layout','Lesson',`
<h1>A flexible system, not a rigid template.</h1>
${slr('m3-layout.jpg','m3-layout-considerations.jpg','Layout system and considerations')}
<div class="grid2">
  <div class="card"><h3>The spectrum</h3>
    <p>Our layouts have been designed to make a flexible system that allows us to make visuals that reflect the eras of our properties, as well as adapt for varying degrees of information.</p>
    <p>A <b>centered, simple and classic layout</b> can be used to appeal to our established core audiences, showcasing properties in a clean and classical fashion.</p>
    <p style="font-size:14px;color:var(--muted)">These two ends of the spectrum are not the only approaches, as we can take elements from each to create layouts that blend both.</p>
  </div>
  <div class="card"><h3>Considerations</h3>
    <div class="kv"><div class="k">Image scale</div><div>Hero images should be <b>half the width of the canvas or more</b> to ensure they are the most prominent element. Supporting images can be significantly smaller to create a hierarchy.</div></div>
    <div class="kv"><div class="k">Spacing</div><div>Elements should always have room to breathe so they can be easily discernible from each other in complex layouts. This particularly applies to text.</div></div>
  </div>
</div>`);

add('m3','Logo rules','Lesson',`
<h1>The logo follows the masterbrand.</h1>
${slr('m3-logo-masterbrand.jpg','m3-logo-affiliates.jpg','Logo positioning, clear space, color, and affiliate lockups')}
<div class="grid3">
  <div class="card"><h3 style="font-size:17px">Positioning</h3><p style="font-size:14px">Depending on the layout, our logo can be positioned in different places. For more classic layouts, we usually position the logo <b>centered at the bottom</b>. In more modern layouts, we position the logo <b>in the corners</b>.</p></div>
  <div class="card"><h3 style="font-size:17px">Minimum distance</h3><p style="font-size:14px">The minimum distance from any other elements or the edge of the canvas should be the <b>&ldquo;S&rdquo; height</b> around each edge.</p></div>
  <div class="card"><h3 style="font-size:17px">On color</h3><p style="font-size:14px">On SIR blue backgrounds the logo should be <b>pure white</b>. On off white and pure white backgrounds the logo should be <b>SIR blue</b>.</p></div>
</div>
<div class="note"><b>Affiliates.</b> The same rules apply to affiliate logos. When selecting an affiliate lockup, choose the best one to complement the application size and scale and the other elements around it.</div>`);

add('m3','Colors','Lesson',`
<h1>Three colors. <em>No exceptions.</em></h1>
${slr('m3-colors-rgb.jpg','m3-colors-cmyk.jpg','RGB values for digital, CMYK for print')}
<p style="font-size:14px;color:var(--muted)">Click any swatch to copy its hex code.</p>
<div class="sws">
  <div class="sw" onclick="copyHex('#002349')"><div class="chip" style="background:#002349"></div><div class="info"><div class="nm">SIR Blue</div><div class="vals">HEX #002349<br>RGB 0 &middot; 35 &middot; 73<br>CMYK 100 &middot; 64 &middot; 0 &middot; 60</div></div></div>
  <div class="sw" onclick="copyHex('#FFFFFF')"><div class="chip" style="background:#fff;border-bottom:1px solid var(--line)"></div><div class="info"><div class="nm">Pure White</div><div class="vals">HEX #FFFFFF<br>RGB 255 &middot; 255 &middot; 255<br>CMYK 0 &middot; 0 &middot; 0 &middot; 0</div></div></div>
  <div class="sw" onclick="copyHex('#EDECE6')"><div class="chip" style="background:#EDECE6"></div><div class="info"><div class="nm">Off White</div><div class="vals">HEX #EDECE6<br>RGB 237 &middot; 236 &middot; 230<br>CMYK 9 &middot; 5 &middot; 10 &middot; 0</div></div></div>
</div>
<div class="grid2">
  <div class="card"><h3 style="font-size:17px">Why off white exists</h3><p style="font-size:14px">The 1 of 1 campaign uses SIR blue and Pure white from our masterbrand, and introduces a new off white into the palette. It brings a <b>warm, distinctive and modern background</b> to the campaign, whilst also allowing the brand to stand out subtly on predominantly white spaces, such as a banner on a primarily white website.</p></div>
  <div class="card"><h3 style="font-size:17px">Print rules</h3><p style="font-size:14px">When printing, all applications can use SIR blue and Pure White in both background and elements. When printing on <b>newsprint or lower quality print processes</b>, Pure white should be used for the light background and off white should be avoided as it may appear &ldquo;muddy&rdquo; on the page. Off white is for high quality lithographic and digital print applications only.</p></div>
</div>`);

add('m3','Typography','Lesson',`

<p style="font-size:13.5px;color:var(--faint)">The specimen above previews the hierarchy with visually similar substitutes, since the licensed families are not embedded in this page.</p>`);

add('m5','ActivePipe: email that sells the listing','Lesson',`
<h1>The after launch workhorse.</h1>
<p class="lead">ActivePipe is a powerful email marketing solution designed for enterprises. It allows you to create stunning, professional, and mobile responsive emails within minutes. The SIR brand uses this platform to provide branded email templates that promote properties and programs to local markets.</p>
${sl('m5-activepipe-email.jpg','A tool used for email marketing')}
<div class="grid2">
  <div class="card"><h3>When you use it</h3><p>It is typically utilized during the <b>&ldquo;after launch&rdquo; phase</b>, once a home is active or available on the market, to promote listings, open houses, price adjustments, and events.</p></div>
  <div class="card"><h3>What you see first</h3><p>Upon logging in, users are presented with a dashboard that provides statistics on recent emails, contacts, property notifications, and general activity.</p></div>
</div>
<div class="card"><h3>How do I use it?</h3>
<p>ActivePipe is integrated with the SIR listings database for easy <b>drag and drop</b> of property information. Beyond using pre designed templates to showcase listings or announce open houses, you can build custom campaigns from scratch using the platform&rsquo;s intuitive drag and drop elements.</p>
<p>This tool serves as a powerful <b>database manager</b>, allowing you to create distribution lists, categorize contacts, and automate monthly newsletters. By tracking which properties clients click on, ActivePipe provides actionable insights that help agents focus their efforts on the most active leads in their database.</p></div>
<div class="note warn"><b>ActivePipe requires a paid subscription.</b></div>`);

add('m5','Inside the platform','Lesson',`
<h1>Dashboard, builder, campaigns, contacts.</h1>
${sl('m5-activepipe-platform.jpg','A real estate marketing platform that automates client communication')}
<div class="acc open"><button class="acc-h" onclick="tAcc(this)"><span class="ic">1</span> Dashboard <span class="chev">&#8250;</span></button><div class="acc-b"><p>After logging in, users can access email statistics, campaign activity, contacts, and property updates from a centralized dashboard.</p></div></div>
<div class="acc"><button class="acc-h" onclick="tAcc(this)"><span class="ic">2</span> Email builder <span class="chev">&#8250;</span></button><div class="acc-b"><p>Includes a drag and drop editor that allows users to create professional marketing emails quickly and easily.</p></div></div>
<div class="acc"><button class="acc-h" onclick="tAcc(this)"><span class="ic">3</span> Smart campaigns <span class="chev">&#8250;</span></button><div class="acc-b"><p>Allows users to automate follow up communication using drip campaigns and engagement triggers.</p></div></div>
<div class="acc"><button class="acc-h" onclick="tAcc(this)"><span class="ic">4</span> Contacts &amp; audiences <span class="chev">&#8250;</span></button><div class="acc-b"><p>Contacts can be added manually or imported through CSV files. Users can organize databases with tags and audience groups for targeted communication.</p></div></div>`);

add('m5','Building, sending and fixing','Lesson',`
<h1>Preview before you send. Always.</h1>
${slr('m5-activepipe-building.jpg','m5-activepipe-troubleshooting.jpg','Building and sending emails, plus troubleshooting')}
<div class="grid2">
  <div class="card"><h3>Building and sending</h3>
    <div class="kv"><div class="k">Design</div><div>Drag and drop editor for titles, text, images, buttons, videos, and property listings.</div></div>
    <div class="kv"><div class="k">Listing integration</div><div>Automatically populate live listings using the property integration tools when listings are available in the system.</div></div>
    <div class="kv"><div class="k">Preview &amp; testing</div><div>Use <b>&ldquo;View Preview&rdquo;</b> to review formatting, links, and mobile responsiveness. <b>&ldquo;Send Preview&rdquo;</b> lets you test emails internally before distribution.</div></div>
  </div>
  <div class="card"><h3>Troubleshooting &amp; best practices</h3>
    <div class="kv"><div class="k">Images</div><div>If uploads fail, ensure files are properly resized and optimized to meet platform size requirements while maintaining quality.</div></div>
    <div class="kv"><div class="k">Videos</div><div>Linked videos must be set to <b>public</b> for ActivePipe to display them correctly. Vimeo is often recommended for cleaner visual presentation.</div></div>
    <div class="kv"><div class="k">Listing availability</div><div>New listings may take <b>1 to 2 days</b> to sync. If a listing does not appear after that, add the content manually or contact your office administrator.</div></div>
    <div class="kv"><div class="k">Mobile formatting</div><div>Always review emails using the mobile preview before sending. Side by side images or columns may stack vertically on smaller screens.</div></div>
  </div>
</div>
<div class="note"><b>Login information.</b> Marketing and admin accounts can manage most ActivePipe features without the agent&rsquo;s login, depending on assigned permission levels.</div>`);

add('m6','Design Vault: agency quality, no cost','Lesson',`
<h1>Brand safe design, in minutes.</h1>

<p>The editor is integrated with the SIR listings database, enabling easy drag and drop of property information. Also, you can directly send items to a professional printer and easily share graphics on social media with optimized integration.</p>
<ul>

add('m6','Creating, printing and best practices','Lesson',`

  <div class="card"><h3>Creating and editing</h3>

    <div class="kv"><div class="k">Duplicating</div><div>To create a new project, users can duplicate an existing template and rename it.</div></div>
    <div class="kv"><div class="k">Editing limits</div><div>Some template sections, such as branded elements, are <b>locked and cannot be edited</b>.</div></div>

  </div>

add('m7','ListTrac: proof the marketing works','Lesson',`
<h1>Turn exposure into evidence.</h1>
<p class="lead">List Trac is the comprehensive reporting and analytics platform for the Sotheby&rsquo;s International Realty network. It aggregates online traffic data from thousands of websites, providing a clear picture of how many potential buyers are viewing our listings globally.</p>
${sl('m7-listtrac-reports.jpg','A platform used to create automatic seller reports')}
<div class="card"><h3>How do I use it?</h3>
<p>It is used to generate professional <b>&ldquo;Seller Reports&rdquo;</b> that prove the value of the brand&rsquo;s global syndication. It tracks listing performance across major sites like <b>The Wall Street Journal, Zillow, and SIR.com</b>, allowing admins to provide clients with concrete data on their home&rsquo;s digital exposure.</p>
<p>This tool simplifies the process of demonstrating marketing reach. By pulling real time views and engagement metrics into one easy to read report, ListTrac helps agents justify their strategy and keep sellers informed with transparent, data backed updates on their property&rsquo;s performance.</p></div>
<div class="note"><b>Login information.</b> Access login via SIR Access is required. Admin and marketing users may have the same reporting and listing features as agents, depending on brokerage assigned permission levels.</div>`);

add('m7','Dashboard and statistics','Lesson',`
<h1>What the data actually tells you.</h1>
${slr('m7-listtrac-dashboard.jpg','m7-listtrac-statistics.jpg','Centralized dashboard, listing statistics and report history')}
<div class="card">
  <div class="kv"><div class="k">Dashboard</div><div>After logging in, users can view listing activity, website performance, visitor traffic, and engagement analytics from a centralized dashboard.</div></div>
  <div class="kv"><div class="k">Seller reports</div><div>ListTrac allows users to create automated reports for sellers by selecting the appropriate listing, adding contact information, and customizing report settings. Reports can be scheduled <b>weekly, bi weekly, or monthly</b> and include performance summaries, website traffic, and listing engagement statistics.</div></div>
  <div class="kv"><div class="k">Listing statistics</div><div>The platform tracks listing performance across affiliated real estate websites and displays detailed analytics for each property. Users can monitor <b>views, inquiries, favorites, shares, and traffic activity</b> while identifying which websites generate the most engagement.</div></div>
  <div class="kv"><div class="k">Report history</div><div>ListTrac stores report history and delivery activity, allowing users to confirm when reports were sent, delivered, and opened by sellers. This helps agents and marketing teams maintain consistent communication and verify report activity when needed.</div></div>

add('m7','Best practices and troubleshooting','Lesson',`

add('m8','MoxiWorks: win the listing','Lesson',`
<h1>Data driven presentations that close.</h1>
<p class="lead">MoxiWorks is the premier presentation and business suite for the SIR network. It empowers agents to create visually stunning, data driven presentations that showcase market expertise and the power of the global brand in a digital first format.</p>
${sl('m8-moxi-platform.jpg','A platform designed to support agents through the listing and client presentation process')}
<div class="card"><h3>How do I use it?</h3>
<p>It is used to build sophisticated listing presentations and <b>Comparative Market Analyses (CMAs)</b> that integrate live property data. It allows admins and agents to quickly pull &ldquo;comps&rdquo; and create interactive, web based decks that look exceptional on any device, from tablets to large screens.</p>
<p>Beyond presentations, the suite simplifies the creation of marketing materials and ensures every touchpoint is high impact. By automating the data flow from the MLS, MoxiWorks enables the office to deliver professional, real time market insights that help win more listings and guide clients through the selling process.</p>
<p>In addition to CMAs, MoxiWorks integrates tools such as <b>RealScout and Testimonial Tree</b> for lead engagement and marketing support.</p></div>
<div class="note"><b>Login information.</b> Access via SIR Access is required. MoxiWorks may require two step verification, and sign in works with username or email, Google, or a Microsoft account.</div>`);

add('m8','Building a presentation','Lesson',`
<h1>Let the MLS do the typing.</h1>
${sl('m8-moxi-client-ready.jpg','Client ready listing materials using MLS driven property and market data')}
<div class="card">
  <div class="kv"><div class="k">Dashboard</div><div>After logging in, users can access CMA presentations, templates, property data, and client marketing tools from a centralized dashboard. The platform also stores saved drafts and previously created presentations, allowing users to continue editing at any time.</div></div>
  <div class="kv"><div class="k">Building</div><div>Users begin by selecting <b>&ldquo;Create New&rdquo;</b> and choosing a CMA or listing presentation template. Property information is pulled directly from the MLS system to help streamline the setup process.</div></div>

add('m8','Comparisons, output and pitfalls','Lesson',`
<h1>Frame the price, then review it twice.</h1>
${slr('m8-moxi-comparisons.jpg','m8-moxi-practices.jpg','Market comparisons, review and output, plus best practices')}
<div class="grid2">
  <div class="card"><h3>Market comparisons &amp; output</h3>
    <p>MoxiWorks allows users to add comparable properties from <b>active, pending, withdrawn, or sold</b> listings to help determine an accurate price range. The platform generates side by side market comparisons that help agents present pricing strategies and market trends clearly to clients.</p>
    <p>Presentations can also be customized by removing pages or adjusting content sections as needed. Before sending, users can preview the final presentation to review formatting, property summaries, market comparisons, and preparation checklists. Completed presentations can then be shared with clients, while drafts remain automatically saved for future edits.</p>
  </div>
  <div class="card"><h3>Common issues</h3>
    <ul>
      <li>Outdated MLS or tax information may require manual updates.</li>
      <li>Incorrect MLS numbers can prevent property data from loading.</li>
      <li>Missing listing photos may occur if MLS syncing is delayed.</li>
      <li>Comparable properties may need adjustment for accuracy.</li>
      <li>Presentation formatting should always be reviewed before sending.</li>
    </ul>
  </div>
</div>
<div class="note"><b>Before finalizing a CMA</b>, users should verify MLS information, review comparable properties carefully, and confirm pricing recommendations are accurate and current. Customizing presentation pages can help create a cleaner and more personalized client experience.</div>`);

add('m9','What is Claude','Lesson',`
<h1>Your copilot for everything written.</h1>
<p class="lead">Claude is a highly capable AI assistant and large language model developed by Anthropic. Designed to handle advanced reasoning, coding, and natural language tasks, it is used for drafting content, analyzing complex datasets, and building automated agents.</p>
<h2>The model family</h2>
<div class="grid3">
  <div class="card"><h3 style="font-size:19px">Opus</h3><p style="font-size:14px;margin:0">The flagship, most advanced model built for highly complex reasoning and enterprise tasks.</p></div>
  <div class="card"><h3 style="font-size:19px">Sonnet</h3><p style="font-size:14px;margin:0">The standard model that balances high speed performance and intelligence, commonly used for everyday workflows.</p></div>
  <div class="card"><h3 style="font-size:19px">Haiku</h3><p style="font-size:14px;margin:0">The fastest and most efficient model for high speed, light duty tasks.</p></div>
</div>
<div class="note tip"><b>In this training.</b> The next lesson breaks down the prompt structure, then you get a library of 16 ready to use templates organized by role. Copy, fill the brackets, send.</div>`);

add('m9','How to structure a prompt','Lesson',`
<h1>Five ingredients that turn a vague request into a great response.</h1>
${sl('m9-prompt-structure.jpg','Role + Context + Task + Format + Example')}
<div class="card">
  <div class="kv"><div class="k">1 &middot; Role</div><div>Tell Claude who to be. Its expertise, tone, and perspective.</div></div>
  <div class="kv"><div class="k">2 &middot; Context</div><div>Share the background: who the audience is, what the situation is.</div></div>
  <div class="kv"><div class="k">3 &middot; Task</div><div>State clearly what you want done. Use action verbs.</div></div>
  <div class="kv"><div class="k">4 &middot; Format</div><div>Specify length, structure, or style: bullet list, 2 paragraphs, table.</div></div>
  <div class="kv"><div class="k">5 &middot; Example</div><div>Optional but powerful. Show Claude a sample of what good looks like.</div></div>
</div>
<div class="note"><b>The key insight.</b> Claude works best when it understands <b>who it is talking to, what the situation is, and what success looks like</b>. Most people skip these details and then wonder why the output feels generic.</div>`);

add('m9','The prompt library','Lesson',`
<h1>Sixteen templates, four roles.</h1>
<p class="lead">Each template follows the five ingredient structure, color coded so you can see the pattern. Copy the skeleton, replace the bracketed fields, and adjust to your case. The <b>key move</b> under each one explains why it works.</p>
<div class="ing" style="margin:0 0 18px">
  <span class="i-role">Role</span><span class="i-ctx">Context</span><span class="i-task">Task</span><span class="i-fmt">Format</span>

 {g:'tc',t:'Step by step follow up system · contract to close',s:'Dated action plan with escalations',

     ['task','Write a complete, professional SOP document for this process. Include: a purpose statement explaining why this process matters to the business, a scope section defining who this applies to and when it is triggered, a roles and responsibilities table listing each team member involved and their specific duties, a numbered step by step procedure with decision points and conditional branches clearly marked (e.g. "If X then Y, if not then Z"), a tools and systems section listing every platform, template, or form used in each step, a quality control checklist that can be signed off at key milestones, and a version control footer with fields for date created, last reviewed, and approved by.'],

     ['task','Compare the submitted document against the SOP step by step. For every required step or field in the SOP, tell me whether it was completed correctly, completed with errors, or missing entirely. Where something is missing or incorrect, quote the exact SOP requirement it violates and write a brief correction note I can send directly to the agent. Then give me an overall compliance score as a percentage based on steps completed versus total required steps, and a recommendation: approve the file, return for minor corrections, or escalate for review.'],
     ['fmt','Present your findings in three sections: "Passed" (a bulleted list of all compliant items), "Needs correction" (each issue as a numbered item with the SOP clause, what was found, and the correction note), and "Recommendation" (one paragraph with the compliance score and your suggested action). Write the correction notes in a professional but direct tone — they will be copied and sent to the agent as-is.']],
  w:'Pasting both the SOP and the submitted document gives Claude a clear benchmark to audit against — the output is a side by side gap analysis, not a guess. The correction notes written in a ready to send tone save a full round of drafting, and the compliance score gives you a trackable metric across your whole team over time.'},

  w:'Giving Claude the raw data and asking for root cause analysis — not just a summary — means you get an operations perspective, not a spreadsheet recap. The Green/Amber/Red status line gives leadership an instant read before they open the report, which is how senior decision makers actually consume information.'},
 {g:'ops',t:'Role specific 30 day onboarding roadmap',s:'Week by week plan with daily tasks',

     ['ctx','We have just hired a new [ROLE — e.g. transaction coordinator / listing manager / office administrator / buyer\'s agent]. Their start date is [DATE]. They have [DESCRIBE EXPERIENCE LEVEL — e.g. "3 years in real estate administration but new to our systems" / "no prior real estate experience"]. Our company uses [LIST KEY TOOLS: CRM, transaction platform, communication tools]. The key SOPs they must know within their first 30 days are: [LIST 3–5 PROCESSES]. Their direct manager is [NAME / TITLE] and they will be supported by [BUDDY / MENTOR NAME if applicable].'],

     ['fmt','Present the plan week by week, each in a clearly labeled block. Use a consistent structure: Theme, Objectives, Daily breakdown (Mon–Fri), SOP reading list for that week, End-of-week checkpoint criteria. Keep the daily tasks specific — "review the listing intake SOP and shadow one listing call" not "learn the listing process." End with the Day 1 welcome message template in a separate labeled block, written in a warm and professional tone.'],],
  w:'The daily level specificity is the key difference between a plan someone actually follows and one that sits in a folder. By anchoring each week to a theme and ending with a checkpoint, you build a feedback loop into the onboarding itself — you know whether the hire is on track before the 90 day review, not after. The welcome message template removes a small but real friction point that managers routinely skip.'}

 m7:{t:'ListTrac',q:[
  {q:'A seller says they never received their report. What do you check first?',o:['Report history for delivery status, the seller&rsquo;s email address, and their spam folder','Nothing, reports always deliver','Delete and recreate the listing'],a:0,
   e:'ListTrac stores report history and delivery activity. Incorrect seller emails prevent delivery, and reports can be filtered into spam or junk folders.'},
  {q:'A listing went live yesterday and shows almost no analytics. What is going on?',o:['The listing is broken and must be re-entered','New listings may take 3 to 5 days to appear and data needs time to fully sync','ListTrac only tracks sold properties'],a:1,
   e:'Listings may take 3 to 5 days to appear after going live, and early listing activity shows limited statistics until data fully syncs.'}]},
 m8:{t:'MoxiWorks',q:[
  {q:'Fastest way to pre fill photos, description and tax data in a CMA?',o:['Type everything manually to be safe','Import a CSV from ActivePipe','Enter the property&rsquo;s MLS number and let the system populate it'],a:2,
   e:'If a property was previously listed, entering the MLS number may automatically populate listing photos, descriptions, tax information and additional details.'},
  {q:'Which listing statuses can you pull comparable properties from?',o:['Active, pending, withdrawn or sold','Only sold listings','Only active listings'],a:0,
   e:'MoxiWorks lets you add comps from active, pending, withdrawn or sold listings to determine an accurate price range.'}]},
 m9:{t:'Claude',q:[
  {q:'Name the five ingredients of a well structured prompt.',o:['Subject, verb, adjectives, emojis, hashtags','Role, Context, Task, Format, and an optional Example','Model, temperature, tokens, system, user'],a:1,
   e:'Role tells Claude who to be, Context gives the situation, Task states the job, Format defines the output shape, and Example shows what good looks like.'},
  {q:'Why do most prompts return generic output?',o:['The model is not powerful enough','People skip who it is talking to, what the situation is, and what success looks like','The prompt is too short in characters'],a:1,
   e:'That is exactly the key insight from the deck: Claude works best when it understands the audience, the situation and the definition of success. Most people skip those details.'},
  {q:'In the MLS public remarks template, why ask for three versions?',o:['To have backups in case one gets deleted','Because MLS requires three descriptions','Because each version leads with a different buyer psychology: lifestyle, features, or location'],a:2,
   e:'Framing each version around a different lead angle gives you options you can match to the specific buyer profile most likely to walk through that door.'}]}
};

/* ============ STATE ============ */
let idx=0, done=[], scores={}, booted=false;
try{done=JSON.parse(localStorage.getItem('mt2_done')||'[]');scores=JSON.parse(localStorage.getItem('mt2_scores')||'{}');idx=+(localStorage.getItem('mt2_idx')||0);}catch(e){}
if(idx<0||idx>=L.length)idx=0;
const save=()=>{try{localStorage.setItem('mt2_done',JSON.stringify(done));localStorage.setItem('mt2_scores',JSON.stringify(scores));localStorage.setItem('mt2_idx',idx);}catch(e){}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ============ SIDEBAR ============ */
function renderSide(){
  const cur=L[idx];
  $('#sideNav').innerHTML=MODS.map(mo=>{
    const ls=L.map((l,i)=>({...l,i})).filter(l=>l.m===mo.id);
    const allDone=ls.every(l=>done.includes(l.i));
    const isCur=cur&&cur.m===mo.id;
    const n=MODS.indexOf(mo)+1;
    return `<div class="mod ${allDone?'done':''} ${isCur?'active open':''}" data-m="${mo.id}">
      <button class="mod-h" onclick="tMod(this)">
        <span class="mod-n">${allDone?'&#10003;':n}</span>
        <span class="mod-t"><span class="nm">${mo.n}</span><span class="ct">${ls.filter(l=>done.includes(l.i)).length}/${ls.length} &middot; ${mo.d}</span></span>
        <span class="mod-chev">&#9656;</span>
      </button>
      <div class="mod-b">${ls.map(l=>`
        <button class="les ${done.includes(l.i)?'done':''} ${l.i===idx?'on':''}" onclick="jumpTo(${l.i})">
          <span class="les-tick">&#10003;</span>
          <span class="les-x">${l.t}${l.k==='Quiz'?'<span class="les-kind">Knowledge check</span>':''}</span>
        </button>`).join('')}</div>
    </div>`;
  }).join('');
  const pct=Math.round(done.length/L.length*100);
  $('#tbFill').style.width=pct+'%';$('#tbPct').textContent=pct+'%';
  $('#sideBar').style.width=pct+'%';
  $('#sideMeta').textContent=`${MODS.length} modules · ${pct}% complete`;
  const on=$('.les.on');
  if(on&&booted){const r=on.getBoundingClientRect(),s=$('#side').getBoundingClientRect();
    if(r.top<s.top+60||r.bottom>s.bottom-10)on.scrollIntoView({block:'center'});}
}
function tMod(h){h.parentNode.classList.toggle('open');}
function jumpTo(i){idx=i;render();if(window.innerWidth<=960)closeSide();}
function jump(mid){const i=L.findIndex(l=>l.m===mid);if(i>=0)jumpTo(i);}
function toggleSide(){$('#side').classList.toggle('open');$('#sideVeil').classList.toggle('on');}
function closeSide(){$('#side').classList.remove('open');$('#sideVeil').classList.remove('on');}

/* ============ RENDER ============ */
function render(){
  const l=L[idx], mo=MODS.find(m=>m.id===l.m), mn=MODS.indexOf(mo)+1;
  const body=l.html.startsWith('__QUIZ__')?quizHtml(l.html.slice(8)):l.html;
  $('#lesson').innerHTML=`<div class="crumb"><span class="pill">Module ${mn}</span><span>${mo.n}</span><span class="sep">/</span><span>${l.k}</span></div>${body}`;
  $('#stage').scrollTop=0;
  $('#btnPrev').disabled=idx===0;
  const last=idx===L.length-1;
  $('#btnNext').innerHTML=last?'Finish &#10003;':'Next &rarr;';
  $('#btnNext').classList.toggle('gold',last);
  $('#posLbl').textContent=`Lesson ${idx+1} of ${L.length}`;
  if(l.k!=='Quiz'&&!done.includes(idx)){done.push(idx);save();}
  if(l.html==='__QUIZ__m9'||l.t==='The prompt library')setTimeout(renderPlib,0);
  renderSide();save();
}
function go(d){
  const l=L[idx];
  if(d>0&&l.k==='Quiz'&&!done.includes(idx)){toast('Answer the questions above to continue.');return;}
  if(d>0&&idx===L.length-1){showDone();return;}
  idx=Math.max(0,Math.min(L.length-1,idx+d));render();
}

/* ============ QUIZ ============ */
function quizHtml(mid){
  const Q=QUIZ[mid],mo=MODS.find(m=>m.id===mid);
  return `<h1>${mo.n}: <em>knowledge check</em></h1>
  <p class="lead">Answer each question to complete this module. If you miss one, the correct answer is highlighted with an explanation, so it still counts as learning.</p>
  <div class="quiz" data-m="${mid}">
    <span class="eyebrow">Module ${MODS.indexOf(mo)+1} &middot; ${Q.q.length} question${Q.q.length>1?'s':''}</span>
    <h2>${Q.t}</h2>
    <div class="qsub">Choose the best answer for each.</div>
    ${Q.q.map((q,qi)=>`<div class="qq" data-q="${qi}">
      <div class="qt"><span class="n">${String(qi+1).padStart(2,'0')}</span><span>${q.q}</span></div>
      ${q.o.map((o,oi)=>`<button class="qopt" onclick="ans(this,${qi},${oi})">${o}</button>`).join('')}
      <div class="qfb"></div>
    </div>`).join('')}
    <div class="qscore" id="qscore" style="display:none"><span class="num" id="qnum"></span><span class="lbl" id="qlbl"></span></div>
  </div>`;
}
function ans(btn,qi,oi){
  const wrap=btn.closest('.quiz'), mid=wrap.dataset.m, Q=QUIZ[mid], q=Q.q[qi];
  const box=btn.closest('.qq'); if(box.dataset.done)return;
  box.dataset.done='1';
  box.querySelectorAll('.qopt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok');});
  if(oi!==q.a)btn.classList.add('no');
  const fb=box.querySelector('.qfb');
  fb.innerHTML=(oi===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.e;
  fb.classList.add('show');
  scores[mid]=scores[mid]||{c:0,t:Q.q.length};
  if(oi===q.a)scores[mid].c++;
  const answered=wrap.querySelectorAll('.qq[data-done]').length;
  if(answered===Q.q.length){
    const s=scores[mid];
    $('#qscore').style.display='flex';
    $('#qnum').textContent=s.c+'/'+s.t;
    $('#qlbl').textContent=s.c===s.t?'Perfect. Module complete, hit Next to continue.':'Module complete. Review the explanations above, then hit Next.';
    if(!done.includes(idx)){done.push(idx);}
    toast(s.c===s.t?'&#10003; Perfect score':'&#10003; Module complete');
    renderSide();
  }
  save();
}

/* ============ PROMPT LIBRARY ============ */
function renderPlib(){
  const el=$('#plib'); if(!el)return;
  el.innerHTML=PROMPTS.map((p,i)=>{
    const kinds={role:'Role',ctx:'Context',task:'Task',fmt:'Format'};
    return `<div class="pc" data-g="${p.g}">
      <button class="pc-h" onclick="tCard(this)"><div><div class="t">${p.t}</div><div class="s">${p.s}</div></div><span class="chev">&#9656;</span></button>
      <div class="pc-b">
        <div class="ing">${p.p.map(x=>`<span class="i-${x[0]}">${kinds[x[0]]}</span>`).join('')}</div>
        <div class="pre"><button class="pcopy" onclick="copyPre(this)">Copy</button>${p.p.map(x=>`<span class="${x[0]}">${x[1]}</span>`).join('\n\n')}</div>
        <p class="pwhy"><b>Key move:</b> ${p.w}</p>
      </div></div>`;
  }).join('');
}
function pFilter(b){
  $$('.ptab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const g=b.dataset.g;
  $$('.pc').forEach(c=>{c.style.display=(g==='all'||c.dataset.g===g)?'':'none';});
}
function tCard(h){h.parentNode.classList.toggle('open');}
function tAcc(h){h.parentNode.classList.toggle('open');}
function copyPre(btn){
  const c=btn.parentNode.cloneNode(true);c.querySelector('.pcopy').remove();
  navigator.clipboard.writeText(c.innerText.trim()).then(()=>toast('&#10003; Prompt copied to clipboard'));
}
function copyHex(h){navigator.clipboard.writeText(h).then(()=>toast('&#10003; '+h+' copied'));}

/* ============ LIGHTBOX ============ */
let lbList=[],lbI=0;
function openLb(f){
  lbList=$$('.slide img').map(i=>i.getAttribute('src').split('/').pop());
  lbI=Math.max(0,lbList.indexOf(f));
  $('#lbImg').src=IMG+f;$('#lb').classList.add('on');
}
function closeLb(e,force){if(force||e.target.id==='lb'||e.target.classList.contains('lb-x'))$('#lb').classList.remove('on');}
function lbNav(e,d){e.stopPropagation();if(!lbList.length)return;lbI=(lbI+d+lbList.length)%lbList.length;$('#lbImg').src=IMG+lbList[lbI];}

/* ============ COMPLETION ============ */
function showDone(){
  const tot=Object.values(scores).reduce((a,s)=>a+s.t,0), got=Object.values(scores).reduce((a,s)=>a+s.c,0);
  $('#lesson').innerHTML=`<div class="done"><div class="in">
    <div class="seal">&#9733;</div>
    <span class="eyebrow" style="color:#7ED9E6">Training complete</span>
    <h2>You know the ecosystem.</h2>
    <p>Brand, playbook, the five platforms and the prompt library. You are ready to produce work that passes a brand review the first time.</p>
    <div class="done-stats">
      <div class="d"><b>${L.length}</b><span>Lessons</span></div>
      <div class="d"><b>${got}/${tot||0}</b><span>Quiz answers</span></div>
      <div class="d"><b>9</b><span>Modules</span></div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="index.html">Back to Home</a>
      <button class="btn ghost" onclick="jumpTo(L.findIndex(l=>l.t==='The prompt library'))">Open the prompt library</button>
    </div>
  </div></div>`;
  $('#stage').scrollTop=0;
}
function resetAll(){
  if(!confirm('Reset your progress and start the training from the beginning?'))return;
  done=[];scores={};idx=0;save();render();toast('Progress reset');
}

/* ============ KEYS + BOOT ============ */
document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('on')){
    if(e.key==='Escape')$('#lb').classList.remove('on');
    if(e.key==='ArrowLeft')lbNav(e,-1); if(e.key==='ArrowRight')lbNav(e,1);
    return;
  }
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
});
render();
booted=true;
</script>
</body>
</html>
