<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Training · SkillCloud Academy</title>
<meta name="description" content="Interactive marketing training on the Sotheby's International Realty tool ecosystem: brand, campaign playbook, the five platforms, and AI prompting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cormorant is loaded ONLY to preview the Sotheby's serif inside the typography lesson. The UI itself uses the SkillCloud system stack. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* SkillCloud brand tokens — identical to assets/css/styles.css */
  --v-navy:#0a2647; --v-navy2:#0f3460; --v-blue:#1565c0; --v-sky:#5aa9e6;
  --v-cyan:#17c3d4; --v-cyan-d:#0fa6b6; --v-ink:#0c1e33; --v-muted:#5b6b7e;
  --v-bg:#f6f9fc; --v-line:#e3eaf1;
  --gold:#b08d3f;
  --body:#33465e; --faint:#8fa1b3; --line-2:#cfdbe6; --soft:#eef3f8;
  --good:#1f9e5a; --good-bg:#e4f4ec; --bad:#d2452f; --warn:#a86e10; --warn-bg:#fbf1dc;
  --shadow:0 2px 10px rgba(10,38,71,.08); --shadow-m:0 6px 22px rgba(10,38,71,.1); --shadow-l:0 8px 30px rgba(10,38,71,.14);
  --radius:14px; --r-sm:10px;
  --side:290px; --top:58px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --serif-demo:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--v-bg);color:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--v-cyan-d);text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);color:var(--v-navy);letter-spacing:-.5px;line-height:1.2}
h1{font-size:31px;font-weight:900;letter-spacing:-1px}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:800;color:var(--v-navy2)}
h4{font-size:15.5px;font-weight:800}
b,strong{color:var(--v-ink);font-weight:700}
:focus-visible{outline:2px solid var(--v-cyan-d);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfdbe6;border-radius:6px;border:3px solid var(--v-bg)}
::-webkit-scrollbar-thumb:hover{background:#b4c4d4}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--v-cyan-d)}
.mono{font-family:var(--mono)}

/* ============ TOP BAR ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:#fff;border-bottom:1px solid var(--v-line);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:120}
.tb-back{display:inline-flex;align-items:center;gap:7px;color:var(--v-muted);font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:var(--r-sm)}
.tb-back:hover{background:var(--soft);color:var(--v-navy)}
.tb-brand{font-family:var(--display);font-size:17px;font-weight:900;letter-spacing:-.6px;color:var(--v-navy);white-space:nowrap}
.tb-brand span{color:var(--v-cyan-d)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-count{font-size:12.5px;color:var(--v-muted);font-weight:600;white-space:nowrap}
.tb-count b{color:var(--v-navy)}
.tb-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--v-muted);font-size:15px}
.tb-btn:hover{background:var(--soft);color:var(--v-navy)}
.burger{display:none}
.tb-prog{position:fixed;top:var(--top);left:0;right:0;height:3px;background:var(--v-line);z-index:121}
.tb-prog i{display:block;height:100%;width:0;background:var(--v-cyan);transition:width .4s cubic-bezier(.4,0,.2,1)}
@media(max-width:960px){.burger{display:grid}.tb-brand{font-size:15px}.tb-count{display:none}}

/* ============ SIDEBAR ============ */
.side{position:fixed;top:calc(var(--top) + 3px);left:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--v-line);overflow-y:auto;z-index:110;padding-bottom:24px;transition:transform .25s ease}
.side-hd{padding:18px 20px 16px;border-bottom:1px solid var(--v-line)}
.side-hd .ttl{font-family:var(--display);font-size:16px;font-weight:800;color:var(--v-navy);letter-spacing:-.4px;line-height:1.25}
.side-hd .sub{font-size:12.5px;color:var(--v-muted);margin-top:3px}
.side-hd .bar{height:6px;border-radius:4px;background:var(--v-line);margin-top:12px;overflow:hidden}
.side-hd .bar i{display:block;height:100%;width:0;background:var(--v-cyan);border-radius:4px;transition:width .4s}
.side-hd .pct{display:flex;justify-content:space-between;font-size:11.5px;color:var(--v-muted);margin-top:6px;font-weight:600}

.mod + .mod{border-top:1px solid var(--v-line)}
.mod-h{width:100%;display:flex;align-items:center;gap:11px;padding:11px 16px;text-align:left;transition:background .15s}
.mod-h:hover{background:var(--v-bg)}
.mod-n{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--v-navy2);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none;transition:.2s}
.mod.done .mod-n{background:var(--good);color:#fff}
.mod.active .mod-n{background:var(--v-navy);color:#fff}
.mod-t{flex:1;min-width:0}
.mod-t .nm{display:block;font-size:13.5px;font-weight:700;color:var(--v-ink);line-height:1.35}
.mod-t .ct{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.mod-chev{color:var(--faint);font-size:10px;transition:transform .2s;flex:none}
.mod.open .mod-chev{transform:rotate(90deg)}
.mod-b{display:none;padding:0 8px 8px}
.mod.open .mod-b{display:block}

.les{width:100%;display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 10px 7px 12px;text-align:left;font-size:13px;color:var(--v-muted);line-height:1.35;border-radius:8px;transition:background .13s,color .13s}
.les:hover{background:var(--v-bg);color:var(--v-ink)}
.les.cur{background:var(--soft);color:var(--v-navy);font-weight:700;box-shadow:inset 3px 0 0 var(--v-cyan);padding:7px 10px 7px 12px}
.les-tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:8px;color:transparent;background:#fff;transition:.2s}
.les.done .les-tick{background:var(--good);border-color:var(--good);color:#fff}
.les.cur:not(.done) .les-tick{border-color:var(--v-cyan-d)}
.les-x{flex:1;min-width:0}
.les-kind{display:block;font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--v-cyan-d);text-transform:uppercase;margin-top:1px}
.side-veil{display:none;position:fixed;inset:0;background:rgba(10,38,71,.42);z-index:105}
@media(max-width:960px){
  .side{transform:translateX(-100%);box-shadow:var(--shadow-l)}
  .side.open{transform:none}
  .side-veil.on{display:block}
}

/* ============ STAGE ============ */
.stage{position:fixed;top:calc(var(--top) + 3px);left:var(--side);right:0;bottom:0;overflow-y:auto}
@media(max-width:960px){.stage{left:0}}
.lesson{max-width:840px;margin:0 auto;padding:30px 40px 118px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:700px){.lesson{padding:22px 18px 118px}}

.crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--v-muted);margin-bottom:14px;flex-wrap:wrap}
.crumb .pill{background:var(--v-navy);color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:.5px}
.crumb .sep{color:var(--line-2)}
.lesson h1{margin-bottom:10px}
.lesson h1 em{font-style:normal;color:var(--v-cyan-d)}
.lead{font-size:16.5px;color:var(--body);margin-bottom:22px;line-height:1.6}
.lesson h2{margin:30px 0 10px}
.lesson h3{margin:22px 0 8px}
.lesson p{margin-bottom:12px}
.lesson ul,.lesson ol{margin:8px 0 14px 20px}
.lesson li{margin-bottom:6px}

/* slides */
.slide{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--v-line);box-shadow:var(--shadow);background:#EDECE6;margin:18px 0 8px;cursor:zoom-in;transition:box-shadow .2s,transform .2s;display:block;width:100%}
.slide:hover{box-shadow:var(--shadow-m);transform:translateY(-2px)}
.slide img{width:100%;display:block}
.slide .zoom{position:absolute;right:10px;bottom:10px;background:rgba(10,38,71,.86);color:#fff;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:700;opacity:0;transition:opacity .2s}
.slide:hover .zoom,.slide:focus-visible .zoom{opacity:1}
.slide-cap{font-size:12.5px;color:var(--v-muted);text-align:center;margin-bottom:20px}
.slide-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 8px}
@media(max-width:760px){.slide-row{grid-template-columns:1fr}}
.slide-row .slide{margin:0}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(8,20,35,.95);z-index:400;display:none;align-items:center;justify-content:center;padding:5vh 6vw;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.lb-x{position:absolute;top:16px;right:22px;color:#fff;font-size:26px;opacity:.7;width:40px;height:40px;border-radius:50%}
.lb-x:hover{opacity:1;background:rgba(255,255,255,.12)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:20px}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-prev{left:18px}.lb-next{right:18px}
.lb-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#9fb4c9;font-size:12.5px;font-weight:600}

/* ============ CONTENT BLOCKS ============ */
.card{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin:16px 0}
.card > h3:first-child,.card > h4:first-child{margin-top:0}
.card p:last-child,.card ul:last-child,.card ol:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;align-items:stretch}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0;align-items:stretch}
.grid2 > .card,.grid3 > .card{margin:0}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.navy{background:linear-gradient(160deg,var(--v-navy),var(--v-navy2));border-color:transparent;color:#c7d7e6}
.navy h2,.navy h3,.navy h4{color:#fff}
.navy b,.navy strong{color:#fff}
.navy .eyebrow{color:#7ee3ee}
.note{border-left:4px solid var(--v-cyan);background:#fff;border-radius:0 var(--r-sm) var(--r-sm) 0;padding:14px 18px;margin:16px 0;font-size:14.5px;box-shadow:var(--shadow)}
.note b{color:var(--v-navy)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.note.tip{border-left-color:var(--v-cyan);background:#e9f9fb}

.kv{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--v-line)}
.kv:last-child{border-bottom:none;padding-bottom:0}
.kv:first-child{padding-top:0}
.kv .k{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--v-cyan-d);width:132px;flex:none;padding-top:2px}
@media(max-width:600px){.kv{flex-direction:column;gap:4px}.kv .k{width:auto}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--v-line);border:1px solid var(--v-line);border-radius:var(--radius);overflow:hidden;margin:18px 0}
.stats .s{background:#fff;padding:16px 12px;text-align:center}
.stats .s b{display:block;font-family:var(--display);font-size:26px;font-weight:900;color:var(--v-navy);letter-spacing:-1px;line-height:1.1}
.stats .s span{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--v-muted)}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}

/* timeline */
.tl{position:relative;margin:18px 0;padding-left:24px;border-left:2px solid var(--v-line)}
.tl-i{position:relative;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-31px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--v-cyan);border:3px solid var(--v-bg)}
.tl-i .yr{font-size:11.5px;font-weight:800;letter-spacing:.8px;color:var(--v-cyan-d)}
.tl-i h4{margin:3px 0 4px}
.tl-i p{font-size:14.5px;margin:0}

/* steps */
.steps{counter-reset:st;display:grid;gap:10px;margin:16px 0}
.step{display:flex;gap:15px;background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);padding:15px 20px;box-shadow:var(--shadow);align-items:flex-start;transition:border-color .18s,transform .18s}
.step:hover{border-color:var(--v-cyan);transform:translateX(3px)}
.step::before{counter-increment:st;content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--v-navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.step h4{margin-bottom:3px}
.step h4 i{font-style:normal;color:var(--v-cyan-d)}
.step p{font-size:14px;margin:0}

/* tool cards */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin:18px 0}
.tool{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;text-align:left;display:flex;flex-direction:column}
.tool:hover{transform:translateY(-3px);box-shadow:var(--shadow-m);border-color:var(--v-cyan)}
.tool .tn{font-family:var(--display);font-size:17px;font-weight:800;color:var(--v-navy);letter-spacing:-.4px}
.tool .tr{font-size:12.5px;color:var(--v-muted);margin-top:5px;flex:1}
.tool .tg{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--v-cyan-d);text-transform:uppercase;margin-top:10px}

/* accordion */
.acc{border:1px solid var(--v-line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:14.5px;font-weight:700;color:var(--v-navy);text-align:left}
.acc-h:hover{background:var(--v-bg)}
.acc-h .ic{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--v-navy2);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.acc-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s;font-size:11px}
.acc.open .chev{transform:rotate(90deg)}
.acc.open .ic{background:var(--v-cyan);color:#03282c}
.acc-b{display:none;padding:0 18px 16px 54px;font-size:14.5px}
.acc.open .acc-b{display:block}
.acc-b ul{margin:2px 0 4px 18px}
.acc-b p:last-child{margin-bottom:0}

/* swatches */
.sws{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
@media(max-width:700px){.sws{grid-template-columns:1fr}}
.sw{border-radius:var(--radius);overflow:hidden;border:1px solid var(--v-line);box-shadow:var(--shadow);cursor:pointer;background:#fff;transition:.18s;text-align:left;width:100%}
.sw:hover{transform:translateY(-3px);box-shadow:var(--shadow-m)}
.sw .chip{height:88px;position:relative}
.sw .chip::after{content:'Click to copy';position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;background:rgba(10,38,71,.4);opacity:0;transition:opacity .18s}
.sw:hover .chip::after{opacity:1}
.sw .info{padding:12px 15px}
.sw .nm{font-weight:800;color:var(--v-ink);font-size:14px}
.sw .vals{font-family:var(--mono);font-size:11.5px;color:var(--v-muted);margin-top:5px;line-height:1.7}

/* type specimen — the ONLY place the SIR serif appears, as a preview */
.spec{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:16px 0}
.spec .r{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:18px;align-items:baseline;border-bottom:1px solid var(--v-line);padding:14px 0}
.spec .r:first-child{padding-top:0}
.spec .r:last-child{border-bottom:none;padding-bottom:0}
.spec .who{font-family:var(--mono);font-size:11px;color:var(--v-muted);text-align:right;line-height:1.7}
@media(max-width:640px){.spec .r{grid-template-columns:1fr}.spec .who{text-align:left}}
.d-h1{font-family:var(--serif-demo);font-size:36px;color:var(--v-navy);font-weight:500;line-height:1.15}
.d-h2{font-family:var(--serif-demo);font-size:25px;color:var(--v-navy);font-weight:600}
.d-sub{font-size:16px;font-weight:700;color:var(--v-ink)}
.d-body{font-size:15px}

/* table */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--v-line);margin:16px 0}
.tbl th{background:var(--v-navy);color:#fff;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;padding:11px 14px;text-align:left;font-weight:800}
.tbl td{padding:12px 14px;border-top:1px solid var(--v-line);font-size:14px;vertical-align:top}
.tbl td.k{font-weight:800;color:var(--v-navy);white-space:nowrap}

/* shapes */
.shapes{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:16px 0}
.shp{background:#EDECE6;width:78px;border:1px solid var(--v-line)}
.s-rect{height:98px}
.s-oval{height:98px;border-radius:50%/44%}
.s-arch{height:98px;border-radius:39px 39px 0 0}
.s-curve{height:98px;border-radius:22px 4px 22px 4px}
.s-step{height:98px;clip-path:polygon(0 12%,12% 12%,12% 0,88% 0,88% 12%,100% 12%,100% 88%,88% 88%,88% 100%,12% 100%,12% 88%,0 88%)}
.shp-l{font-size:11.5px;font-weight:600;color:var(--v-muted);text-align:center;margin-top:8px}

/* prompt library */
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.ptab{border:1.5px solid var(--line-2);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--v-muted);background:#fff;transition:.16s}
.ptab:hover{border-color:var(--v-navy);color:var(--v-navy)}
.ptab.on{background:var(--v-navy);border-color:var(--v-navy);color:#fff}
.pc{background:#fff;border:1px solid var(--v-line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
.pc-h{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;text-align:left}
.pc-h:hover{background:var(--v-bg)}
.pc-h .t{font-weight:800;color:var(--v-navy);font-size:14.5px}
.pc-h .s{font-size:12.5px;color:var(--v-muted);margin-top:2px}
.pc-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s;flex:none;font-size:11px}
.pc.open .chev{transform:rotate(90deg)}
.pc-b{display:none;padding:0 18px 16px}
.pc.open .pc-b{display:block}
.ing{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.ing span{font-size:10px;font-weight:800;letter-spacing:.5px;border-radius:5px;padding:3px 9px;text-transform:uppercase}
.i-role{background:#e3edf9;color:#1c5290}
.i-ctx{background:#efe9fb;color:#5b3ea8}
.i-task{background:#fbe9e2;color:#a0452c}
.i-fmt{background:#e2f4ea;color:#1f7a4a}
.pre{background:var(--v-navy);color:#d7e5f2;border-radius:var(--r-sm);padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.8;white-space:pre-wrap;position:relative;word-break:break-word}
.pre .role{color:#8ec3f0}.pre .ctx{color:#c4b1ef}.pre .task{color:#f0b096}.pre .fmt{color:#93dcb2}
.pcopy{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.14);border-radius:7px;padding:6px 12px;font-size:11px;color:#e0ecf6;font-family:var(--sans);font-weight:700}
.pcopy:hover{background:var(--v-cyan);color:#03282c}
.pwhy{font-size:13.5px;color:var(--v-muted);margin-top:11px;border-left:3px solid var(--v-cyan);padding-left:13px}
.pwhy b{color:var(--v-navy)}

/* quiz */
.quiz{background:linear-gradient(160deg,var(--v-navy),var(--v-navy2));border-radius:var(--radius);color:#c7d7e6;padding:26px 28px;margin:6px 0 18px;box-shadow:var(--shadow-m)}
.quiz .eyebrow{color:#7ee3ee}
.quiz h2{color:#fff;margin:8px 0 4px}
.quiz .qsub{color:#9fb4c9;font-size:14px;margin-bottom:20px}
.qq{margin-bottom:22px}
.qq:last-of-type{margin-bottom:6px}
.qq .qt{font-size:15.5px;font-weight:700;color:#fff;margin-bottom:11px;display:flex;gap:10px;line-height:1.45}
.qq .qt .n{font-family:var(--mono);font-size:12px;color:#7ee3ee;flex:none;padding-top:2px}
.qopt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:var(--r-sm);padding:12px 15px;font-size:14.5px;color:#e3ecf4;margin-bottom:8px;transition:.15s;line-height:1.45}
.qopt:hover:not(:disabled){border-color:#7ee3ee;background:rgba(255,255,255,.13)}
.qopt:disabled{cursor:default}
.qopt.ok{background:rgba(31,158,90,.32);border-color:#4ad286;color:#fff}
.qopt.no{background:rgba(210,69,47,.3);border-color:#e8907f;color:#fff}
.qfb{font-size:13.5px;color:#bcd0e2;background:rgba(255,255,255,.07);border-radius:var(--r-sm);padding:11px 15px;margin-top:6px;display:none;border-left:3px solid var(--v-cyan)}
.qfb.show{display:block}
.qscore{display:none;align-items:center;gap:13px;border-top:1px solid rgba(255,255,255,.18);padding-top:16px;margin-top:4px}
.qscore.show{display:flex}
.qscore .num{font-family:var(--display);font-size:26px;font-weight:900;color:#7ee3ee;letter-spacing:-1px}
.qscore .lbl{font-size:13.5px;color:#9fb4c9}

/* footer nav */
.fnav{position:fixed;bottom:0;left:var(--side);right:0;background:rgba(246,249,252,.97);backdrop-filter:blur(8px);border-top:1px solid var(--v-line);padding:12px 40px;display:flex;align-items:center;gap:14px;z-index:100}
@media(max-width:960px){.fnav{left:0;padding:11px 18px}}
.fbtn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:11px 20px;font-size:13.5px;font-weight:800;transition:.16s;white-space:nowrap}
.fbtn.prev{border:1.5px solid var(--line-2);color:var(--v-muted);background:#fff}
.fbtn.prev:hover:not(:disabled){border-color:var(--v-navy);color:var(--v-navy)}
.fbtn.next{background:var(--v-cyan);color:#03282c;margin-left:auto;box-shadow:0 4px 14px rgba(23,195,212,.3)}
.fbtn.next:hover{background:var(--v-cyan-d);color:#fff}
.fbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.fnav .pos{flex:1;text-align:center;font-size:12.5px;color:var(--v-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnav .pos b{color:var(--v-navy)}
@media(max-width:620px){.fnav .pos{display:none}.fbtn{padding:11px 15px;font-size:13px}}

/* completion */
.finish{background:linear-gradient(160deg,var(--v-navy),var(--v-navy2));border-radius:var(--radius);color:#c7d7e6;padding:42px 40px;text-align:center;box-shadow:var(--shadow-l);margin:10px 0}
.finish .seal{width:64px;height:64px;border-radius:50%;background:var(--v-cyan);color:#03282c;display:grid;place-items:center;font-size:27px;margin:0 auto 16px}
.finish h2{color:#fff;font-size:27px;margin-bottom:8px}
.finish p{color:#9fb4c9;max-width:460px;margin:0 auto 18px}
.finish .stats{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.18);margin:22px auto}
.finish .stats .s{background:rgba(10,38,71,.55)}
.finish .stats .s b{color:#7ee3ee}
.finish .stats .s span{color:#9fb4c9}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--v-cyan);color:#03282c;border-radius:var(--r-sm);padding:12px 24px;font-size:14px;font-weight:800}
.btn:hover{background:var(--v-cyan-d);color:#fff;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.ghost:hover{border-color:#fff;background:rgba(255,255,255,.1)}

/* misc */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--v-navy);color:#fff;padding:12px 22px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-l);opacity:0;transition:.24s;z-index:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{display:inline-block;font-family:var(--mono);font-size:11.5px;background:#eef2f6;border:1px solid var(--v-line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--v-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="topbar">
  <button class="tb-btn burger" onclick="toggleSide()" aria-label="Open course menu">&#9776;</button>
  <a class="tb-back" href="index.html">&larr; Home</a>
  <span class="tb-brand">Marketing <span>Training</span></span>
  <div class="tb-right">
    <span class="tb-count" id="tbCount"></span>
    <button class="tb-btn" onclick="resetAll()" aria-label="Reset progress" title="Reset progress">&#8635;</button>
  </div>
</header>
<div class="tb-prog"><i id="tbFill"></i></div>

<aside class="side" id="side" aria-label="Course outline">
  <div class="side-hd">
    <div class="ttl">The Sotheby&rsquo;s tool ecosystem</div>
    <div class="sub">Marketing team onboarding</div>
    <div class="bar"><i id="sideBar"></i></div>
    <div class="pct"><span id="sideMeta">0 of 46 lessons</span><span id="sidePct">0%</span></div>
  </div>
  <nav id="sideNav"></nav>
</aside>
<div class="side-veil" id="sideVeil" onclick="toggleSide()"></div>

<main class="stage" id="stage"><div id="lesson"></div></main>

<nav class="fnav" aria-label="Lesson navigation">
  <button class="fbtn prev" id="btnPrev" onclick="go(-1)">&larr; Previous</button>
  <span class="pos" id="posLbl"></span>
  <button class="fbtn next" id="btnNext" onclick="go(1)">Next &rarr;</button>
</nav>

<div class="lb" id="lb" onclick="closeLb(event)" role="dialog" aria-label="Slide viewer">
  <button class="lb-x" onclick="closeLb(event,1)" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" onclick="lbNav(event,-1)" aria-label="Previous slide">&#8249;</button>
  <img id="lbImg" src="" alt="Training slide">
  <button class="lb-nav lb-next" onclick="lbNav(event,1)" aria-label="Next slide">&#8250;</button>
  <span class="lb-count" id="lbCount"></span>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const IMG='assets/img/marketing/';

/* ============ helpers ============ */
const sl=(f,cap)=>`<button class="slide" onclick="openLb('${f}')" aria-label="Expand slide"><img src="${IMG}${f}" alt="${(cap||'Training slide').replace(/"/g,'')}" loading="lazy"><span class="zoom">&#9974; Expand</span></button>`+(cap?`<p class="slide-cap">${cap}</p>`:'');
const slr=(a,b,cap)=>`<div class="slide-row"><button class="slide" onclick="openLb('${a}')" aria-label="Expand slide"><img src="${IMG}${a}" alt="" loading="lazy"><span class="zoom">&#9974;</span></button><button class="slide" onclick="openLb('${b}')" aria-label="Expand slide"><img src="${IMG}${b}" alt="" loading="lazy"><span class="zoom">&#9974;</span></button></div>`+(cap?`<p class="slide-cap">${cap}</p>`:'');

/* ============ MODULES ============ */
const MODS=[
 {id:'m1',n:'The brand',d:'Where SIR comes from'},
 {id:'m2',n:'The toolbox',d:'The five platforms'},
 {id:'m3',n:'The 1 of 1 playbook',d:'Brand rules you apply daily'},
 {id:'m4',n:'Propel',d:'Your daily hub'},
 {id:'m5',n:'ActivePipe',d:'Email marketing'},
 {id:'m6',n:'Design Vault',d:'Design studio'},
 {id:'m7',n:'ListTrac',d:'Analytics & reports'},
 {id:'m8',n:'MoxiWorks',d:'CMAs & presentations'},
 {id:'m9',n:'Claude',d:'AI prompting'}
];

const L=[];
const add=(m,t,k,html)=>L.push({m,t,k,html});

/* ================= M1 ================= */
add('m1','Welcome','Start',`
<h1>Everything the marketing team touches, <em>in one place.</em></h1>
<p class="lead">Nine short modules. One idea per screen. By the end you will know which tool to open for any task, how to keep work on brand, and how to get real leverage out of Claude.</p>
<div class="stats">
  <div class="s"><b>9</b><span>Modules</span></div>
  <div class="s"><b>46</b><span>Slides</span></div>
  <div class="s"><b>16</b><span>Prompts</span></div>
  <div class="s"><b>~45</b><span>Minutes</span></div>
</div>
<div class="note tip"><b>How to move.</b> Use <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> or the buttons at the bottom. Click any slide to open it full screen. Your progress saves automatically, so you can stop and come back.</div>`);

add('m1','What is Sotheby&rsquo;s International Realty?','Lesson',`
<h1>A premier luxury real estate brokerage.</h1>
<p class="lead">Founded in 1976, operating a global network of more than 1,100 offices across 84 countries.</p>
${sl('m1-what-is-sir.jpg')}
<div class="stats" style="grid-template-columns:repeat(3,1fr)">
  <div class="s"><b>1976</b><span>Founded</span></div>
  <div class="s"><b>1,100+</b><span>Offices</span></div>
  <div class="s"><b>84</b><span>Countries</span></div>
</div>`);

add('m1','Where the brand came from','Lesson',`
<h1>It started at an auction house.</h1>
${sl('m1-art-of-living.jpg')}
<div class="tl">
  <div class="tl-i"><div class="yr">MID 1970s</div><h4>A pattern nobody had named</h4><p>The auction house noticed its wealthiest clients were not only buying rare art. They were also buying and selling the estates required to house it.</p></div>
  <div class="tl-i"><div class="yr">1976</div><h4>SIR launches</h4><p>A specialized real estate service for that same clientele, leveraging the trust of the Sotheby&rsquo;s name.</p></div>
</div>`);

add('m1','The deal that made SIR global','Lesson',`
<h1>2004: from brokerage to franchise.</h1>
<p class="lead">For 30 years SIR owned its own offices, which capped how fast it could grow. The 2004 agreement changed that.</p>
${sl('m1-franchise-compass.jpg')}
<div class="card">
  <div class="kv"><div class="k">The deal</div><div>Realogy paid <b>$100 million</b> to license the SIR name for <b>50 years</b>, with options to renew.</div></div>
  <div class="kv"><div class="k">The result</div><div>Independent luxury brokerages worldwide could rebrand as SIR: instant prestige, still locally owned.</div></div>
  <div class="kv"><div class="k">Early 2026</div><div>Anywhere and Compass merged into <b>Compass International Holdings</b>. SIR keeps its identity as the ultra luxury crown jewel.</div></div>
</div>`);

add('m1','The global standard: 1 of 1','Lesson',`
<h1>Not a promotion. <em>A permanent standard.</em></h1>
${sl('m1-global-standard.jpg')}
<p>&ldquo;1 of 1&rdquo; is applied to everything, from local yard signs to print features in <i>The New York Times</i> and <i>Architectural Digest</i>.</p>
<div class="note"><b>What it does.</b> It positions every property, at any price point, not as a listing but as a singular, irreplaceable piece within a curated global collection.</div>`);

add('m1','Your gate: SIR Access','Lesson',`
<h1>One login. Your role defines the toolkit.</h1>
<p class="lead">Accessing the SIR platform is one of the first steps of your day. It is a gated environment where everything you need appears the moment you log in.</p>
<div class="card">
  <ul>
    <li>Secure login with <b>two factor authentication</b>.</li>
    <li>Two main entry points: the <b>SIR platform</b> and <b>Propel</b>.</li>
    <li>Links and resources inside Propel vary by client and account configuration.</li>
  </ul>
</div>
<div class="note warn"><b>Permissions.</b> What your client grants may affect your access. Agree on access levels up front so your workflow never stalls.</div>`);

add('m1','Module 1 check','Quiz','__QUIZ__m1');

/* ================= M2 ================= */
add('m2','The five tools you will live in','Lesson',`
<h1>Every task maps to one of five platforms.</h1>
${sl('m2-most-utilized-assets.jpg')}
<div class="tools">
  <button class="tool" onclick="jump('m4')"><span class="tn">Propel</span><span class="tr">Daily hub: forums, calendar, resources.</span><span class="tg">Module 4 &rarr;</span></button>
  <button class="tool" onclick="jump('m5')"><span class="tn">ActivePipe</span><span class="tr">Email marketing after launch.</span><span class="tg">Module 5 &rarr;</span></button>
  <button class="tool" onclick="jump('m6')"><span class="tn">Design Vault</span><span class="tr">Brand safe design studio.</span><span class="tg">Module 6 &rarr;</span></button>
  <button class="tool" onclick="jump('m7')"><span class="tn">ListTrac</span><span class="tr">Analytics and seller reports.</span><span class="tg">Module 7 &rarr;</span></button>
  <button class="tool" onclick="jump('m8')"><span class="tn">MoxiWorks</span><span class="tr">CMAs and presentations.</span><span class="tg">Module 8 &rarr;</span></button>
</div>`);

add('m2','The admin workflow','Lesson',`
<h1>Five steps, in this order.</h1>
${sl('m2-admin-workflow.jpg')}
<div class="steps">
  <div class="step"><div><h4>Listing setup &middot; <i>Dash</i></h4><p>Enter property data, upload media, ensure accuracy for global distribution.</p></div></div>
  <div class="step"><div><h4>Marketing creation &middot; <i>Design Vault &amp; ActivePipe</i></h4><p>Create branded materials and launch email campaigns.</p></div></div>
  <div class="step"><div><h4>Presentation support &middot; <i>MoxiWorks</i></h4><p>Build CMAs and listing presentations from live market data.</p></div></div>
  <div class="step"><div><h4>Internal comms &middot; <i>Propel</i></h4><p>Share resources, collaborate in forums, post off market listings.</p></div></div>
  <div class="step"><div><h4>Reporting &middot; <i>ListTrac</i></h4><p>Generate seller reports and track visibility across platforms.</p></div></div>
</div>`);

add('m2','How they connect','Lesson',`
<h1>One listing. Five jobs.</h1>
${sl('m2-bringing-together.jpg')}
<p>For admins, understanding how these platforms work together is the key to accuracy, efficiency and consistency. Used correctly they streamline operations and help agents deliver a higher level of service.</p>
<div class="note tip"><b>Mental model.</b> Data starts in Dash, becomes marketing in Design Vault and ActivePipe, becomes a pitch in MoxiWorks, gets coordinated in Propel, and gets measured in ListTrac.</div>`);

add('m2','Module 2 check','Quiz','__QUIZ__m2');

/* ================= M3 ================= */
add('m3','The campaign proposition','Lesson',`
<h1>Curators of <em>the unique.</em></h1>
${sl('m3-curators-unique.jpg')}
<p class="lead">SIR connects the world&rsquo;s most unique homes with the buyers who appreciate their potential.</p>
<div class="note"><b>Use this as your filter.</b> Every headline, image and layout decision in this module answers one question: does this celebrate what makes this property singular?</div>`);

add('m3','The messaging system','Lesson',`
<h1>One lead headline, four ways to extend it.</h1>
${sl('m3-messaging-system.jpg')}
<table class="tbl">
  <tr><th style="width:120px">Type</th><th>What it references</th></tr>
  <tr><td class="k">Universal</td><td>Works with any property shown.</td></tr>
  <tr><td class="k">Property</td><td>Specific features of the property shown.</td></tr>
  <tr><td class="k">Location</td><td>The locations shown.</td></tr>
  <tr><td class="k">Lifestyle</td><td>The lifestyle the property implies.</td></tr>
</table>`);

add('m3','Headlines by audience','Lesson',`
<h1>Each audience gets its own angle.</h1>
<div class="grid3">
  <div class="card"><h4>Buyers &amp; renters</h4><ul><li>Unique access</li><li>Unique leadership</li><li>Call to action</li></ul></div>
  <div class="card"><h4>Sellers</h4><ul><li>Unique appreciation</li><li>Unique leadership</li><li>Call to action</li></ul></div>
  <div class="card"><h4>Agents</h4><ul><li>Unique advantage</li><li>Unique leadership</li><li>Call to action</li></ul></div>
</div>
<div class="note tip"><b>Every angle pairs with the same two things:</b> unique leadership, then a call to action. Only the first line changes.</div>`);

add('m3','The copy bank','Lesson',`
<h1>Approved phrases, ready to use.</h1>
${sl('m3-headlines-for-all.jpg')}
<div class="grid2">
  <div class="card"><h4>Universal &middot; any property</h4>
    <p style="font-size:14px;color:var(--v-muted);margin-bottom:6px">The one</p>
    <ul><li>The one for you &middot; The special one &middot; The rare one</li><li>One of a kind &middot; Find your one &middot; Your one awaits</li></ul>
    <p style="font-size:14px;color:var(--v-muted);margin:10px 0 6px">Uniqueness</p>
    <ul><li>Curators of the unique &middot; Live unique</li><li>Homes as unique as you &middot; A genuine original</li></ul>
  </div>
  <div class="card"><h4>Property led &middot; matches the home</h4>
    <p style="font-size:14px;color:var(--v-muted);margin-bottom:6px">The [style] one</p>
    <ul><li>The midcentury one &middot; The contemporary one</li><li>The townhouse one &middot; The decadent one</li></ul>
    <p style="font-size:14px;color:var(--v-muted);margin:10px 0 6px">Uniqueness</p>
    <ul><li>Exquisite detail &middot; Uncommon beauty</li><li>True original &middot; Living masterpiece</li></ul>
  </div>
</div>`);

add('m3','Layout: the spectrum','Lesson',`
<h1>A flexible system, not a rigid template.</h1>
${sl('m3-layout.jpg')}
<p>Layouts are designed to reflect the era of each property and adapt to varying amounts of information. A <b>centered, simple, classic layout</b> appeals to our established core audiences.</p>
<div class="note"><b>These are two ends of a spectrum.</b> You can take elements from each to create layouts that blend both.</div>`);

add('m3','Layout: scale and spacing','Lesson',`
<h1>Two rules that fix most layouts.</h1>
${sl('m3-layout-considerations.jpg')}
<div class="grid2">
  <div class="card"><h4>Image scale</h4><p style="margin:0">Hero images should be <b>half the canvas width or more</b> so they stay the most prominent element. Supporting images stay significantly smaller to build hierarchy.</p></div>
  <div class="card"><h4>Spacing</h4><p style="margin:0">Every element needs room to breathe so it stays discernible in complex layouts. This applies to text most of all.</p></div>
</div>`);

add('m3','Logo: placement and clear space','Lesson',`
<h1>Where the logo goes, and how much room it needs.</h1>
${sl('m3-logo-masterbrand.jpg')}
<div class="grid2">
  <div class="card"><h4>Positioning</h4><p style="margin:0">Classic layouts: logo <b>centered at the bottom</b>. Modern layouts: logo <b>in a corner</b>.</p></div>
  <div class="card"><h4>Minimum distance</h4><p style="margin:0">Clear space from any element or canvas edge equals the <b>height of the &ldquo;S&rdquo;</b>, on every edge.</p></div>
</div>`);

add('m3','Logo: color and affiliates','Lesson',`
<h1>The background decides the logo color.</h1>
${sl('m3-logo-affiliates.jpg')}
<div class="card">
  <div class="kv"><div class="k">On SIR blue</div><div>Logo is <b>pure white</b>.</div></div>
  <div class="kv"><div class="k">On white / off white</div><div>Logo is <b>SIR blue</b>.</div></div>
  <div class="kv"><div class="k">Affiliates</div><div>Same rules. Choose the lockup that best complements the application size, scale and surrounding elements.</div></div>
</div>`);

add('m3','The three brand colors','Lesson',`
<h1>Three colors. <em>No exceptions.</em></h1>
${sl('m3-colors-rgb.jpg')}
<p style="font-size:14px;color:var(--v-muted)">Click any swatch to copy its hex code.</p>
<div class="sws">
  <button class="sw" onclick="copyHex('#002349')"><span class="chip" style="background:#002349;display:block"></span><span class="info"><span class="nm">SIR Blue</span><span class="vals">HEX #002349<br>RGB 0 &middot; 35 &middot; 73</span></span></button>
  <button class="sw" onclick="copyHex('#FFFFFF')"><span class="chip" style="background:#fff;border-bottom:1px solid var(--v-line);display:block"></span><span class="info"><span class="nm">Pure White</span><span class="vals">HEX #FFFFFF<br>RGB 255 &middot; 255 &middot; 255</span></span></button>
  <button class="sw" onclick="copyHex('#EDECE6')"><span class="chip" style="background:#EDECE6;display:block"></span><span class="info"><span class="nm">Off White</span><span class="vals">HEX #EDECE6<br>RGB 237 &middot; 236 &middot; 230</span></span></button>
</div>
<div class="note"><b>Why off white exists.</b> It brings a warm, modern background to the campaign and lets the brand stand out subtly on predominantly white spaces, like a banner on a mostly white website.</div>`);

add('m3','Colors in print','Lesson',`
<h1>One rule that saves a reprint.</h1>
${sl('m3-colors-cmyk.jpg')}
<div class="card">
  <div class="kv"><div class="k">Always safe</div><div>SIR blue and pure white work in both backgrounds and elements, on any print process.</div></div>
  <div class="kv"><div class="k">Newsprint</div><div>Use <b>pure white</b> for the light background. <b>Avoid off white</b>, it can appear muddy on the page.</div></div>
  <div class="kv"><div class="k">Off white</div><div>High quality lithographic and digital print only.</div></div>
</div>`);

add('m3','Typography','Lesson',`
<h1>Two families, one hierarchy.</h1>
${sl('m3-typography.jpg')}
<p><b>Freight Display Pro</b> is the primary typeface for headlines, titles and short statements. <b>Benton Sans</b> covers subheaders, body copy and calls to action.</p>
<div class="spec">
  <div class="r"><div class="d-h1">Large expressive headline</div><div class="who">FREIGHTDISP LIGHT<br>Large headlines</div></div>
  <div class="r"><div class="d-h2">Smaller detailed headline</div><div class="who">FREIGHTDISP BOOK<br>Detailed layouts</div></div>

add('m9','What Claude is','Lesson',`
<h1>Your copilot for everything written.</h1>

  <div class="card"><h4>Haiku</h4><p style="font-size:14px;margin:0">The fastest. High speed, light duty tasks.</p></div>
</div>`);

add('m9','The five ingredients','Lesson',`
<h1>What turns a vague request into a great response.</h1>
${sl('m9-prompt-structure.jpg')}
<div class="card">
  <div class="kv"><div class="k">1 &middot; Role</div><div>Tell Claude who to be: expertise, tone, perspective.</div></div>
  <div class="kv"><div class="k">2 &middot; Context</div><div>The background. Who the audience is, what the situation is.</div></div>
  <div class="kv"><div class="k">3 &middot; Task</div><div>Exactly what you want done. Use action verbs.</div></div>
  <div class="kv"><div class="k">4 &middot; Format</div><div>Length, structure, style. Bullet list, two paragraphs, table.</div></div>
  <div class="kv"><div class="k">5 &middot; Example</div><div>Optional but powerful. Show what good looks like.</div></div>
</div>`);

add('m9','Why most prompts fail','Lesson',`
<h1>The output is generic because the input was.</h1>
<div class="note tip" style="font-size:16px"><b>The key insight.</b> Claude works best when it understands <b>who it is talking to, what the situation is, and what success looks like</b>. Most people skip these three details and then wonder why the result feels generic.</div>
<div class="grid2">
  <div class="card"><h4>Vague</h4><p style="margin:0;color:var(--v-muted)">&ldquo;Write me a social post for a new listing.&rdquo;</p></div>
  <div class="card navy"><h4>Structured</h4><p style="margin:0">Role as a real estate social copywriter, context with your brand colors and voice, the task with the exact deliverable, and the format with slide count and character limits.</p></div>
</div>`);

/* ============ STATE ============ */
let idx=0, done=[], scores={}, booted=false;
try{
  done=JSON.parse(localStorage.getItem('mt2_done')||'[]');
  scores=JSON.parse(localStorage.getItem('mt2_scores')||'{}');
  idx=+(localStorage.getItem('mt2_idx')||0);
}catch(e){}
if(!(idx>=0&&idx<L.length))idx=0;
const save=()=>{try{
  localStorage.setItem('mt2_done',JSON.stringify(done));
  localStorage.setItem('mt2_scores',JSON.stringify(scores));
  localStorage.setItem('mt2_idx',idx);
}catch(e){}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const modOf=id=>MODS.find(m=>m.id===id);
const modNum=id=>MODS.findIndex(m=>m.id===id)+1;
const lessonsOf=id=>L.map((l,i)=>({...l,i})).filter(l=>l.m===id);
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ============ SIDEBAR ============ */
function renderSide(){
  const cur=L[idx];
  $('#sideNav').innerHTML=MODS.map(mo=>{
    const ls=lessonsOf(mo.id), d=ls.filter(l=>done.includes(l.i)).length;
    const all=d===ls.length, isCur=cur&&cur.m===mo.id;
    return `<section class="mod ${all?'done':''} ${isCur?'active open':''}">
      <button class="mod-h" onclick="tMod(this)" aria-expanded="${isCur}">
        <span class="mod-n">${all?'&#10003;':modNum(mo.id)}</span>
        <span class="mod-t"><span class="nm">${mo.n}</span><span class="ct">${d}/${ls.length} &middot; ${mo.d}</span></span>
        <span class="mod-chev">&#9656;</span>
      </button>
      <div class="mod-b">${ls.map(l=>`
        <button class="les ${done.includes(l.i)?'done':''} ${l.i===idx?'cur':''}" onclick="jumpTo(${l.i})">
          <span class="les-tick">&#10003;</span>
          <span class="les-x">${l.t}${l.k==='Quiz'?'<span class="les-kind">Knowledge check</span>':''}</span>
        </button>`).join('')}</div>
    </section>`;
  }).join('');

  const pct=Math.round(done.length/L.length*100);
  $('#tbFill').style.width=pct+'%';
  $('#sideBar').style.width=pct+'%';
  $('#sidePct').textContent=pct+'%';
  $('#sideMeta').textContent=`${done.length} of ${L.length} lessons`;
  $('#tbCount').innerHTML=`<b>${done.length}</b> / ${L.length} lessons`;

  const on=$('.les.cur');
  if(on&&booted){
    const r=on.getBoundingClientRect(), s=$('#side').getBoundingClientRect();
    if(r.top<s.top+70||r.bottom>s.bottom-10)on.scrollIntoView({block:'center'});
  }
}
function tMod(h){const m=h.parentNode;m.classList.toggle('open');h.setAttribute('aria-expanded',m.classList.contains('open'));}
function jumpTo(i){idx=i;render();if(window.innerWidth<=960)closeSide();}
function jump(mid){const i=L.findIndex(l=>l.m===mid);if(i>=0)jumpTo(i);}
function toggleSide(){$('#side').classList.toggle('open');$('#sideVeil').classList.toggle('on');}
function closeSide(){$('#side').classList.remove('open');$('#sideVeil').classList.remove('on');}

/* ============ RENDER ============ */
function render(){
  const l=L[idx], mo=modOf(l.m);
  const body=l.html.startsWith('__QUIZ__')?quizHtml(l.html.slice(8)):l.html;
  $('#lesson').innerHTML=
    `<div class="crumb"><span class="pill">Module ${modNum(l.m)}</span><span>${mo.n}</span><span class="sep">&rsaquo;</span><span>${l.k}</span></div>${body}`;
  $('#stage').scrollTop=0;

  $('#btnPrev').disabled=idx===0;
  const last=idx===L.length-1, nxt=L[idx+1];
  $('#btnNext').innerHTML=last?'Finish &#10003;':'Next &rarr;';
  $('#posLbl').innerHTML=last
    ? `Last lesson &middot; <b>${l.t}</b>`
    : `Up next: <b>${nxt.t}</b>`;

  if(l.k!=='Quiz'&&!done.includes(idx)){done.push(idx);}
  if(l.html==='__QUIZ__m9'||l.t==='The prompt library')setTimeout(renderPlib,0);
  renderSide();save();
}
function go(d){
  const l=L[idx];
  if(d>0&&l.k==='Quiz'&&!done.includes(idx)){toast('Answer every question above to continue');return;}
  if(d>0&&idx===L.length-1){showDone();return;}
  idx=Math.max(0,Math.min(L.length-1,idx+d));render();
}

/* ============ QUIZ ============ */
function quizHtml(mid){
  const Q=QUIZ[mid], mo=modOf(mid);
  return `<h1>${mo.n}: <em>knowledge check</em></h1>
  <p class="lead">Answer each question to complete the module. Miss one and the correct answer appears with an explanation, so it still counts as learning.</p>
  <div class="quiz" data-m="${mid}">
    <span class="eyebrow">Module ${modNum(mid)} &middot; ${Q.q.length} question${Q.q.length>1?'s':''}</span>
    <h2>${Q.t}</h2>
    <p class="qsub">Choose the best answer for each.</p>
    ${Q.q.map((q,qi)=>`<div class="qq" data-q="${qi}">
      <p class="qt"><span class="n">${String(qi+1).padStart(2,'0')}</span><span>${q.q}</span></p>
      ${q.o.map((o,oi)=>`<button class="qopt" onclick="ans(this,${qi},${oi})">${o}</button>`).join('')}
      <div class="qfb"></div>
    </div>`).join('')}
    <div class="qscore" id="qscore"><span class="num" id="qnum"></span><span class="lbl" id="qlbl"></span></div>
  </div>`;
}
function ans(btn,qi,oi){
  const wrap=btn.closest('.quiz'), mid=wrap.dataset.m, Q=QUIZ[mid], q=Q.q[qi], box=btn.closest('.qq');
  if(box.dataset.done)return;
  box.dataset.done='1';
  box.querySelectorAll('.qopt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok');});
  if(oi!==q.a)btn.classList.add('no');
  const fb=box.querySelector('.qfb');
  fb.innerHTML=(oi===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.e;
  fb.classList.add('show');
  scores[mid]=scores[mid]||{c:0,t:Q.q.length};
  if(oi===q.a)scores[mid].c++;
  if(wrap.querySelectorAll('.qq[data-done]').length===Q.q.length){
    const s=scores[mid];
    $('#qscore').classList.add('show');
    $('#qnum').textContent=s.c+'/'+s.t;
    $('#qlbl').textContent=s.c===s.t?'Perfect. Hit Next to continue.':'Module complete. Review the notes above, then hit Next.';
    if(!done.includes(idx))done.push(idx);
    toast(s.c===s.t?'&#10003; Perfect score':'&#10003; Module complete');
    renderSide();
  }
  save();
}

/* ============ PROMPT LIBRARY ============ */
const KIND={role:'Role',ctx:'Context',task:'Task',fmt:'Format'};
function renderPlib(){
  const el=$('#plib'); if(!el)return;
  el.innerHTML=PROMPTS.map(p=>`<article class="pc" data-g="${p.g}">
    <button class="pc-h" onclick="tCard(this)"><span><span class="t">${p.t}</span><span class="s">${p.s}</span></span><span class="chev">&#9656;</span></button>
    <div class="pc-b">
      <div class="ing">${p.p.map(x=>`<span class="i-${x[0]}">${KIND[x[0]]}</span>`).join('')}</div>
      <div class="pre"><button class="pcopy" onclick="copyPre(this)">Copy</button>${p.p.map(x=>`<span class="${x[0]}">${x[1]}</span>`).join('\n\n')}</div>
      <p class="pwhy"><b>Key move:</b> ${p.w}</p>
    </div></article>`).join('');
}
function pFilter(b){
  $$('.ptab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const g=b.dataset.g;
  $$('.pc').forEach(c=>{c.style.display=(g==='all'||c.dataset.g===g)?'':'none';});
}
function tCard(h){h.parentNode.classList.toggle('open');}
function tAcc(h){h.parentNode.classList.toggle('open');}
function copyPre(btn){
  const c=btn.parentNode.cloneNode(true);c.querySelector('.pcopy').remove();
  navigator.clipboard.writeText(c.innerText.trim()).then(()=>toast('&#10003; Prompt copied'));
}
function copyHex(h){navigator.clipboard.writeText(h).then(()=>toast('&#10003; '+h+' copied'));}

/* ============ LIGHTBOX ============ */
let lbList=[],lbI=0;
function openLb(f){
  lbList=$$('.slide img').map(i=>i.getAttribute('src').split('/').pop());
  lbI=Math.max(0,lbList.indexOf(f));
  paintLb();$('#lb').classList.add('on');
}
function paintLb(){
  $('#lbImg').src=IMG+lbList[lbI];
  $('#lbCount').textContent=lbList.length>1?`${lbI+1} / ${lbList.length}`:'';
  const one=lbList.length<2;
  $('.lb-prev').style.display=one?'none':'grid';
  $('.lb-next').style.display=one?'none':'grid';
}
function closeLb(e,force){if(force||e.target.id==='lb'||e.target.classList.contains('lb-x'))$('#lb').classList.remove('on');}
function lbNav(e,d){e.stopPropagation();if(lbList.length<2)return;lbI=(lbI+d+lbList.length)%lbList.length;paintLb();}

/* ============ COMPLETION ============ */
function showDone(){
  const tot=Object.values(scores).reduce((a,s)=>a+s.t,0), got=Object.values(scores).reduce((a,s)=>a+s.c,0);
  $('#lesson').innerHTML=`<div class="finish">
    <div class="seal">&#10003;</div>
    <span class="eyebrow">Training complete</span>
    <h2>You know the ecosystem.</h2>
    <p>Brand, playbook, the five platforms and the prompt library. You are ready to produce work that passes a brand review the first time.</p>
    <div class="stats" style="grid-template-columns:repeat(3,1fr);max-width:420px">
      <div class="s"><b>${L.length}</b><span>Lessons</span></div>
      <div class="s"><b>${got}/${tot||0}</b><span>Quiz answers</span></div>
      <div class="s"><b>9</b><span>Modules</span></div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="index.html">Back to Home</a>
      <button class="btn ghost" onclick="jumpTo(L.findIndex(l=>l.t==='The prompt library'))">Open the prompt library</button>
    </div>
  </div>`;
  $('#stage').scrollTop=0;
}
function resetAll(){
  if(!confirm('Reset your progress and start the training from the beginning?'))return;
  done=[];scores={};idx=0;save();render();toast('Progress reset');
}

/* ============ KEYS + BOOT ============ */
document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('on')){
    if(e.key==='Escape')$('#lb').classList.remove('on');
    else if(e.key==='ArrowLeft')lbNav(e,-1);
    else if(e.key==='ArrowRight')lbNav(e,1);
    return;
  }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
});
render();
booted=true;
</script>
</body>
