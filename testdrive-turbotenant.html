<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboTenant Test Drive · SkillCloud Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12395E; --navy-d:#0C2B49; --navy-btn:#14406B;
  --blue:#1F6FB2; --blue-l:#4A90C9;
  --ink:#243B53; --body:#33475B; --muted:#6B7C8F; --faint:#9AA9B7;
  --bg:#F5F6F8; --card:#fff; --line:#E2E7EC; --line-d:#CBD5DE;
  --green:#00A86B; --green-bg:#C9F0DE; --green-tx:#1B7A4B;
  --red:#D64545; --red-bg:#F8D9DD; --red-tx:#B02A37;
  --purple-bg:#EAE4F9; --purple:#7C5CDB;
  --ai-bg1:#EAF6FD; --ai-bg2:#CBE9F9;
  --chipbg:#EDF0F3;
  --referral:#1C2F5E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'Open Sans',Arial,sans-serif;background:var(--bg);color:var(--body);font-size:14px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--body)}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,.pop{font-family:'Poppins','Open Sans',sans-serif;color:var(--ink)}

/* ======= SkillCloud back strip ======= */
.sc-strip{background:#0a2647;color:#fff;display:flex;align-items:center;gap:12px;padding:0 22px;height:36px;font-size:12.5px;position:relative;z-index:90}
.sc-strip a{color:#d3e2f0;font-weight:700}
.sc-strip .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.35)}
.sc-strip b i{color:#2AA7DE;font-style:normal}
.sc-strip .note{color:#9fb4c9;margin-left:auto;font-size:12px}

/* ======= layout ======= */
.app{display:flex;min-height:calc(100vh - 36px)}
.sidebar{width:202px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 36px);overflow-y:auto}
.side-logo{display:flex;justify-content:center;padding:16px 0 10px}
.side-logo .ig{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7ED957,#2E9E49);display:grid;place-items:center;color:#fff;font-weight:800;font-size:7px;letter-spacing:.4px;text-align:center;line-height:1;font-family:'Poppins',sans-serif}
.referral{margin:4px 12px 14px;background:var(--referral);color:#fff;border-radius:6px;padding:9px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;justify-content:center;width:calc(100% - 24px)}
.referral:hover{background:#24396e}
.nav{padding:0 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:6px;color:#42566B;font-size:13.5px;cursor:pointer;margin-bottom:1px;white-space:nowrap;width:100%;text-align:left}
.nav-item svg{width:17px;height:17px;flex:none;stroke:#5B6E82;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:#F0F3F6}
.nav-item.on{background:#E7EDF3;color:var(--navy);font-weight:700}
.nav-item.on svg{stroke:var(--navy)}
.nav-sec{font-size:11px;color:var(--faint);padding:14px 14px 5px;font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.side-foot .sq{width:26px;height:26px;border-radius:6px;background:#17C3D4;display:grid;place-items:center;color:#083a44;font-size:6.5px;font-weight:800;flex:none;font-family:'Poppins',sans-serif}
.side-foot .chev{margin-left:auto;color:var(--muted)}
.main{flex:1;min-width:0;padding:26px 34px 70px;position:relative}
.main-inner{max-width:1080px;margin:0 auto}

/* ======= shared ======= */
.btn{border-radius:22px;padding:9px 22px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--navy-btn);color:#fff}
.btn.primary:hover{background:#1B4E80}
.btn.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.outline:hover{background:#F0F5FA}
.btn.sm{padding:7px 16px;font-size:11.5px}
.pill-toggle{display:inline-flex;border:1px solid var(--line-d);border-radius:5px;overflow:hidden;background:#fff}
.pill-toggle button{padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pill-toggle button.on{background:var(--navy);color:#fff;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 2px 10px;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600}
.badge.unpaid{background:var(--chipbg);color:var(--muted)}
.badge.paid{background:var(--green-bg);color:var(--green-tx)}
.badge.autopay{background:var(--navy);color:#fff}
.badge.pastdue{background:var(--red-bg);color:var(--red-tx);font-size:10.5px;letter-spacing:.5px;font-weight:700}
.badge.resolved{background:var(--navy);color:#fff}
.badge.openreq{background:var(--red-bg);color:var(--red-tx)}
.badge.progress{background:#FFF3CD;color:#8a6d1a}
.badge.new{background:var(--navy);color:#fff;font-size:10px;letter-spacing:.6px}
.badge.owned{background:#5B6E82;color:#fff;font-size:11px}
.badge.draft{background:var(--chipbg);color:var(--muted);font-size:10.5px;letter-spacing:.5px}
.filter-pill{display:inline-flex;align-items:center;gap:7px;background:var(--chipbg);border:1px solid transparent;border-radius:6px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--body)}
.filter-pill:hover{border-color:var(--line-d)}
.link-btn{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;background:none}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#16325C;color:#fff;padding:11px 22px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 26px rgba(10,38,71,.35);opacity:0;transition:.25s;z-index:400;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chat-fab{position:fixed;right:26px;bottom:80px;width:48px;height:48px;border-radius:50%;background:#E8F4FB;border:1px solid #BFDFF2;display:grid;place-items:center;color:var(--blue);box-shadow:0 4px 14px rgba(10,38,71,.13);z-index:60;font-size:19px}
.screen{display:none}
.screen.on{display:block}
.mono-eyebrow{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.hd-row h1{font-size:24px;font-weight:600}
.empty-wrap{text-align:center;padding:56px 20px}
.empty-wrap .big{font-size:17px;font-weight:700;color:var(--ink);font-family:'Poppins',sans-serif;margin-bottom:6px}
.empty-wrap p{color:var(--muted);font-size:13.5px;max-width:440px;margin:0 auto 18px}

/* ======= modal ======= */
.overlay{position:fixed;inset:0;background:rgba(20,35,52,.45);display:none;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:300;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:480px;padding:26px 28px;box-shadow:0 18px 60px rgba(10,30,50,.3);position:relative}
.modal h3{font-size:17px;margin-bottom:16px}
.modal .x{position:absolute;top:14px;right:16px;font-size:20px;color:var(--muted)}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.fld label .opt{color:var(--muted);font-weight:400}
.fld input[type=text],.fld input[type=date],.fld input[type=email],.fld input[type=number],.fld select,.fld textarea{width:100%;border:1px solid var(--line-d);border-radius:6px;padding:9px 12px;background:#fff}
.fld textarea{min-height:90px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{border:1px solid var(--line-d);border-radius:6px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--body);background:#fff}
.chips .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.ai-note{background:#EAF6FD;border-radius:6px;padding:10px 13px;font-size:12.5px;color:#2B5E82;display:flex;gap:8px}

/* ======= dashboard ======= */
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.greet{font-size:26px;font-weight:600;margin-bottom:14px}
.resi-label{font-size:14px;font-weight:700;color:#5B6E82;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pay-card .pc-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 6px}
.pay-card .pc-head h3{font-size:17px}
.pay-boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 22px 18px}
.pay-box{border:1px solid var(--line);border-radius:7px;padding:13px 16px;position:relative;overflow:hidden}
.pay-box .lb{font-size:12px;color:var(--muted);font-weight:600}
.pay-box .amt{font-size:22px;font-weight:700;font-family:'Poppins',sans-serif}
.pay-box .amt.g{color:var(--green)}
.pay-box .amt.r{color:#D32F2F}
.pay-box::after{content:'';position:absolute;right:14px;top:50%;transform:translateY(-50%);width:62px;height:62px;border-radius:50%;
  background:conic-gradient(currentColor 0 var(--pct,90%),#E8EAEE var(--pct,90%) 100%);
  -webkit-mask:radial-gradient(circle at center,transparent 56%,#000 57%);
  mask:radial-gradient(circle at center,transparent 56%,#000 57%)}
.pay-box.g::after{color:var(--green);--pct:91%}
.pay-box.r::after{color:#D32F2F;--pct:9%}
.pc-foot{border-top:1px solid var(--line);text-align:center;padding:11px}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}
.stat-strip .st{background:#fff;border:1px solid var(--line);margin-left:-1px;padding:20px 10px;text-align:center}
.stat-strip .st:first-child{border-radius:8px 0 0 8px;margin-left:0}
.stat-strip .st:last-child{border-radius:0 8px 8px 0}
.stat-strip svg{width:34px;height:34px;stroke:var(--navy);fill:none;stroke-width:1.4;margin-bottom:6px}
.stat-strip .lb{font-size:10.5px;letter-spacing:.6px;color:var(--muted);font-weight:700}
.stat-strip .num{font-size:22px;font-weight:700;color:var(--ink);font-family:'Poppins',sans-serif}
.todo-card{margin-top:18px;padding:20px 22px}
.todo-card h3{font-size:16.5px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.todo-input{display:flex;border:1px solid var(--line-d);border-radius:6px;overflow:hidden}
.todo-input input{flex:1;border:none;padding:10px 13px;outline:none}
.todo-input button{padding:0 16px;color:var(--navy);font-size:16px}
.todo-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.todo-chips .tc{background:var(--chipbg);border-radius:4px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--body)}
.todo-chips .tc:hover{background:#E2E8EE}
.todo-list{margin-top:12px}
.todo-list li{list-style:none;display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:13px;border-bottom:1px dashed var(--line)}
.todo-foot{text-align:right;margin-top:14px}
.vac-card{margin-top:18px;padding:18px 22px}
.vac-card h3{font-size:15px;margin-bottom:14px}
.vac-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.vac-grid .vg .lb{font-size:10.5px;letter-spacing:.6px;color:var(--muted);font-weight:700}
.vac-grid .vg .num{font-size:20px;font-weight:700;color:var(--ink)}
.pros-card{background:var(--purple-bg);border-radius:10px;padding:24px 22px;text-align:left}
.pros-card .bolt{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:14px}
.pros-card h3{font-size:16.5px;line-height:1.3;margin-bottom:10px}
.pros-card p{font-size:13px;color:#4A4066;margin-bottom:16px}
.pros-card .lm{display:inline-block;border:1.5px solid var(--navy);color:var(--navy);border-radius:20px;padding:8px 26px;font-size:11.5px;font-weight:700;letter-spacing:.6px}
.qa-list{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qa-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line)}
.qa-list button:last-child{border-bottom:none}
.qa-list button:hover{background:#F6F9FC}
.qa-list .ic{width:20px;text-align:center;color:var(--navy)}
.qa-list .ar{margin-left:auto;color:var(--faint)}

/* ======= messages ======= */
.msg-wrap{display:grid;grid-template-columns:295px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;min-height:560px}
.msg-left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.msg-left-hd{padding:16px 16px 0}
.msg-left-hd .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.msg-left-hd h2{font-size:20px}
.msg-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);padding:0 16px}
.msg-tabs button{padding:8px 2px 9px;font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent}
.msg-tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.chat-list{overflow-y:auto;flex:1;max-height:520px}
.chat-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.chat-item:hover,.chat-item.on{background:#EFF4F8}
.chat-item .nm{font-size:13.5px;font-weight:700;color:var(--ink)}
.chat-item .sub{font-size:12px;color:var(--body)}
.chat-item .pv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.chat-item .tm{margin-left:auto;font-size:11.5px;color:var(--muted);flex:none}
.conv{display:flex;flex-direction:column;min-width:0}
.conv-hd{display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line)}
.conv-hd .nm{font-weight:700;color:var(--ink);font-size:14.5px}
.conv-hd .sub{font-size:12px;color:var(--muted)}
.conv-body{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:4px;max-height:430px}
.bubble{max-width:68%;padding:9px 14px;border-radius:9px;font-size:13.5px;line-height:1.55;white-space:pre-line}
.bubble.in{background:#EDF0F3;color:var(--body);align-self:flex-start;border-bottom-left-radius:3px}
.bubble.out{background:#2E6EA6;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.bub-meta{font-size:10.5px;color:var(--faint);margin:2px 4px 8px;align-self:flex-end}
.bub-meta.l{align-self:flex-start}
.composer{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.composer .plus{width:30px;height:30px;border:1.5px solid var(--line-d);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px;flex:none}
.composer input{flex:1;border:1px solid var(--line-d);border-radius:6px;padding:10px 14px;outline:none}
.composer .send{background:var(--navy-btn);color:#fff;border-radius:20px;padding:9px 22px;font-size:12px;font-weight:700;letter-spacing:.6px}
.qr-pop{position:absolute;bottom:70px;left:40px;width:340px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(10,30,50,.22);padding:16px;z-index:80;display:none;max-height:430px;overflow-y:auto}
.qr-pop.on{display:block}
.qr-pop h4{font-size:14.5px;margin-bottom:4px}
.qr-pop .note{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.qr-tpl{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.qr-tpl .bd{padding:11px 13px}
.qr-tpl .nm{font-weight:700;color:var(--ink);font-size:13px;display:flex;justify-content:space-between}
.qr-tpl p{font-size:12px;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qr-tpl .use{display:block;width:100%;text-align:center;background:#F2F6FA;color:var(--navy);font-size:11.5px;font-weight:700;letter-spacing:.5px;padding:8px}

/* ======= properties ======= */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.prop-card{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.prop-card:hover{box-shadow:0 8px 22px rgba(10,38,71,.1)}
.prop-thumb{height:120px;background:linear-gradient(135deg,#D8E4EE,#B9CCDD);display:grid;place-items:center;font-size:34px}
.prop-card .bd{padding:13px 16px}
.prop-card .ttl{font-weight:700;color:var(--ink);font-size:14px}
.prop-card .sub{font-size:12.5px;color:var(--muted)}
.prop-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px}
.prop-card .rent{font-weight:700;color:var(--ink)}
.pd-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:2px}
.pd-thumb{width:96px;height:82px;border-radius:7px;background:linear-gradient(135deg,#D8E4EE,#B9CCDD);display:grid;place-items:center;font-size:30px;flex:none}
.pd-title{font-size:19px;font-weight:600;line-height:1.3}
.pd-sub{font-size:13px;color:var(--body);margin-top:4px}
.pd-meta{margin-left:auto;text-align:right;flex:none}
.pd-meta .row1{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px}
.pd-meta .kv{font-size:13px;color:var(--body)}
.pd-meta .kv b{color:var(--ink)}
.pd-meta .kv .k{font-size:11px;letter-spacing:.5px;color:var(--muted);font-weight:700}
.gray-btn{background:#EDF0F3;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.pd-tabs{margin-top:16px}
.purple-banner{background:var(--purple-bg);border-radius:9px;padding:16px 20px;display:flex;align-items:center;gap:16px;margin:18px 0}
.purple-banner .bolt{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.purple-banner h4{font-size:15px;margin-bottom:3px}
.purple-banner p{font-size:12.5px;color:#4A4066}
.purple-banner .lm{margin-left:auto;flex:none;border:1.5px solid var(--navy);color:var(--navy);border-radius:20px;padding:8px 22px;font-size:11px;font-weight:700;letter-spacing:.6px;background:#fff}
.purple-banner .x{color:var(--muted);font-size:17px;flex:none;align-self:flex-start}
.ov-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini-stats .st{padding:18px 10px;text-align:center;border-left:1px solid var(--line)}
.mini-stats .st:first-child{border-left:none}
.mini-stats svg{width:30px;height:30px;stroke:var(--navy);fill:none;stroke-width:1.4;margin-bottom:4px}
.mini-stats .lb{font-size:10.5px;letter-spacing:.6px;color:var(--muted);font-weight:700}
.mini-stats .num{font-size:20px;font-weight:700;color:var(--ink)}
.sec-card{margin-top:18px}
