function DynamicList({ value, onChange, placeholder }) {
  const items = value && value.length ? value : [""];
  function update(i, v){ const next=[...items]; next[i]=v; onChange(next); }
  function add(){ onChange([...items, ""]); }
  function remove(i){ const next = items.filter((_,idx)=>idx!==i); onChange(next.length?next:[""]); }
  return (
    <div className="space-y-2">
      {items.map((it, i) => (
        <div key={i} className="flex items-center gap-2">
          <input value={it} onChange={e=>update(i, e.target.value)} placeholder={placeholder}
            className="focus-ring flex-1 rounded-lg border px-3 py-2 text-sm" style={{borderColor:"var(--line)", background:"white"}}/>
          <button onClick={()=>remove(i)} className="rounded-md p-1.5 text-[#9fb4c9] hover:text-[var(--warn)]">{I("trash","w-3.5 h-3.5")}</button>
        </div>
      ))}
      <button onClick={add} className="flex items-center gap-1 text-xs font-medium" style={{color:"var(--teal)"}}>{I("plus","w-3.5 h-3.5")} Add item</button>
    </div>
  );
}

function DynamicChecklist({ value, defaults, onChange }) {
  const items = (value && value.length) ? value : (defaults||[]).map(t=>({text:t, done:false}));
  function toggle(i){ const next=[...items]; next[i]={...next[i], done:!next[i].done}; onChange(next); }
  function updateText(i, t){ const next=[...items]; next[i]={...next[i], text:t}; onChange(next); }
  function add(){ onChange([...items, {text:"", done:false}]); }
  function remove(i){ onChange(items.filter((_,idx)=>idx!==i)); }
  return (
    <div className="space-y-2">
      {items.map((it,i)=>(
        <div key={i} className="flex items-center gap-2">
          <button onClick={()=>toggle(i)} className="flex h-5 w-5 shrink-0 items-center justify-center rounded border-2"
            style={{borderColor: it.done ? "var(--ok)" : "var(--line)", background: it.done ? "var(--ok)" : "white"}}>
            {it.done && I("check","w-3 h-3 text-white")}
          </button>
          <input value={it.text} onChange={e=>updateText(i,e.target.value)}
            className={`focus-ring flex-1 rounded-lg border px-3 py-2 text-sm ${it.done ? "line-through opacity-60" : ""}`} style={{borderColor:"var(--line)", background:"white"}}/>
          <button onClick={()=>remove(i)} className="rounded-md p-1.5 text-[#9fb4c9] hover:text-[var(--warn)]">{I("trash","w-3.5 h-3.5")}</button>
        </div>
      ))}
      <button onClick={add} className="flex items-center gap-1 text-xs font-medium" style={{color:"var(--teal)"}}>{I("plus","w-3.5 h-3.5")} Add item</button>
    </div>
  );
}

/* ---------------- LESSON PLAYER ---------------- */
const LESSON_STEPS = ["The Situation","The Concept","Analyze","Decide","Communicate","Consequences","Apply It"];

function LessonPlayer({ lesson, path, saved, onSave, onComplete, back }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState(saved || { analyze:"", decision:"", message:"", apply:"" });

  useEffect(()=>{ onSave(lesson.id, answers); }, [answers]);

  function next(){ if(step<LESSON_STEPS.length-1) setStep(step+1); else { onComplete(lesson.id, answers); } }

                <textarea rows={5} value={answers.analyze} onChange={e=>setAnswers({...answers, analyze:e.target.value})}

            {step===3 && (

                <p className="mb-3 text-sm" style={{color:"var(--ink)"}}>{lesson.communicate.prompt}</p>

              <p className="mb-2 mt-5 text-xs font-semibold uppercase tracking-wide" style={{color:"var(--brass)"}}>What You Know</p>

function MatrixTool({ doc, onChange }) {
  const quads = doc.quads || { hh:[""], hl:[""], lh:[""], ll:[""] };
  function setQ(key, val){ onChange({ ...doc, quads: { ...quads, [key]: val } }); }
  const Q = ({k, title, sub, bg}) => (
    <div className="rounded-xl border p-4" style={{borderColor:"var(--line)", background:bg}}>
      <p className="text-sm font-semibold" style={{color:"var(--ink)"}}>{title}</p>
      <p className="mb-3 text-[11px]" style={{color:"var(--slate)"}}>{sub}</p>
      <DynamicList value={quads[k]} onChange={v=>setQ(k,v)} placeholder="Add a task..."/>
    </div>
  );
  return (
    <div className="grid grid-cols-1 gap-4 md:grid-cols-2">
      <Q k="hh" title="High Impact / Urgent" sub="Do immediately" bg="rgba(181,83,60,0.06)"/>
      <Q k="hl" title="High Impact / Not Urgent" sub="Schedule deliberately" bg="rgba(15,61,62,0.06)"/>
      <Q k="lh" title="Low Impact / Urgent" sub="Delegate if possible" bg="rgba(23,195,212,0.08)"/>
      <Q k="ll" title="Low Impact / Not Urgent" sub="Delay or drop" bg="var(--parchment)"/>
    </div>
  );
}

function CapacityTool({ doc, onChange }) {
  const rows = doc.rows && doc.rows.length ? doc.rows : [{person:"", available:"", committed:"", notes:""}];
  function update(i, key, val){ const next=[...rows]; next[i]={...next[i],[key]:val}; onChange({...doc, rows:next}); }
  function add(){ onChange({...doc, rows:[...rows, {person:"", available:"", committed:"", notes:""}]}); }
  function remove(i){ onChange({...doc, rows: rows.filter((_,idx)=>idx!==i)}); }
  return (
    <div className="overflow-x-auto">
      <table className="w-full border-collapse text-sm">
        <thead>
          <tr className="text-left text-[11px] uppercase tracking-wide" style={{color:"var(--slate)"}}>
            <th className="pb-2">Person</th><th className="pb-2">Hours available</th><th className="pb-2">Hours committed</th><th className="pb-2">Notes</th><th></th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r,i)=>(
            <tr key={i} className="border-t" style={{borderColor:"var(--line)"}}>
              <td className="py-2 pr-2"><input value={r.person} onChange={e=>update(i,"person",e.target.value)} className="focus-ring w-full rounded-md border px-2 py-1.5" style={{borderColor:"var(--line)"}}/></td>
              <td className="py-2 pr-2"><input value={r.available} onChange={e=>update(i,"available",e.target.value)} className="focus-ring w-24 rounded-md border px-2 py-1.5" style={{borderColor:"var(--line)"}}/></td>
              <td className="py-2 pr-2"><input value={r.committed} onChange={e=>update(i,"committed",e.target.value)} className="focus-ring w-24 rounded-md border px-2 py-1.5" style={{borderColor:"var(--line)"}}/></td>
              <td className="py-2 pr-2"><input value={r.notes} onChange={e=>update(i,"notes",e.target.value)} className="focus-ring w-full rounded-md border px-2 py-1.5" style={{borderColor:"var(--line)"}}/></td>
              <td><button onClick={()=>remove(i)} className="p-1.5 text-[#9fb4c9] hover:text-[var(--warn)]">{I("trash","w-3.5 h-3.5")}</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <button onClick={add} className="mt-3 flex items-center gap-1 text-xs font-medium" style={{color:"var(--teal)"}}>{I("plus","w-3.5 h-3.5")} Add person</button>
    </div>
  );
}

        <textarea rows={3} value={values.reflection||""} onChange={e=>setField("reflection", e.target.value)}

function ToolWorkspace({ tool, doc, onChange, back }) {
  const values = doc.values || {};
  function setField(key, val){ onChange({ ...doc, values: { ...values, [key]: val } }); }
  return (
    <div className="mx-auto max-w-3xl pb-16">

            {f.type==="textarea" && <textarea rows={3} value={values[f.key]||""} onChange={e=>setField(f.key,e.target.value)} className="focus-ring w-full rounded-lg border p-3 text-sm" style={{borderColor:"var(--line)"}}/>}

        <p className="pt-2 text-right text-[11px] font-mono" style={{color:"var(--slate)"}}>Saved automatically</p>
      </div>

      </section>

      <section>
        <p className="mb-3 text-xs font-semibold uppercase tracking-wide" style={{color:"var(--slate)"}}>Toolkit Documents ({toolDocs.length})</p>
        {toolDocs.length ? (
          <div className="grid grid-cols-1 gap-3 md:grid-cols-2">
            {toolDocs.map(t=>(
              <div key={t.id} className="rounded-xl border p-4" style={{borderColor:"var(--line)", background:"white"}}>
                <p className="font-semibold" style={{color:"var(--ink)"}}>{t.title}</p>
                <p className="text-[11px] font-mono" style={{color:"var(--slate)"}}>In progress</p>
              </div>
            ))}
          </div>
        ) : <p className="text-sm" style={{color:"var(--slate)"}}>No toolkit documents started yet.</p>}
      </section>
    </div>
  );
}

/* ---------------- MY PROGRESS ---------------- */
function MyProgress({ state }) {
  const skillCounts = useMemo(()=>{
    const counts = {}; SKILLS.forEach(s=>counts[s]=0);
    ALL_LESSONS.forEach(l=>{ if(state.completedLessons[l.id]) l.skills.forEach(s=>counts[s]++); });
    SIMULATIONS.forEach(s=>{ if(state.completedSims[s.id]) s.skills.forEach(sk=>counts[sk]++); });
    return counts;
  }, [state]);

  const completedCount = Object.keys(state.completedLessons).length + Object.keys(state.completedSims).length;

  return (
    <div className="mx-auto max-w-4xl space-y-8 pb-16">
      <div>
        <h1 className="font-display text-3xl" style={{color:"var(--ink)"}}>My Progress</h1>
        <p className="mt-2 text-sm" style={{color:"var(--slate)"}}>{completedCount} of {TOTAL_ITEMS} lessons and simulations complete. Skill development, not module completion, is what matters here.</p>
      </div>
      <div className="rounded-2xl border p-6" style={{borderColor:"var(--line)", background:"white"}}>
        <div className="space-y-5">
          {SKILLS.map(s=>{
            const lvl = levelFor(skillCounts[s]);
            return (
              <div key={s}>
                <div className="mb-1.5 flex items-center justify-between">
                  <span className="text-sm font-medium" style={{color:"var(--ink)"}}>{s}</span>
                  <span className="rounded-full px-2.5 py-0.5 text-[11px] font-semibold" style={{background:"var(--parchment-2)", color:"var(--teal)"}}>{LEVELS[lvl]}</span>
                </div>
                <div className="flex gap-1.5">
                  {[0,1,2,3].map(i=>(
                    <div key={i} className="h-2 flex-1 rounded-full" style={{background: i<=lvl ? "var(--brass)" : "var(--parchment-2)"}}/>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App() {
  const [state, setState] = useState(emptyState());
  const [loaded, setLoaded] = useState(false);
  const [section, setSection] = useState("home");
  const [activePathId, setActivePathId] = useState(null);
  const [activeLessonId, setActiveLessonId] = useState(null);
  const [activeSimId, setActiveSimId] = useState(null);
  const [activeToolId, setActiveToolId] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) setState({ ...emptyState(), ...JSON.parse(raw) });
      } catch (e) { /* first run */ }
      finally { setLoaded(true); }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
    }, 400);
  }, [state, loaded]);

  const overallPct = Math.round(((Object.keys(state.completedLessons).length + Object.keys(state.completedSims).length) / TOTAL_ITEMS) * 100);

  function goto(sec){ setSection(sec); setActivePathId(null); setActiveLessonId(null); setActiveSimId(null); setActiveToolId(null); }

  function openPath(id){ setActivePathId(id); }
  function openLesson(id){
    const lesson = ALL_LESSONS.find(l=>l.id===id);
    setActivePathId(lesson.pathId); setActiveLessonId(id); setSection("paths");
  }
  function saveLessonAnswers(id, answers){ setState(s=>({...s, lessonResponses:{...s.lessonResponses, [id]: {...answers}}})); }
  function completeLesson(id, answers){
    setState(s=>({...s,
      completedLessons: {...s.completedLessons, [id]: true},
      lessonResponses: {...s.lessonResponses, [id]: {...answers, completedAt: Date.now()}}
    }));
    setActiveLessonId(null);
  }

  function openSim(id){ setActiveSimId(id); setSection("sims"); }
  function saveSimAnswers(id, answers){ setState(s=>({...s, simResponses:{...s.simResponses, [id]: {...answers}}})); }
  function completeSim(id, answers){
    setState(s=>({...s,
      completedSims: {...s.completedSims, [id]: true},
      simResponses: {...s.simResponses, [id]: {...answers, completedAt: Date.now()}}
    }));
    setActiveSimId(null);
  }

  function openTool(id){ setActiveToolId(id); }
  function saveTool(id, doc){ setState(s=>({...s, toolkit: {...s.toolkit, [id]: doc}})); }

  let content = null;
  if (section === "home") {
    content = <Home state={state} setSection={goto} openLesson={openLesson} openSim={openSim}/>;
  } else if (section === "paths") {
    if (activeLessonId) {
      const lesson = ALL_LESSONS.find(l=>l.id===activeLessonId);
      const path = PATHS.find(p=>p.id===lesson.pathId);
      content = <LessonPlayer lesson={lesson} path={path} saved={state.lessonResponses[lesson.id]}
        onSave={saveLessonAnswers} onComplete={completeLesson} back={()=>setActiveLessonId(null)}/>;
    } else if (activePathId) {
      const path = PATHS.find(p=>p.id===activePathId);
      content = <PathDetail path={path} state={state} openLesson={(id)=>setActiveLessonId(id)} back={()=>setActivePathId(null)}/>;
    } else {
      content = <PathsList state={state} openPath={openPath}/>;
    }
  } else if (section === "sims") {
    if (activeSimId) {
      const sim = SIMULATIONS.find(s=>s.id===activeSimId);
      content = <SimulationPlayer sim={sim} saved={state.simResponses[sim.id]} onSave={saveSimAnswers} onComplete={completeSim} back={()=>setActiveSimId(null)}/>;
    } else {
      content = <SimulationsList state={state} openSim={openSim}/>;
    }
  } else if (section === "toolkit") {
    if (activeToolId) {
      const tool = TOOLKIT.find(t=>t.id===activeToolId);
      const doc = state.toolkit[tool.id] || {};
      content = <ToolWorkspace tool={tool} doc={doc} onChange={(d)=>saveTool(tool.id, d)} back={()=>setActiveToolId(null)}/>;
    } else {
      content = <ToolkitList openTool={openTool}/>;
    }
  } else if (section === "work") {
    content = <MyWork state={state}/>;
  } else if (section === "progress") {
    content = <MyProgress state={state}/>;
  }

  return (
    <div className="flex h-full w-full overflow-hidden" style={{background:"var(--parchment)"}}>
      <Sidebar section={section} setSection={goto} overallPct={overallPct}/>
      <main className="flex-1 overflow-y-auto px-8 py-10">
        {loaded ? content : <p className="text-sm" style={{color:"var(--slate)"}}>Loading…</p>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
